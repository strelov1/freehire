# rumdl lints every tracked Markdown file (it honours .gitignore); CI runs `rumdl check .`
# and lefthook runs it on staged files. `rumdl fmt` fixes what it reports as fixable.
# What is switched off below is a house style, each for a stated reason, not noise.

[global]
# Generated by web/scripts/gen-api-docs.mjs; fixed through the generator, never by hand.
exclude = [
  "docs/API.md",
  "docs/API.internal.md",
  # Served raw at freehire.me/agent-setup.md for agents to execute: what they read is the
  # source, so a fence language or <…> around a URL changes the text they are handed.
  "web/static/agent-setup.md",
]
disable = [
  # Line length. Prose here is written both wrapped and one-paragraph-per-line, and both
  # read the same once rendered; 77k of the first run's 89k findings were this rule alone.
  "MD013",
  # "First line is a top-level heading". OpenSpec's proposal, design and tasks files open
  # on `## Why` / `## Context` by the tool's own template, and an agent instruction file
  # may open on a tool directive comment (`<!-- agnix-disable … -->`).
  "MD041",
  # "Emphasis used instead of a heading". A bold run-in label opening a paragraph
  # (`**Board registry:** each adapter …`, `**SEEK traps**`) is the house style for a
  # named rule inside a section, and it is not a heading.
  "MD036",
  # "Spaces inside code span". The space is often the point: a literal suffix (` (CC)`),
  # a regex (` (\d+)`), a list marker (`*   `). The auto-fix strips it and changes what
  # the span says, so the rule cannot be trusted to fix, and a space nobody meant is rare.
  "MD038",
  # Heading increment and a single top-level heading. Their auto-fixes rewrite a document's
  # structure: a plan with one `#` per part lost every part heading's level, a review's
  # whole tail moved down a level, and the README's H3 tagline grew to H2. Heading levels
  # are the author's choice here.
  "MD001",
  "MD025",
]

# Inline HTML: only what GitHub renders and the README and architecture map use on purpose
# (the logo's <picture>, badges, diagram images). Anything else is prose that meant a code
# span (`<title>`, `<board>`).
[MD033]
allowed-elements = ["a", "br", "div", "img", "picture", "source"]

# A line that wraps so that it opens on an issue reference (`#2710 fixed …`) is prose, not
# a heading missing its space; without this the fix turns it into an H1.
[MD018]
magiclink = true
