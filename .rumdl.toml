# rumdl (https://github.com/rvben/rumdl), run by the `docs` CI job and by lefthook.
# CI and .mise.toml pin the version together with its digest (see ci.yml).
#
# The policy: keep the rules that catch a document that RENDERS WRONG — an unclosed code
# fence swallowing the rest of the file, a skipped heading level, a malformed list or table,
# a duplicate heading — and turn off the ones that argue with how this repository writes
# prose. Every rule that is off says why, and a rule is turned off for the repository, never
# per file, so a new violation of a rule that is on fails instead of joining a baseline.

[global]
# Gitignored files (node_modules, build output) are skipped by default.
exclude = [
  # Archived change proposals are a historical record, frozen as written (the same line
  # _typos.toml draws). Fixing them would rewrite what the project decided at the time.
  "openspec/changes/archive/**",
  # Generated by web/scripts/gen-api-docs.mjs from openapi/api.openapi.json, and CI
  # fails when the committed copy differs from a fresh run — a hand fix would not survive.
  "docs/API.md",
  "docs/API.internal.md",
]

disable = [
  # MD012, consecutive blank lines. Invisible in the rendered page. `openspec archive` merges a
  # change's deltas into the spec and leaves doubled blank lines behind (167 of the 177 in
  # openspec/specs), so a rule that fails on them fails every archive PR.
  "MD012",
  # MD013, line length. Prose is written one paragraph to a line, in AGENTS.md, specs and
  # tasks alike, so a limit flags most of the repository (37k lines outside the archive)
  # and wrapping would turn every later edit into a whole-paragraph diff.
  "MD013",
  # MD022 and MD032, blank lines around headings and lists. CommonMark ends a paragraph at a
  # heading or a list, so a list straight under its heading or under a `**Files:**` label
  # renders the same with or without the blank line. It is the layout the openspec templates
  # and the superpowers plan skill both write (`#### Scenario:` then `- **WHEN**`;
  # `## Purpose` straight under the title block), and `openspec archive` writes the same into
  # openspec/specs, so the rules would fail ~4k places and every PR that follows the
  # templates. What a blank line DOES decide — a code fence's edges (MD031) and a list item's
  # continuation lines (MD077) — stays on.
  "MD022",
  "MD032",
  # MD026, trailing punctuation in a heading. A heading that is a sentence ends in a full
  # stop (the README tagline, "NOT OPTIONAL."); the rule's concern, a stray `:` or `!`, has
  # never broken a page here.
  "MD026",
  # MD033, inline HTML. `<details>`, `<br>`, `<img>` and `<picture>` are how the README and
  # the docs collapse a long section or size a logo; Markdown has no equivalent.
  "MD033",
  # MD034, bare URLs. GitHub renders a bare URL as a link, and the places that carry them
  # (adapter notes, the code of conduct) quote them verbatim from a source.
  "MD034",
  # MD036, bold line used as a heading. `**Why:**` and `**Revisit if …**` lead paragraphs in
  # the specs and the decision records; they are labels, not sections that belong in a TOC.
  "MD036",
  # MD077, list continuation indent. Measured here it reports 57 lines in five openspec
  # changes, nearly all an ordered item's continuation lines aligned under the text after
  # `1. ` — correctly — as "over-indented", and its fix dedents them to a lazy continuation,
  # which is the wrong direction. The breakage it is meant to find, a continuation that
  # falls out of its item, is visible in the rendered page.
  "MD077",
  # MD038, spaces inside a code span. The space is the content: `query: ` and ` (CC)` name a
  # prefix or suffix WITH its separator, and "fixing" it drops the very character the
  # sentence is about.
  "MD038",
  # MD040, fence without a language. A fence holding a diagram, a directory tree or command
  # output has no language to name, and `text` on each would be noise.
  "MD040",
  # MD064, runs of spaces inside a line. A double space after a full stop and aligned
  # columns in a hand-drawn row are prose habit, not markup, and render as one space anyway.
  "MD064",
  # MD076, loose versus tight list. Whether items are separated by blank lines is a
  # presentation choice that both renders correctly; plans mix the two on purpose, a tight
  # run of one-line items next to a loose run of paragraphs.
  "MD076",
  # MD041, first line must be a heading. openspec's tasks and spec deltas open with a
  # section (`## 1. …`) or a front-matter-like block by the format's own convention.
  "MD041",
]
