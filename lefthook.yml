pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "*.go"
      run: |
        files=$(gofmt -l {staged_files})
        if [ -n "$files" ]; then
          echo "Not gofmt-clean:"
          echo "$files"
          exit 1
        fi
    go-vet:
      glob: "*.go"
      run: go vet ./...
    # Ratchet mode: only fails on issues in lines this commit touches, not
    # the pre-existing backlog. Same policy as CI (see .golangci.yml).
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD --allow-parallel-runners ./...
    # Blocking: `govulncheck ./...` is clean on main under the pinned toolchain, so a
    # failure now comes from a dependency advisory or from the commit itself.
    # A missing binary skips on purpose, unlike gitleaks; the CI job is the gate.
    # The glob mirrors the path scope of .github/workflows/govulncheck.yml's
    # pull_request trigger.
    govulncheck:
      glob:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
      run: |
        if ! command -v govulncheck >/dev/null 2>&1; then
          echo "govulncheck not installed (mise install) - skipping"
          exit 0
        fi
        govulncheck ./...
    # Spelling over every staged file; _typos.toml decides what is checked, and
    # --force-exclude makes it honour that for files named explicitly. Steps aside when the
    # binary is missing: the docs CI job is the gate.
    typos:
      run: |
        if ! command -v typos >/dev/null 2>&1; then
          echo "typos not installed (mise install) - skipping"
          exit 0
        fi
        typos --force-exclude {staged_files}
    # Markdown structure over the staged docs (unclosed fences, heading levels, broken tables
    # and lists); .rumdl.toml decides what is checked and what is excluded, and a staged file
    # it excludes is skipped. Steps aside when the binary is missing: the docs CI job is the
    # gate.
    rumdl:
      glob: "*.md"
      run: |
        if ! command -v rumdl >/dev/null 2>&1; then
          echo "rumdl not installed (mise install) - skipping"
          exit 0
        fi
        rumdl check {staged_files}
    # Python lint and format over the staged files; ruff.toml decides the rules, and
    # --force-exclude makes it honour its exclusions for files named explicitly. Both checks
    # run so one pass reports everything. Steps aside when the binary is missing: the
    # python-lint CI job is the gate.
    ruff:
      glob: "*.py"
      run: |
        if ! command -v ruff >/dev/null 2>&1; then
          echo "ruff not installed (mise install) - skipping"
          exit 0
        fi
        status=0
        ruff check --force-exclude {staged_files} || status=1
        ruff format --check --force-exclude {staged_files} || status=1
        exit $status
    # internal/platform/db is generated and committed, so a query edited without
    # regenerating ships the OLD Go with every check green — nothing else here reads
    # both halves. Same shape of check as design-system's check:dist, except that an
    # untracked file counts too: a *new* generated file that was never committed is
    # untracked rather than modified, and a plain diff misses it.
    #
    # Globbed on the migrations as well as the queries. A renamed column is the other
    # way to make the generated code wrong, and sqlc.yaml decides what is generated at
    # all — a config that stops matching disables this check while it still reports
    # success.
    sqlc-drift:
      glob: "{migrations/*.sql,internal/platform/db/queries/*.sql,sqlc.yaml}"
      # An explicit `if` rather than `A && B || C`, which reads like "if A and B, else C"
      # and is not: a *failing* `make sqlc` would fall into C and report the code as
      # stale, a message pointing away from the real problem.
      #
      # The question here is "did regenerating leave anything UNSTAGED", which is not the
      # question CI asks. `git status --porcelain` reports two columns — index against
      # HEAD, and worktree against index — so the bare form would count the staged
      # generated changes being committed as drift, and block the very commit that fixes
      # it. CI keeps the bare form correctly: a fresh clone has an empty index, so there
      # the two questions have the same answer.
      run: |
        set -e
        make sqlc
        unstaged="$(git diff --name-only -- internal/platform/db)"
        untracked="$(git ls-files --others --exclude-standard -- internal/platform/db)"
        if [ -n "$unstaged$untracked" ]; then
          printf '%s\n' $unstaged $untracked
          echo 'Generated code was stale — make sqlc has just fixed it; stage the result.'
          exit 1
        fi

    # The HTTP contract, the same trap as sqlc: openapi/api.openapi.json and
    # internal/api/apigen (and web/src/lib/generated/api.ts) are generated from
    # typespec/ and committed.
    api-contract-drift:
      glob: "{typespec/*.tsp,typespec/tspconfig.yaml,ogen.yml}"
      run: |
        set -e
        make api-contract
        unstaged="$(git diff --name-only -- openapi internal/api/apigen web/src/lib/generated/api.ts)"
        untracked="$(git ls-files --others --exclude-standard -- openapi internal/api/apigen web/src/lib/generated/api.ts)"
        if [ -n "$unstaged$untracked" ]; then
          printf '%s\n' $unstaged $untracked
          echo 'Generated contract was stale — make api-contract has just fixed it; stage the result.'
          exit 1
        fi

    # docs/API*.md and the two Scalar OpenAPI documents are generated from
    # web/src/lib/docs/{api-spec,filters}.ts and committed, so the same trap as sqlc:
    # a filter added without regenerating ships with every local check green and only
    # the `web-work` CI job says so. PR #4321 spent three CI-fix attempts on exactly
    # this, editing Go while the log said "Run pnpm run gen:openapi".
    #
    # The glob is wide on purpose: filters.ts imports ../facets, which pulls in most of
    # src/lib, and both generators take under a second. The generated outputs are in
    # the glob too, so a hand edit to them, or a merge that brings them in, runs it.
    # No `root:` (see design-system-tokens below): the outputs live outside web/.
    # svelte-kit sync first: the generators load api-spec.ts through Vite, which needs
    # the $app/tsconfig it writes, and a fresh worktree has none.
    api-docs-drift: &api-docs-drift
      glob:
        - "web/src/lib/*.ts"
        - "web/src/lib/**/*.ts"
        - "web/scripts/gen-api-docs.mjs"
        - "web/scripts/gen-openapi.mjs"
        - "web/scripts/renderFilterSection.mjs"
        - "web/src/lib/docs/generated/*.json"
        - "docs/API.md"
        - "docs/API.internal.md"
      run: |
        set -e
        pnpm --dir web exec svelte-kit sync
        pnpm --dir web run gen:api-docs
        pnpm --dir web run gen:openapi
        stale="$(git diff --name-only -- docs/API.md docs/API.internal.md web/src/lib/docs/generated)"
        if [ -n "$stale" ]; then
          printf '%s\n' $stale
          echo 'API docs were stale — the generators have just fixed them; stage the result.'
          exit 1
        fi

    # Expand/contract for migrations, which was prose in AGENTS.md and read by nothing.
    # It is here rather than only in CI because the mistakes it catches — a UNIQUE
    # constraint that takes ACCESS EXCLUSIVE on a live table, a constraint added without
    # NOT VALID — are cheap to fix while writing the migration and expensive once the
    # file carries a version number someone else has applied.
    #
    # lefthook filters {staged_files} by the glob, so the script receives migrations and
    # nothing else. Read .squawk.toml for why the invocation is split in two.
    sql-migrations:
      glob: "migrations/*.sql"
      run: node scripts/check-migrations.mjs {staged_files}

    # This repository navigates by document — AGENTS.md is a table of links into the
    # blocks, each block links into its packages — and nothing has ever read those links.
    # A rename breaks them silently, and a broken one is worse than a missing one: it
    # sends the reader somewhere confidently.
    #
    # NO GLOB, THOUGH IT IS A CHECK ABOUT MARKDOWN. What breaks a link is renaming its
    # TARGET, which is usually a .go or a .svelte file — a glob on *.md would miss exactly
    # the commit that does the damage. A quarter of a second over the whole repository, so
    # the precision is not worth the hole.
    doc-links:
      run: node scripts/check-doc-links.mjs

    # Staged files over the token limit (scripts/check-file-size.mjs holds the limit, the
    # ignore list and the splitting instructions). The file-size CI job runs it over every file.
    file-size:
      run: node scripts/check-file-size.mjs

    # THE ONLY HOOK HERE THAT PREVENTS SOMETHING RATHER THAN REPORTING IT.
    #
    # Everything else in this file is a convenience: it fails locally so CI does not
    # have to, and skipping it costs a red run. This one is different. Once a
    # credential reaches the remote it is leaked — it is in the history, in every
    # clone and in the runner's cache — and the only real response is to revoke it.
    # Rewriting history does not un-leak anything. This hook is the last moment at
    # which that has not happened yet.
    #
    # .github/workflows/gitleaks.yml is NOT a redundant copy: it scans the whole
    # history and cannot be bypassed, so it covers whoever never ran `lefthook
    # install` or reached for --no-verify. But by the time it speaks the leak is
    # real. Two controls, two moments, neither replaces the other.
    #
    # No glob — a secret is not a file type, and the one that matters will be in
    # whatever nobody thought to list. `--staged` reads the index, so it sees
    # exactly what is about to be committed rather than the working tree around it.
    #
    # Unlike govulncheck above, a missing binary FAILS. A scanner that quietly
    # skips is worse than no scanner: it makes the commit look examined.
    # The rules in ast-grep/rules over the staged files. Unlike gitleaks it steps aside when
    # the binary is missing (`mise install` brings it): the ast-grep CI job is the gate.
    ast-grep:
      glob:
        - "**/*.go"
        - "**/*.ts"
        - "**/*.svelte"
      run: |
        if ! command -v ast-grep >/dev/null 2>&1; then
          echo 'ast-grep is not installed (mise install); the ast-grep CI job will check.'
          exit 0
        fi
        ast-grep scan --error {staged_files}
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo 'gitleaks is not installed (brew install gitleaks), and this hook will'
          echo 'not pretend a commit was scanned when it was not. Install it, or use'
          echo '--no-verify knowing CI scans the history anyway.'
          exit 1
        fi
        gitleaks git --staged --no-banner
    # A PACKAGE'S OWN ROOT IS NOT UNDER `**/`. The second pattern in each pair is
    # what reaches vite.config.ts, svelte.config.js, eslint.config.js and — in web —
    # cluster.js, which is the process that actually serves the site in production.
    # Thirteen such files sat outside every hook here, checked one at a time with
    # `lefthook run pre-commit --file`: only gitleaks fired, because it has no glob.
    #
    # NO `.oxlintrc.json` IN THESE TWO, THOUGH IT IS IN design-system-lint BELOW, AND
    # the difference is what the command does with its glob. These two pass
    # {staged_files} to eslint, which does not read that file and answers "File ignored
    # because no matching configuration was supplied" — a warning where the intent was a
    # check, so the glob would add noise and cover nothing. design-system-lint runs
    # `pnpm run lint` over its whole package, which is `oxlint --deny-warnings && eslint .`, so there
    # the config genuinely decides the outcome. The web and extension CI jobs run that
    # same whole-package lint on every push, which is what covers a rule switched off
    # here.
    web-lint:
      root: "web/"
      glob:
        - "web/**/*.{js,ts,svelte}"
        - "web/*.{js,ts,svelte}"
      run: pnpm exec eslint {staged_files}
    extension-lint:
      root: "extension/"
      glob:
        - "extension/**/*.{js,ts,svelte}"
        - "extension/*.{js,ts,svelte}"
      run: pnpm exec eslint {staged_files}
    # The same `format:check` the three CI jobs run, over the staged files only: oxfmt takes
    # its settings from the one .oxfmtrc.json at the repository root, and that file's
    # `ignorePatterns` already leave out what is not TypeScript, JavaScript or Svelte, so
    # these globs only decide when the hook has something to look at. A failure is fixed by
    # `pnpm run format` in the package. A staged file the config ignores (web/src/lib/generated)
    # is not an error, hence --no-error-on-unmatched-pattern. Unlike the lint commands above, these include .mjs
    # and .cjs — oxfmt formats them, and web/scripts is mostly .mjs.
    web-format:
      root: "web/"
      glob:
        - "web/**/*.{js,mjs,cjs,ts,mts,svelte}"
        - "web/*.{js,mjs,cjs,ts,mts,svelte}"
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    extension-format:
      root: "extension/"
      glob:
        - "extension/**/*.{js,mjs,cjs,ts,mts,svelte}"
        - "extension/*.{js,mjs,cjs,ts,mts,svelte}"
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    design-system-format:
      root: "design-system/"
      glob:
        - "design-system/**/*.{js,mjs,cjs,ts,mts,svelte}"
        - "design-system/*.{js,mjs,cjs,ts,mts,svelte}"
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    # The remaining design-system-* commands mirror the fast checks from the
    # `design-system` CI job (see .github/workflows/ci.yml) so a broken commit
    # fails locally instead of burning a CI run. build-storybook and its CSS
    # assertion are deliberately left out — too slow for pre-commit — so CI
    # still catches those for anyone who skips hooks.
    design-system-lint:
      root: "design-system/"
      glob:
        - "design-system/**/*.{js,ts,svelte}"
        - "design-system/*.{js,ts,svelte}"
        - "design-system/.oxlintrc.json"
      run: pnpm run lint
    # svelte.config.js and vitest.setup.ts are read by `svelte-kit sync`, which is the
    # first thing `check` runs, so a change to either can only be caught here.
    design-system-check:
      root: "design-system/"
      glob:
        - "design-system/**/*.{svelte,ts}"
        - "design-system/*.{svelte,ts}"
        - "design-system/{tsconfig.json,svelte.config.js}"
      run: pnpm run check
    design-system-test:
      root: "design-system/"
      glob:
        - "design-system/src/**"
        - "design-system/scripts/**"
      run: pnpm run test
    # check:dist rebuilds tokens/*.json -> dist/ and diffs — catches a token
    # edited without `pnpm build`, which otherwise ships stale CSS with every
    # check green.
    design-system-dist:
      root: "design-system/"
      glob:
        - "design-system/tokens/**"
        - "design-system/scripts/build-tokens.mjs"
        - "design-system/dist/**"
      run: pnpm run check:dist
    # BOTH PATTERNS, AND THE PAIR IS THE POINT. `**/` requires a separator, so
    # `design-system/src/**/*.svelte` matches src/email/email-preview.svelte and
    # NOT src/alert.svelte — which is 25 of the 26 primitives, every one of them a
    # direct child of src/. Measured with lefthook 1.13.6: `--file
    # design-system/src/alert.svelte` reported "skip, no matching staged files"
    # while the nested path ran.
    design-system-docs:
      root: "design-system/"
      glob:
        - "design-system/docs/**"
        - "design-system/src/*.svelte"
        - "design-system/src/**/*.svelte"
        - "design-system/src/*.stories.ts"
      run: pnpm run validate:docs

    # NO `root:` ON THESE TWO, AND THAT IS LOAD-BEARING. `root` does not merely set
    # the working directory: lefthook first discards every staged file outside it,
    # and only then applies the glob. So a command with `root: design-system/` can
    # never be triggered by a change under web/, however its glob is written — and
    # these two are the only commands here whose radius spans both sides. A colour
    # literal or an unreachable primitive can be introduced from either, which is
    # what the comment above them used to claim they caught. They did not: measured
    # with lefthook 1.13.6, `--file web/src/lib/logo.ts` skipped both.
    #
    # `pnpm --dir` from the repository root instead, where every path means what it
    # says. Not `--filter`: design-system and web are separate packages with their
    # own lockfiles, not a pnpm workspace.
    design-system-tokens:
      glob:
        - "design-system/src/*.svelte"
        - "design-system/src/**/*.svelte"
        - "design-system/scripts/check-token-coverage.mjs"
        - "web/src/**/*.{svelte,ts,js}"
      run: pnpm --dir design-system run check:tokens
    design-system-adoption:
      glob:
        - "design-system/src/index.ts"
        - "design-system/scripts/check-adoption.mjs"
        - "web/src/**/*.{svelte,ts,js}"
      run: pnpm --dir design-system run check:adoption

# The same commitlint config CI applies to the PR title (commitlint.config.js). Local
# commits are not what lands on main — the squash merge takes the PR title — but a branch
# that follows the convention makes a title easy to write. Steps aside when the root
# tooling is not installed (`pnpm install` at the repository root): the PR title check is
# the gate.
commit-msg:
  commands:
    commitlint:
      # Merge and rebase messages are git's own, and only the squash title reaches main.
      skip:
        - merge
        - rebase
      run: |
        if [ ! -x node_modules/.bin/commitlint ]; then
          echo "commitlint not installed (pnpm install at the repository root) - skipping"
          exit 0
        fi
        node_modules/.bin/commitlint --edit {1}

# A merge commit skips pre-commit and runs pre-merge-commit instead, and a merge from
# main is the usual way generated docs go stale: main brings new outputs (or a new CI
# check on them) while this branch's api-spec/filters edits are not in them.
pre-merge-commit:
  commands:
    api-docs-drift: *api-docs-drift
