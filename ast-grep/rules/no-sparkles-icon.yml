id: no-sparkles-icon
language: TypeScript
severity: error
message: "the Sparkles icon marks AI here; fix: say it in words (a label, or a `beta` badge) instead of the icon"
note: The owner asked for it gone. It reads as decoration and promises magic the feature does not do.
rule:
  any:
    # import { Sparkles } from '@lucide/svelte', and the same re-exported
    - any:
        - kind: import_specifier
        - kind: export_specifier
      has:
        field: name
        regex: ^Sparkles?(Icon)?$
      inside:
        any:
          - kind: import_statement
          - kind: export_statement
        stopBy: end
        has:
          field: source
          regex: lucide
    # import Sparkles from '@lucide/svelte/icons/sparkles', lucide's per-icon entry point
    - kind: import_statement
      has:
        field: source
        regex: lucide[^'"]*/icons/sparkles?['"]$
