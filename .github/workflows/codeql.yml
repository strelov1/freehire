name: CodeQL

# First-party static analysis (SQL/command injection, XSS, taint tracking, ...).
# Dependency vulnerabilities are covered separately: govulncheck.yml (Go),
# snyk.yml (JS lockfiles).
# Not a required status check, so a paths filter here is safe (unlike ci.yml's
# backend/web jobs or perf.yml's pr-smoke — see AGENTS.md / lefthook.yml for
# why those can't use one without leaving unrelated PRs stuck on "Expected").
on:
  push:
    branches: [main]
    paths: &codeql-paths
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "extension/**"
      - "design-system/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths: *codeql-paths
  schedule:
    - cron: '13 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # testdata/ holds third-party pages captured verbatim as parser
          # fixtures (e.g. idealtraits job pages with their CDN <script> tags).
          # They are never served or executed, so every finding there is about
          # someone else's site, not ours.
          config: |
            paths-ignore:
              - "**/testdata/**"

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
