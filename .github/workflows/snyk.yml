name: snyk

# Go dependencies are already covered by govulncheck.yml (reachability-based, no token
# needed) — scoped here to the JS lockfiles to avoid duplicate coverage and stay inside
# Snyk's free-tier monthly test quota. Run once a day over the default branch,
# rather than spending tests on every PR update. Manual runs also consume tests;
# the daily schedule reduces usage but does not bypass an exhausted quota.
#
# Scan all four JS lockfiles, including the repository root's tooling dependencies:
# those run in CI and on developer laptops, so they need the same coverage.
#
# THE SCAN NEEDS A CREDENTIAL, AND SAYS SO WHEN IT HAS NONE. Without `SNYK_TOKEN` the CLI
# exits 2 on its first call, which painted a red cross on every dependency PR — a standing
# failure nobody reads is how a real one gets waved through. The `credentials` job below
# decides, and the scan skips rather than fails when there is nothing to authenticate with.
#
# That skip is deliberately LOUD: a warning annotation on the run and a note in the job
# summary, both naming what went unscanned. A scanner that quietly opts out makes a commit
# look examined, which is the same reason the gitleaks hook fails hard when its binary is
# missing.
#
# The gate is a separate job because `secrets` is NOT one of the contexts available to an
# `if:` — not on a job, not on a step. Written there it evaluates to nothing, the condition
# is false however the repository is configured, and the scan silently never runs again.
# `needs` IS available, so the credential is read in a step's `env` and handed forward as
# an output.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reads the secret in the one place an `if:` cannot: a step's `env`. Emits a plain
  # string, not the credential, so the scan job can branch on it through `needs`.
  credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      - name: Probe for a Snyk credential
        id: probe
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'configured=false' >> "$GITHUB_OUTPUT"
          echo '::warning title=Snyk did not run::No SNYK_TOKEN was visible to this run, so the JS lockfiles went unscanned.'
          # Quoted heredoc: the body is Markdown for the summary, and nothing in it expands.
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Snyk did not run

          No `SNYK_TOKEN` was visible to this run, so the four JS lockfiles (root,
          `design-system/`, `web/`, `extension/`) were **not scanned** for known
          vulnerabilities.

          Scheduled runs use the default branch. Add or restore the repository secret
          **SNYK_TOKEN** under **Settings › Secrets and variables › Actions**.

          Go dependencies are unaffected: `govulncheck` covers those and needs no credential.
          SUMMARY

  snyk:
    needs: credentials
    if: needs.credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
            design-system/pnpm-lock.yaml

      # Pinned, because an unpinned global install runs whatever was published a minute
      # ago with this job's SNYK_TOKEN in reach. Nothing bumps this line for us — no
      # lockfile holds it, so Dependabot cannot see it — which is the cost of the pin.
      - name: Install Snyk CLI
        run: npm install -g snyk@1.1308.3 # zizmor: ignore[adhoc-packages] pinned above

      # The root package. It carries pnpm-workspace.yaml (for its overrides) beside its
      # lockfile, so Snyk insists on --all-projects (422 otherwise, --file included).
      # --detection-depth=1 keeps that to the root directory, which web/ and
      # design-system/ below would otherwise be billed twice for, and the Go module
      # beside the lockfile is govulncheck's (ci.yml), not this scan's.
      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Test root tooling dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --detection-depth=1 --exclude=go.mod

      # design-system is a `link:`/`file:` dependency for web/extension and does
      # not install its own deps transitively — same trap as ci.yml and
      # extension.yml.
      - name: Install design-system dependencies
        working-directory: design-system
        run: pnpm install --frozen-lockfile

      # design-system carries both pnpm-lock.yaml and pnpm-workspace.yaml —
      # a plain `snyk test` refuses (422) and asks for --all-projects.
      - name: Test design-system dependencies
        working-directory: design-system
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # web also carries pnpm-workspace.yaml alongside its lockfile — same
      # 422 trap as design-system.
      - name: Test web dependencies
        working-directory: web
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Test extension dependencies
        working-directory: extension
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test
