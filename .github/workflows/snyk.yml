name: snyk

# Go dependencies are already covered by govulncheck.yml (reachability-based, no token
# needed) — scoped here to the JS lockfiles to avoid duplicate coverage and stay inside
# Snyk's free-tier monthly test quota.
#
# FOUR LOCKFILES, NOT THREE. The repository root grew one when the repo-wide tooling
# (knip, squawk) landed, and it was covered by nothing: this job named the three package
# directories, and the paths filter below meant a change to the root lockfile did not even
# start the job. Those are dev dependencies, but they run in CI and on every laptop, which
# is the same trust boundary as anything else here.
on:
  schedule:
    - cron: '41 6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'extension/**'
      - 'design-system/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/snyk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
            design-system/pnpm-lock.yaml

      - name: Install Snyk CLI
        run: npm install -g snyk

      # The root package. Its manifest carries no `workspaces` key, so a plain `snyk test`
      # is right here and the --all-projects the other two need would reach into their
      # directories and bill them twice.
      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Test root tooling dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test

      # design-system is a `link:`/`file:` dependency for web/extension and does
      # not install its own deps transitively — same trap as ci.yml and
      # extension.yml.
      - name: Install design-system dependencies
        working-directory: design-system
        run: pnpm install --frozen-lockfile

      # design-system carries both pnpm-lock.yaml and pnpm-workspace.yaml —
      # a plain `snyk test` refuses (422) and asks for --all-projects.
      - name: Test design-system dependencies
        working-directory: design-system
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # web also carries pnpm-workspace.yaml alongside its lockfile — same
      # 422 trap as design-system.
      - name: Test web dependencies
        working-directory: web
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Test extension dependencies
        working-directory: extension
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test
