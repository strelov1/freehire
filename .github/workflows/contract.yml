name: Contract

# Schemathesis fuzzes the routes in openapi/api.openapi.json against a real server on an
# empty database: every answer must have a status, content type and body the contract
# declares, and no request may make the server fail. Checks the generated code alone
# cannot: a handler that returns a shape, a status or a 500 the contract does not name.
# The second job does the same for the OJCP MCP server with the official MCP conformance suite.
# /api/v1/mcp requires OAuth and the suite cannot send a credential, so it is not covered.
on:
  pull_request:
    paths:
      - typespec/**
      - openapi/**
      - internal/**
      - cmd/server/**
      - go.mod
      - go.sum
      - migrations/**
      - Dockerfile
      - docker-compose.yml
      - schemathesis.toml
      - .github/mcp-conformance/**
      - .github/workflows/contract.yml
  push:
    branches: [main]
    paths:
      - typespec/**
      - openapi/**
      - internal/**
      - cmd/server/**
      - go.mod
      - go.sum
      - migrations/**
      - Dockerfile
      - docker-compose.yml
      - schemathesis.toml
      - .github/mcp-conformance/**
      - .github/workflows/contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Meilisearch too: the API is configured for search, and without it every search
      # read is a 500. Its indexes may stay empty; an absent index answers "no results".
      - name: Start the API, its database and search
        run: docker compose up -d --build app meilisearch

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            [ "$api" = "200" ] && exit 0
            echo "attempt $i: api=$api"
            sleep 3
          done
          docker compose logs app --tail=100
          exit 1

      # Search answers 500 while the jobs index does not exist; a real deployment always has
      # one. Build it (empty) from Postgres, as perf.yml does, so the fuzz meets search the
      # way production serves it.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the search index
        env:
          DATABASE_URL: postgres://hire:hire@localhost:5432/hire?sslmode=disable
          MEILI_URL: http://localhost:7700
          MEILI_MASTER_KEY: dev-insecure-meili-key
        run: go run ./cmd/reindex

      - name: Fuzz the contract
        run: |
          pipx run schemathesis==4.33.2 run openapi/api.openapi.json \
            --url http://localhost:8080/api/v1 --max-examples 50 --workers 2

      - name: API logs
        if: failure()
        run: docker compose logs app --tail=200

  # The official MCP conformance suite against the two MCP servers that answer without a
  # sign-in. The suite calls the tools, prompts and resources of its own reference server;
  # a product server has none of them, so those scenarios are listed per endpoint, with the
  # reason, in .github/mcp-conformance/. The suite fails on an unlisted failure and on a
  # listed scenario that now passes. Nothing here reaches a real account or production.
  mcp-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the API, its database and search
        run: docker compose up -d --build app meilisearch

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            [ "$api" = "200" ] && exit 0
            echo "attempt $i: api=$api"
            sleep 3
          done
          docker compose logs app --tail=100
          exit 1

      - name: Run the MCP conformance suite
        run: |
          npx --yes @modelcontextprotocol/conformance@0.1.16 server \
            --url "http://localhost:8080/api/v1/ojcp/mcp" \
            --expected-failures ".github/mcp-conformance/ojcp.yml"

      - name: API logs
        if: failure()
        run: docker compose logs app --tail=200
