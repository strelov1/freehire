name: Lint

# Repository hygiene split out of ci.yml for its size: docs and links, Python, shared JS
# deps, file size, the workflows themselves, ast-grep rules and dead code. None of these jobs
# needs another, and none is a required status check (those are `backend` and `web` in ci.yml
# and `pr-smoke`), so they run on the same triggers in a workflow of their own.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only for every job, the same floor ci.yml sets.
permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

      # Tool archives come from a cache: see "Cache tool archives" in backend-jobs for why.
      - name: Cache tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-tools
          key: ci-tools-${{ github.job }}-${{ hashFiles('.github/workflows/lint.yml') }}
          restore-keys: ci-tools-${{ github.job }}-

      # The instruction files as an agent reads them: an unclosed code fence silently turns
      # the rest of an AGENTS.md into one code block, and a .cursor/rules file whose
      # frontmatter does not parse is a rule that never applies — neither of which a link
      # check or a human skim notices. Read .agnix.toml for which rules are off and why.
      #
      # A release binary checked against a digest written HERE, not one downloaded beside
      # it: a checksum fetched from the same release as the binary proves the download
      # finished, not that it is the file this line was reviewed against.
      - name: Lint the agent instruction files
        env:
          AGNIX_VERSION: v0.59.3
          AGNIX_SHA256: f2e0549286fb148b2814559222129bd561db69ddc21cd3c6c05b52f3cef09ee4
        run: |
          f=~/.cache/ci-tools/agnix-${AGNIX_VERSION}.tar.gz
          [ -f "$f" ] || curl -fsSL --retry 5 --retry-all-errors --create-dirs -o "$f" \
            "https://github.com/agent-sh/agnix/releases/download/${AGNIX_VERSION}/agnix-x86_64-unknown-linux-gnu.tar.gz"
          echo "${AGNIX_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" -C /tmp agnix
          /tmp/agnix --strict .

      # Spelling over code, docs and web strings; _typos.toml argues what is excluded and
      # allowed. Same digest rule as agnix: a bump changes TYPOS_VERSION and TYPOS_SHA256
      # together, and .mise.toml moves with them.
      - name: Check spelling
        env:
          TYPOS_VERSION: v1.52.0
          TYPOS_SHA256: 6155d4114f9a0f5b8f6d4fda96266c9d5f6add71df80da7f684ee5e72eb14588
        run: |
          f=~/.cache/ci-tools/typos-${TYPOS_VERSION}.tar.gz
          [ -f "$f" ] || curl -fsSL --retry 5 --retry-all-errors --create-dirs -o "$f" \
            "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" -C /tmp ./typos
          /tmp/typos

      # Markdown structure: an unclosed code fence, a skipped heading level, a malformed table
      # or list. .rumdl.toml argues every rule that is off. Same digest rule as agnix and
      # typos: a bump changes RUMDL_VERSION and RUMDL_SHA256 together, and .mise.toml moves
      # with them.
      - name: Lint Markdown
        env:
          RUMDL_VERSION: v0.3.2
          RUMDL_SHA256: 395c4061041c5a25301c7b3564a93c4a661ed4df93427a77b6fc9e426ec8a13a
        run: |
          curl -fsSL -o /tmp/rumdl.tar.gz \
            "https://github.com/rvben/rumdl/releases/download/${RUMDL_VERSION}/rumdl-${RUMDL_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RUMDL_SHA256}  /tmp/rumdl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rumdl.tar.gz -C /tmp rumdl
          /tmp/rumdl check --no-cache .

  # Every tracked .py file: ruff.toml holds the rules, and none are baselined. The release
  # binary is checked against a digest written HERE, as in the docs job. A version bump
  # changes RUFF_VERSION, RUFF_SHA256 and .mise.toml together.
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tool archives come from a cache: see "Cache tool archives" in backend-jobs for why.
      - name: Cache tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-tools
          key: ci-tools-${{ github.job }}-${{ hashFiles('.github/workflows/lint.yml') }}
          restore-keys: ci-tools-${{ github.job }}-

      - name: Install Ruff
        env:
          RUFF_VERSION: 0.17.4
          RUFF_SHA256: 3ab2b34aeacdbc1ea5c529cdbda3e05792633d587228123fd09f3b5a0facb27a
        run: |
          f=~/.cache/ci-tools/ruff-${RUFF_VERSION}.tar.gz
          [ -f "$f" ] || curl -fsSL --retry 5 --retry-all-errors --create-dirs -o "$f" \
            "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          echo "${RUFF_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" -C /tmp --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff

      - name: Lint
        run: /tmp/ruff check .

      - name: Check formatting
        run: /tmp/ruff format --check .

  # The version of every package whose TYPES cross the design system's `link:` boundary.
  # design-system is symlinked into web and extension rather than copied, so each of the
  # three installs its own node_modules and a shared package lands on disk more than once —
  # harmless for a value, fatal for a type, since TypeScript identifies a type by where it
  # was declared. Dependabot raised @lucide/svelte in design-system alone (#2836) and
  # svelte-check reported eight errors in web about a type being unassignable to itself.
  #
  # Its own job for the same reason `docs` is: it reads three package.json files and needs
  # no package tree installed. It also fails EARLIER than the svelte-check that catches the
  # consequence — that one needs both packages installed and the design system built, so on
  # a Dependabot PR it is minutes of CI away from a message that never names the cause.
  shared-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check shared dependency versions
        run: node scripts/check-shared-deps.mjs

  # No file people or agents write may exceed the token limit in scripts/check-file-size.mjs.
  # The pre-commit hook checks staged files; this checks all of them, since --no-verify
  # walks past the hook.
  file-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check file sizes
        run: node scripts/check-file-size.mjs --all

  # The workflows themselves. Nothing has ever read them except GitHub, at the moment it
  # runs one — so an unknown runner label, a mistyped `needs:` or a broken expression is
  # discovered by a job failing, and a job that only runs on a tag or a schedule is
  # discovered late. actionlint also runs shellcheck over every `run:` block, which is the
  # half that found real things here: an unquoted `find` result passed to grep, and an `ls`
  # parsed for a path in the extension's store-upload step.
  #
  # `go install` at a pinned version rather than a downloaded release: the Go module proxy
  # verifies the checksum against the transparency log on its own, so the pin is the whole
  # supply-chain story — no second digest to keep in step with the version.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # No path argument: actionlint finds .github/workflows itself, so a NEW workflow is
      # covered the moment it exists rather than when someone remembers to list it.
      - name: Lint the workflows
        run: actionlint

      # actionlint asks whether a workflow is VALID; zizmor asks whether it is SAFE — a
      # token left in .git/config for every later step, an action pinned to a tag its
      # owner can move, an expression expanded into a shell, a job holding the default
      # token's write scopes. It found all four here on its first run.
      #
      # --offline keeps the verdict a property of the change: the online audits (known-
      # vulnerable and impostor commits) consult GitHub, so a new advisory would fail a
      # pull request that changed nothing — the reason govulncheck runs on a schedule.
      # A finding that is wrong for one line carries `# zizmor: ignore[<audit>]` with the
      # argument beside it, as pr-welcome.yml's trigger does.
      - name: Audit the workflows for security
        run: pipx run zizmor==1.31.1 --offline .github/workflows

  # The repository's own syntax rules (sgconfig.yml, ast-grep/rules). `ast-grep test` proves
  # each rule still flags what its test file says it flags, so a rule that silently stopped
  # matching fails here rather than passing everything; `scan --error` holds the code to them.
  # A rule is turned on with its violations fixed, never with a baseline of known ones.
  ast-grep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tool archives come from a cache: see "Cache tool archives" in backend-jobs for why.
      - name: Cache tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-tools
          key: ci-tools-${{ github.job }}-${{ hashFiles('.github/workflows/lint.yml') }}
          restore-keys: ci-tools-${{ github.job }}-

      # Checked before it is unpacked, like gitleaks: the digest is the release's own and
      # moves with AST_GREP_VERSION, which .mise.toml pins too (bump both together).
      - name: Install ast-grep
        env:
          AST_GREP_VERSION: 0.51.1
          AST_GREP_SHA256: 42514f77ae0c8a25d7d32154d31d3e7e16f3ab894f8ce76ce417de234ee49157
        run: |
          f=~/.cache/ci-tools/ast-grep-${AST_GREP_VERSION}.zip
          [ -f "$f" ] || curl -fsSL --retry 5 --retry-all-errors --create-dirs "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip" -o "$f"
          echo "${AST_GREP_SHA256}  $f" | sha256sum --check --strict -
          unzip -q "$f" ast-grep -d /tmp/ast-grep
          sudo install -m 0755 /tmp/ast-grep/ast-grep /usr/local/bin/ast-grep
          ast-grep --version

      - name: Test the rules
        run: ast-grep test

      - name: Scan the code
        run: ast-grep scan --error

      # `ast-grep test` feeds a rule snippets in its own language, so nothing above proves
      # the rules reach a .svelte file — least of all a bare <script>, which only the
      # languageInjections entry in sgconfig.yml reads as TypeScript. This does, on a
      # throwaway component holding one violation of each web rule.
      - name: Prove the rules reach a bare Svelte script
        run: |
          probe=web/src/lib/AstGrepProbe.svelte
          printf '%s\n' '<script>' "  import { Sparkles } from '@lucide/svelte';" "  import { env } from '\$env/dynamic/public';" '</script>' > "$probe"
          # The scan exits non-zero on the findings it is here to make; the list is the verdict.
          found=$( (ast-grep scan --json=compact "$probe" || true) | jq -r '[.[].ruleId] | sort | join(",")')
          rm "$probe"
          [ "$found" = "no-legacy-env-modules,no-sparkles-icon" ] || { echo "expected both web rules on a bare <script>, got: '$found'" >&2; exit 1; }

  # Dead files, unused dependencies and unresolved binaries across the three JS packages.
  # Read knip.config.js for where the gate's line is drawn and why exports sit outside it.
  #
  # CI ONLY, NOT A PRE-COMMIT HOOK, and not because of the four seconds. knip needs the
  # dependencies of BOTH web and design-system installed to resolve anything, and a fresh
  # worktree routinely has neither — so as a hook it would fail for a reason that has
  # nothing to do with the commit, which is the fastest way to teach people --no-verify.
  # What it catches is cumulative rather than urgent: a file that stopped being imported,
  # a dependency nobody removed. That can wait for the pull request.
  dead-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      # design-system before web: web resolves it through a `link:` symlink, and pnpm does
      # not install a linked package's own dependencies for its consumer.
      - name: Install design-system dependencies
        run: pnpm --dir design-system install --frozen-lockfile

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      # npm, not pnpm — extension/ is the one JS package in this repository managed by npm.
      - name: Install extension dependencies
        run: npm --prefix extension ci

      - name: Check for dead code and unused dependencies
        run: pnpm check:dead

  # The same question as the job above, asked of the Go half — which nothing asked until
  # now. knip covers the three JS packages; `unused` in golangci-lint sees one package at
  # a time and counts a call from anywhere as a use. Neither can answer "is this function
  # reachable from any binary or any test", which is what `deadcode` answers by building
  # the whole call graph. Two of the three backend review passes ran it by hand, and each
  # time it named something real.
  #
  # `-tags=integration,llmlive` IS THE JOB. Without them the analysis never parses the
  # build-tagged test files — 187 of them across 20 packages — and reports functions that
  # only those tests reach as dead: internal/platform/testdb's whole container helper, for
  # one. That is a guard that lies, and the reader's correct response to a lying guard is
  # to stop reading it. .golangci.yml's run.build-tags carries the same argument for
  # depguard.
  #
  # `-test` for the mirror-image reason: without it every function whose only callers are
  # tests is "dead". The cost is that a function ONLY its own test calls stays invisible
  # here — that one needs a reviewer, and this job is not the reason to stop looking.
  #
  # `go install` at a pinned version rather than a downloaded release, like actionlint
  # above: the module proxy verifies the checksum against the transparency log, so the pin
  # is the whole supply-chain story. Its own job rather than a step on `backend` because it
  # runs in parallel with the integration suite instead of extending it, and because
  # "dead-code-go" names what failed without opening the log.
  dead-code-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # AFTER Setup Go, and that ordering is not cosmetic: `go install` builds deadcode
      # with whatever toolchain is on PATH, and go/types inside the binary refuses a
      # module whose go directive is newer than that. Built by an older Go it does not
      # report zero findings — it reports "package requires newer Go version" for most of
      # the repository, which this step would read as findings.
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.52.0

      # deadcode exits 0 whatever it finds — it is a reporter, not a linter — so the
      # verdict is whether it printed anything. There is no allowlist: the repository has
      # no entry for one today, and an empty allowlist file is an invitation to append
      # rather than to delete. A finding that must survive needs a reason a reviewer can
      # read, which is what the pull request is for.
      - name: Report unreachable Go functions
        run: |
          report=$(deadcode -test -tags=integration,llmlive ./...)
          if [ -n "$report" ]; then
            echo "$report"
            echo
            echo 'Unreachable from every binary and every test. Delete it, or make the'
            echo 'caller that justifies it real.'
            exit 1
          fi
          echo 'No unreachable functions.'
