name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, at the workflow level so it covers every job here and every job added later —
# the other workflows already declare this, and CI was the one that did not. Nothing in it
# writes to the repository: it builds, tests and reports. A job that ever needs to write
# should say so itself, which is the point of putting the floor here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend_tasks: ${{ steps.scope.outputs.backend_tasks }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test CI scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Select required checks
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  backend-jobs:
    name: backend-${{ matrix.task }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.changes.outputs.backend_tasks) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # golangci-lint's --new-from-merge-base needs origin/main reachable locally.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - name: Go cache paths
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules }}
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}

      # setup-go's dependency key is immutable between dependency updates. Keep
      # each task's compiled packages across source changes, without a short Go
      # tooling job winning the shared cache key before the tests finish.
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.task }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.task }}-${{ hashFiles('go.mod', 'go.sum') }}-

      # Résumé PDF text extraction shells out to poppler's pdftotext (prod ships it in
      # the image / on the host); install it so the extraction tests run instead of skip.
      # Keep the runner's mirror+file sources and Ubuntu signing keys, but use an
      # independent HTTPS mirror before the Ubuntu hosts that failed DNS across
      # repeated runners on 2026-11-11. Request timeouts allow bounded failover.
      - name: Configure APT mirror fallback
        if: matrix.task != 'checks'
        run: sudo bash .github/scripts/configure-apt-mirrors.sh

      # Bound the entire command too: a mirror trickling data can evade request timeouts.
      - name: Install poppler-utils
        if: matrix.task != 'checks'
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if timeout 100 sudo apt-get update \
              && timeout 60 sudo apt-get install -y --no-install-recommends poppler-utils; then
              exit 0
            fi
            echo "apt attempt $attempt failed or hung; retrying"
            sleep 5
          done
          exit 1

      # Tool archives come from a cache, so a GitHub Releases outage (504s for minutes on
      # 2026-11-08) fails only a run that bumps a version. A digest check (all but typst's)
      # covers a cached file like a downloaded one, and a job that fails it saves no cache.
      # shortcut: old versions' archives stay in the cache until GitHub evicts it (7 days unused).
      - name: Cache tool archives
        if: matrix.task != 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-tools
          key: ci-tools-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ci-tools-${{ github.job }}-

      # CV rendering shells out to typst, and the render tests skip without it — including the
      # registry-driven guard that every template emits clickable links, which is the only
      # thing standing between a new template and tracer links silently counting nothing.
      # Same pinned version and same release tarball as the prod image (Dockerfile): a
      # different typst here would break the local == CI == prod output the ATS extraction
      # test relies on.
      - name: Install typst
        if: matrix.task != 'checks'
        env:
          TYPST_VERSION: 0.15.0
        run: |
          f=~/.cache/ci-tools/typst-${TYPST_VERSION}.tar.xz
          [ -f "$f" ] || curl -fsSL --retry 5 --retry-all-errors --create-dirs "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o "$f"
          tar -xJf "$f" -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      # No separate `go build ./...`: vet type-checks every package and the test
      # steps compile them, including the test-less cmd/* binaries.
      - name: Vet
        if: matrix.task == 'checks'
        run: go vet ./...

      - name: Format check
        if: matrix.task == 'checks'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # Ratchet mode: only fails on issues in lines this PR touches, not the
      # pre-existing backlog. Mirrors the design-system token ratchet.
      - name: Lint
        if: matrix.task == 'checks'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --new-from-merge-base=origin/main

      - name: Unit tests
        if: matrix.task == 'unit'
        run: |
          mkdir -p coverage
          go test ./... -coverprofile=coverage/unit.out -covermode=atomic

      # Separate the largest packages, command workers and user-facing services.
      # The selector sends every new package to rest unless it matches a named group.
      - name: Select integration packages
        if: startsWith(matrix.task, 'integration-')
        env:
          SHARD: ${{ matrix.task }}
        run: bash .github/scripts/integration-packages.sh "$SHARD" > "$RUNNER_TEMP/integration-packages.txt"

      # One Postgres for the whole shard. Its test binaries share one migrated template on
      # it (internal/platform/testdb) instead of each booting a container and migrating
      # its own. Tuned like the harness's container, since the data is thrown away;
      # max_connections is raised because every binary's tests now meet on one server.
      # Readiness is asked over TCP: the image's init server answers on the socket only,
      # so a socket check can pass before the real server is up.
      - name: Start Postgres
        if: startsWith(matrix.task, 'integration-')
        run: |
          docker run -d --name testdb -p 5432:5432 \
            -e POSTGRES_USER=hire -e POSTGRES_PASSWORD=hire -e POSTGRES_DB=postgres \
            pgvector/pgvector:pg18 \
            -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500
          psql --version
          for _ in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 5432 -q && exit 0
            sleep 1
          done
          docker logs testdb
          exit 1

      - name: Integration tests
        if: startsWith(matrix.task, 'integration-')
        env:
          SHARD: ${{ matrix.task }}
          TESTDB_ADMIN_URL: postgres://hire:hire@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          mapfile -t packages < "$RUNNER_TEMP/integration-packages.txt"
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No integration packages selected for $SHARD" >&2
            exit 1
          fi
          mkdir -p coverage
          go test -tags=integration "${packages[@]}" -coverprofile="coverage/$SHARD.out" -covermode=atomic

      - name: Upload Go coverage
        if: always() && matrix.task != 'checks'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ matrix.task }}
          path: coverage/*.out
          if-no-files-found: ignore

  # Preserve the required check name while the work runs on separate runners.
  backend:
    needs: [changes, backend-jobs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend task to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.backend-jobs.result }}
        run: test "$CHANGES" = success && test "$RESULT" = success

      # Changed-line coverage, gated on pull requests only. It runs here and not in a backend-jobs
      # shard because this is the one place where every shard's profile is visible, and after the
      # assertion above so a red backend task is never hidden behind a coverage message.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover diffs against origin/main, which needs the history to reach it.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        if: github.event_name == 'pull_request'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go coverage
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-*
          path: coverage
          merge-multiple: true

      - name: Changed-line Go coverage
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/diff-cover-gate.sh go coverage

  # The three artefacts this repository hands to someone else, none of which any other job
  # reads: a shell script the site serves to be piped into sh, the images that get deployed,
  # and the API description integrations are built against. A mistake in any of them is
  # discovered by whoever is on the receiving end.
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs a downloaded container image and an npx package over the
          # checkout. Neither needs the token, and leaving it in .git/config hands it to
          # both.
          persist-credentials: false

      # web/static/install.sh is served at https://freehire.me/install.sh and documented as
      # `curl -fsSL … | sh`, so a mistake in it runs on someone else's machine, as them.
      # web/docker-entrypoint.sh is what starts the site. shellcheck ships on the runner.
      #
      # The list comes from git rather than being written out here: a script added next year
      # is covered the day it is committed, not the day someone remembers this job exists.
      - name: Check shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts tracked — this job has lost its subject."
            exit 1
          fi
          printf 'Checking %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      # Read .hadolint.yaml for which two rules are ignored and why; a finding that is wrong
      # for one line carries its argument inline instead.
      - name: Lint the Dockerfiles
        run: |
          mapfile -t files < <(git ls-files 'Dockerfile' '*/Dockerfile')
          printf '  %s\n' "${files[@]}"
          for f in "${files[@]}"; do
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" \
              hadolint/hadolint:v2.15.1-alpine hadolint --config /.hadolint.yaml - < "$f"
          done

      # recommended-strict is the recommended ruleset with warnings promoted to errors:
      # missing client errors, licence metadata and invalid examples must fail the gate.
      - name: Validate the OpenAPI description
        run: npx --yes @redocly/cli@2.49.0 lint web/static/openapi.yaml --extends=recommended-strict

  # The public API's contract against main: read scripts/check-openapi-breaking.sh for
  # what counts as breaking and the `API-Break:` trailer that lets a deliberate break
  # through. Its own job because it needs the whole history (the merge base) and the
  # jobs beside it are shallow on purpose.
  api-breaking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tool archives come from a cache: see "Cache tool archives" in backend-jobs for why.
      - name: Cache tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-tools
          key: ci-tools-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ci-tools-${{ github.job }}-

      # Pinned by a digest written here, the same argument as agnix in `docs`.
      - name: Install oasdiff
        env:
          OASDIFF_VERSION: 1.34.1
          OASDIFF_SHA256: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90
        run: |
          f=~/.cache/ci-tools/oasdiff-${OASDIFF_VERSION}.tar.gz
          [ -f "$f" ] || curl -fsSL --retry 5 --retry-all-errors --create-dirs -o "$f" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" -C /tmp oasdiff

      - name: Check for breaking API changes
        env:
          OASDIFF: /tmp/oasdiff
        run: scripts/check-openapi-breaking.sh

  # Every relative Markdown link, because this repository navigates by document and a
  # rename breaks one silently. Needs no dependencies — git and node — so it is its own
  # job rather than a step tacked onto one that installs a package tree.
  scrapling-fetch:
    # services/scrapling-fetch: the self-hosted fetch tier on host2. Its tests fake both
    # Scrapling fetchers, so they run on plain Python without a browser.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scrapling-fetch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Test
        run: python -m pytest -q

  python-scripts:
    # These tests have their own runner; unittest discovery would run no tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test scripts
        run: |
          for f in scripts/test_*.py; do
            python3 "$f" || exit 1
          done

  # internal/platform/db is generated and committed. Nothing compared the two until now,
  # so a query edited without `make sqlc` shipped the old Go and every job stayed green —
  # the same class of gap the design-system `check:dist` step exists for.
  #
  # `make sqlc` rather than a pinned action, because the Makefile already holds the
  # version (SQLC_VERSION) and it is the one developers run. Two pins would be two
  # answers to the same question, and the drift between them would look exactly like
  # stale generated code.
  sqlc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate
        run: make sqlc

      # The bare `git status --porcelain` is correct HERE and would be wrong in the
      # pre-commit hook: a fresh clone has an empty index, so "differs from HEAD" and
      # "is unstaged" have the same answer. See lefthook.yml for the other half.
      - name: Assert the generated code matches the queries
        run: |
          if [ -n "$(git status --porcelain -- internal/platform/db)" ]; then
            git status --porcelain -- internal/platform/db
            git --no-pager diff -- internal/platform/db
            echo
            echo 'internal/platform/db is stale. Run "make sqlc" and commit the result.'
            exit 1
          fi
          echo 'Generated code matches internal/platform/db/queries.'

  # web/src/lib/generated is the same shape of gap the job above closes, and it was
  # already open: contracts.ts had drifted 114 skill labels behind the dictionary,
  # because a skill added to internal/dict never made anyone re-run the generator.
  #
  # That drift was invisible and nearly harmless — the SPA title-cases a label it cannot
  # find, so a stale file rendered the same string anyway. skillDescriptions.ts has no
  # such fallback: a description the file has not caught up with means no tooltip and no
  # glossary page, which reads as the feature being broken rather than the file being
  # old. One more generated file with a silent failure mode is what makes this a job.
  #
  # `go run ./cmd/gen-contracts` needs no toolchain of its own — tygo is a library here,
  # not a binary — so unlike sqlc there is no version to pin in two places.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate
        run: go run ./cmd/gen-contracts

      - name: Assert the generated contracts match the Go vocabularies
        run: |
          if [ -n "$(git status --porcelain -- web/src/lib/generated)" ]; then
            git status --porcelain -- web/src/lib/generated
            git --no-pager diff -- web/src/lib/generated
            echo
            echo 'web/src/lib/generated is stale. Run "make gen-contracts" and commit the result.'
            exit 1
          fi
          echo 'Generated contracts match the Go vocabularies.'

  # The HTTP contract: typespec/ compiles to openapi/api.openapi.json, and ogen turns
  # that into internal/api/apigen, which the handlers implement (and openapi-typescript
  # into web/src/lib/generated/api.ts, the types the web client reads). The outputs are
  # committed, so a .tsp edit without `make api-contract` would ship the old Go and stay
  # green; this regenerates both and fails on any difference.
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate
        run: make api-contract

      - name: Assert the generated contract matches typespec/
        run: |
          if [ -n "$(git status --porcelain -- openapi internal/api/apigen web/src/lib/generated/api.ts)" ]; then
            git status --porcelain -- openapi internal/api/apigen web/src/lib/generated/api.ts
            git --no-pager diff -- openapi internal/api/apigen web/src/lib/generated/api.ts
            echo
            echo 'openapi/, internal/api/apigen or web/src/lib/generated/api.ts is stale. Run "make api-contract" and commit the result.'
            exit 1
          fi
          echo 'Generated contract matches typespec/.'

  # Fails when this pull request edits, deletes or renames a migration main already holds
  # (escape: a `Migration-Edit:` commit trailer), and lints the migrations it ADDS.
  #
  # The lint covers only the added files. The applied history carries 1322
  # findings and is never going to be fixed — "never edit an applied migration" is the
  # rule this repository runs on, and rewriting one is a worse hazard than any finding.
  # A migration file genuinely never changes after it lands, which makes this a far
  # cleaner ratchet than the line-based one the Go lint uses: no baseline file to drift.
  #
  # Read .squawk.toml for why the invocation is split in two passes.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script asks git which migrations are new since the merge base, so the
          # base commit has to be reachable. A shallow clone would make every migration
          # look either new or absent, and neither is a useful answer — which is why the
          # script fails on an unresolvable base rather than reporting an empty list.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The step prints how many files it examined. On a branch with no migration that
      # is zero, which is the honest answer — and visible, rather than a green tick over
      # a check that found nothing to do.
      - name: Lint new migrations
        run: pnpm check:sql

  design-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: design-system/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm build

      # dist/tokens-*.css is committed and generated, and until now nothing
      # compared the two: a token edited without a rebuild shipped the old CSS
      # and every job stayed green. Style Dictionary writes no timestamp, so a
      # rebuild of unchanged sources is byte-identical and this diff is real.
      - name: Check dist matches the token sources
        run: pnpm check:dist

      # The primitives live in the package, so web's svelte-check and vitest
      # never see them — both skip node_modules, which is where web resolves
      # them from.
      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Validate docs
        run: pnpm validate:docs

      # A hex, a `p-[7px]` or a `text-amber-600` is a value the theme cannot move
      # and the `.dark` selector cannot override, and nothing else here would
      # notice: all three are valid input to their compilers and the build stays
      # green. Two radii — zero in the package, a held count in web/src.
      - name: Check token coverage
        run: pnpm check:tokens

      # This job proves the package builds and the `web` job proves the app
      # builds, and both are true whether or not they are connected — which is
      # how eleven primitives stayed unreachable from app code for three phases
      # with everything green. This is the only step that reads both halves.
      - name: Check adoption
        run: pnpm check:adoption

      - name: Build Storybook
        run: pnpm build-storybook

      # Tailwind v4 discards classes it cannot find a source for, silently — a
      # preview that lost its Tailwind entry or its @source scan still builds
      # green and just renders every primitive unstyled. So assert the output
      # positively: `animate-pulse` reaches the CSS only by way of the scan over
      # src/*.svelte (Skeleton is its sole user), and a class selector count
      # catches a Tailwind entry that vanished entirely.
      - name: Assert Storybook emitted the primitives' utilities
        run: |
          if [ -z "$(find storybook-static/assets -name '*.css' -print -quit)" ]; then
            echo "No stylesheet in storybook-static/assets."
            exit 1
          fi
          if ! grep -rqF '.animate-pulse' --include='*.css' storybook-static/assets; then
            echo "Storybook CSS carries no utility from design-system/src/*.svelte."
            echo "The preview lost its Tailwind entry or theme.css's @source scan."
            exit 1
          fi

  web-work:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      # Bump together with .mise.toml.
      EASEMENT_REV: 191f55c0661aeaec7ecf1d17713b7d683333daa9
      SCIP_TYPESCRIPT_VERSION: 0.6.1
    # Not gated on design-system: web consumes the package's *source* (its
    # "svelte" export is ./src/index.ts) plus the two committed dist/tokens-*.css,
    # so nothing here waits on that job's build.
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover diffs against origin/main, which needs the history to reach it.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The design system is a `link:` dependency — a bare symlink, so pnpm does not
      # install its dependencies with web's. The package resolves tailwind-variants,
      # clsx, tailwind-merge and @lucide/svelte out of its OWN node_modules, which has
      # to exist before anything imports a primitive. Missing, the web build fails with
      # MODULE_NOT_FOUND, which is loud — the point of `link:` over `file:` is that its
      # failure mode is loud.
      - name: Install design-system dependencies
        working-directory: design-system
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Type check
        run: pnpm run check

      # The boundaries between the app's parts (web/easement.yml): a component never
      # imports a route or lib/server, src/lib never imports a component, and a new
      # dependency between two parts has to be written into the config with its reason.
      # It holds no baseline of known violations. It runs after the type check because the
      # TypeScript indexer needs the .svelte-kit types `svelte-kit sync` just wrote.
      #
      # shortcut: easement is built from a pinned commit of strelov1/easement, because
      # reading .svelte files is mokevnin/easement#130 and not released yet; once a
      # release carries it, install that release instead and drop the cargo build.
      - name: Cache easement
        id: easement-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/easement
          key: easement-${{ runner.os }}-${{ env.EASEMENT_REV }}

      - name: Build easement
        if: steps.easement-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: cargo install --locked --git https://github.com/strelov1/easement --rev "$EASEMENT_REV" easement

      - name: Install the TypeScript indexer
        run: npm install --global "@sourcegraph/scip-typescript@$SCIP_TYPESCRIPT_VERSION" # zizmor: ignore[adhoc-packages] pinned by SCIP_TYPESCRIPT_VERSION above

      - name: Check web architecture
        run: easement check --no-cache

      # The API reference — docs/API.md, docs/API.internal.md and the two OpenAPI documents
      # the Scalar pages render (src/lib/docs/generated/) — is generated from the contract
      # (openapi/api.openapi.json, itself checked by the api-contract job), the hand
      # supplement for routes outside it, and filters.ts, and committed. Same ratchet as
      # the `sqlc` and `contracts` jobs; it lives here because the generator loads
      # filters.ts through Vite, whose toolchain this job already installed. The same run
      # writes static/openapi.yaml, the narrow ChatGPT Actions schema (linted in
      # `artifacts`, guarded by `api-breaking`).
      - name: Assert the generated API reference matches the contract
        run: |
          pnpm run gen:api-docs
          if [ -n "$(git status --porcelain -- ../docs/API.md ../docs/API.internal.md src/lib/docs/generated static/openapi.yaml)" ]; then
            git --no-pager diff --stat -- ../docs/API.md ../docs/API.internal.md src/lib/docs/generated static/openapi.yaml
            echo
            echo 'The API reference is stale. Run "pnpm run gen:api-docs" in web/ and commit the result. This is not a bug in the code: regenerating fixes it (the api-docs-drift pre-commit hook does it for you).'
            exit 1
          fi
          echo 'The API reference matches openapi/api.openapi.json.'

      - name: API docs generator smoke test
        run: pnpm run gen:api-docs:smoke

      # The broader references retain the `minimal` parsing gate: can a
      # client generator read this at all.
      - name: Validate the generated OpenAPI references
        run: |
          npx --yes @redocly/cli@2.49.0 lint src/lib/docs/generated/api-reference.openapi.json --extends=minimal
          npx --yes @redocly/cli@2.49.0 lint src/lib/docs/generated/api-reference.internal.openapi.json --extends=minimal

      - name: Unit tests with coverage
        run: pnpm run test:coverage

      - name: Changed-line web coverage
        if: github.event_name == 'pull_request'
        run: bash ../.github/scripts/diff-cover-gate.sh web coverage/lcov.info

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

      - name: Build
        run: pnpm run build

      # Brotli budgets for the client entry and the heaviest routes, read off the build the
      # previous step just made (web/.size-limit.mjs). It lives in this job, not its own, so
      # it reuses that build and the required check list stays as it is.
      - name: Bundle size budgets
        run: pnpm run size

      # axe-core over the built app, serving five public pages from a loopback stub API
      # (web/e2e/a11y/stub-api.ts): serious or critical WCAG 2.1 A/AA violations fail it.
      # A step here and not a job of its own: it needs this job's install and build, and the
      # required check list names jobs. It runs wherever web-work does, which the `web` job
      # below reports on every PR. Needs no backend, no secrets and no network beyond the
      # Chromium download.
      - name: Configure APT mirror fallback
        run: sudo bash ../.github/scripts/configure-apt-mirrors.sh

      - name: Install Chromium
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility check (axe-core)
        run: pnpm run test:a11y

  # Always report the required check, including an intentional skip of web work.
  web:
    needs: [changes, web-work]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected web checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
          RESULT: ${{ needs.web-work.result }}
        run: |
          case "$CHANGES:$WEB_REQUIRED:$RESULT" in
            success:true:success | success:false:skipped) ;;
            *) echo "Web checks did not complete as selected"; exit 1 ;;
          esac
