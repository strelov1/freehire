name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # golangci-lint's --new-from-merge-base needs origin/main reachable locally.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Résumé PDF text extraction shells out to poppler's pdftotext (prod ships it in
      # the image / on the host); install it so the extraction tests run instead of skip.
      # Bounded and retried: a hung apt mirror otherwise holds the runner for the
      # job's whole 6-hour budget instead of failing in a minute. Observed five
      # times in a row on 2026-08-18, each run stuck on this step while sibling
      # branches installed fine — so it is a per-runner stall, and a fresh
      # attempt is the fix. `timeout` bounds each command; the loop retries.
      - name: Install poppler-utils
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if timeout 100 sudo apt-get update \
              && timeout 60 sudo apt-get install -y --no-install-recommends poppler-utils; then
              exit 0
            fi
            echo "apt attempt $attempt failed or hung; retrying"
            sleep 5
          done
          exit 1

      # CV rendering shells out to typst, and the render tests skip without it — including the
      # registry-driven guard that every template emits clickable links, which is the only
      # thing standing between a new template and tracer links silently counting nothing.
      # Same pinned version and same release tarball as the prod image (Dockerfile): a
      # different typst here would break the local == CI == prod output the ATS extraction
      # test relies on.
      - name: Install typst
        env:
          TYPST_VERSION: 0.15.0
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      # No separate `go build ./...`: vet type-checks every package and the test
      # steps compile them, including the test-less cmd/* binaries.
      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # Ratchet mode: only fails on issues in lines this PR touches, not the
      # pre-existing backlog. Mirrors the design-system token ratchet.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --new-from-merge-base=origin/main

      - name: Validate sources
        run: go run ./cmd/validate-sources

      - name: Unit tests
        run: |
          mkdir -p coverage
          go test ./... -coverprofile=coverage/unit.out -covermode=atomic

      - name: Integration tests
        run: |
          mkdir -p coverage
          go test -tags=integration ./... -coverprofile=coverage/integration.out -covermode=atomic

      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage/*.out
          if-no-files-found: ignore

  design-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design-system/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm build

      # dist/tokens-*.css is committed and generated, and until now nothing
      # compared the two: a token edited without a rebuild shipped the old CSS
      # and every job stayed green. Style Dictionary writes no timestamp, so a
      # rebuild of unchanged sources is byte-identical and this diff is real.
      - name: Check dist matches the token sources
        run: pnpm check:dist

      # The primitives live in the package, so web's svelte-check and vitest
      # never see them — both skip node_modules, which is where web resolves
      # them from.
      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Validate docs
        run: pnpm validate:docs

      # A hex, a `p-[7px]` or a `text-amber-600` is a value the theme cannot move
      # and the `.dark` selector cannot override, and nothing else here would
      # notice: all three are valid input to their compilers and the build stays
      # green. Two radii — zero in the package, a held count in web/src.
      - name: Check token coverage
        run: pnpm check:tokens

      # This job proves the package builds and the `web` job proves the app
      # builds, and both are true whether or not they are connected — which is
      # how eleven primitives stayed unreachable from app code for three phases
      # with everything green. This is the only step that reads both halves.
      - name: Check adoption
        run: pnpm check:adoption

      - name: Build Storybook
        run: pnpm build-storybook

      # Tailwind v4 discards classes it cannot find a source for, silently — a
      # preview that lost its Tailwind entry or its @source scan still builds
      # green and just renders every primitive unstyled. So assert the output
      # positively: `animate-pulse` reaches the CSS only by way of the scan over
      # src/*.svelte (Skeleton is its sole user), and a class selector count
      # catches a Tailwind entry that vanished entirely.
      - name: Assert Storybook emitted the primitives' utilities
        run: |
          css=$(find storybook-static/assets -name '*.css')
          if [ -z "$css" ]; then
            echo "No stylesheet in storybook-static/assets."
            exit 1
          fi
          if ! grep -qF '.animate-pulse' $css; then
            echo "Storybook CSS carries no utility from design-system/src/*.svelte."
            echo "The preview lost its Tailwind entry or theme.css's @source scan."
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    # Not gated on design-system: web consumes the package's *source* (its
    # "svelte" export is ./src/index.ts) plus the two committed dist/tokens-*.css,
    # so nothing here waits on that job's build.
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The design system is a `link:` dependency — a bare symlink, so pnpm does not
      # install its dependencies with web's. The package resolves tailwind-variants,
      # clsx, tailwind-merge and @lucide/svelte out of its OWN node_modules, which has
      # to exist before anything imports a primitive. Missing, the web build fails with
      # MODULE_NOT_FOUND, which is loud — the point of `link:` over `file:` is that its
      # failure mode is loud.
      - name: Install design-system dependencies
        working-directory: design-system
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Unit tests with coverage
        run: pnpm run test:coverage

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

      - name: Build
        run: pnpm run build
