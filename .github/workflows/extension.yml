name: extension

on:
  push:
    branches: [main]
    paths: ['extension/**', 'design-system/**', '.github/workflows/extension.yml']
  pull_request:
    branches: [main]
    paths: ['extension/**', 'design-system/**', '.github/workflows/extension.yml']
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # extension/'s "freehire-design-system" is an npm `file:../design-system`
      # dependency — a symlink, same as web's pnpm `link:`. Neither package
      # manager installs a linked/`file:` package's own dependencies, so
      # tailwind-variants, clsx, tailwind-merge and @lucide/svelte have to be
      # installed inside design-system/ before anything imports a primitive, or
      # the build fails loudly with MODULE_NOT_FOUND.
      - name: Install design-system dependencies
        working-directory: design-system
        run: pnpm install --frozen-lockfile

      # `npm ci` runs `wxt prepare` (postinstall), which generates .wxt/.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run check

      # Production build (.env.production -> freehire.me),
      # zipped exactly as it is uploaded to the Chrome Web Store.
      - name: Build and zip
        run: npm run zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3
          path: extension/.output/*.zip
          # .output is a dotted directory, and upload-artifact skips hidden
          # paths unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

      # A workflow-artifact download expires after 90 days — fine for reviewing
      # a PR's build, wrong for "give me the build we shipped in June." A push to
      # main additionally publishes a GitHub Release tagged by the version in
      # package.json, which does not expire. Skipped on `pull_request` (a PR
      # build isn't a release) and made idempotent (a re-run of the same commit,
      # or two commits that don't bump the version, must not fail on a
      # already-exists tag).
      - name: Read extension version
        if: github.event_name == 'push'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        id: gh_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: extension-v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" .output/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "extension v${{ steps.version.outputs.version }}" \
              --notes "Automated build from commit $GITHUB_SHA."
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      # Uploads the same zip the GitHub Release just published to the Chrome Web
      # Store and submits it for review. Gated on the version actually being new
      # (the store rejects a re-upload of a version it already has, same rule as
      # extension/docs/chrome-web-store.md's manual checklist) and on the
      # publish-time secrets existing at all, so this step is a no-op until
      # someone wires up a Google Cloud OAuth client for the Chrome Web Store API
      # (see extension/docs/chrome-web-store.md for how to obtain them) and adds
      # CHROME_WEBSTORE_CLIENT_ID / CHROME_WEBSTORE_CLIENT_SECRET /
      # CHROME_WEBSTORE_REFRESH_TOKEN as repo secrets. Submitting still queues for
      # Google's manual review — <all_urls> guarantees that regardless of who
      # uploads the build.
      - name: Publish to Chrome Web Store
        if: github.event_name == 'push' && steps.gh_release.outputs.created == 'true' && env.CHROME_WEBSTORE_CLIENT_ID != ''
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          # The published item's id (chrome.google.com/webstore/devconsole/.../<id>/edit),
          # not the pinned dev key's id in wxt.config.ts — those are different ids by design.
          CHROME_WEBSTORE_EXTENSION_ID: ijfaechijopdlikalojadpojmpilplnj
        run: |
          zip_path=$(ls .output/*.zip | head -n1)
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "$zip_path" \
            --extension-id "$CHROME_WEBSTORE_EXTENSION_ID" \
            --client-id "$CHROME_WEBSTORE_CLIENT_ID" \
            --client-secret "$CHROME_WEBSTORE_CLIENT_SECRET" \
            --refresh-token "$CHROME_WEBSTORE_REFRESH_TOKEN"
          npx --yes chrome-webstore-upload-cli@3 publish \
            --extension-id "$CHROME_WEBSTORE_EXTENSION_ID" \
            --client-id "$CHROME_WEBSTORE_CLIENT_ID" \
            --client-secret "$CHROME_WEBSTORE_CLIENT_SECRET" \
            --refresh-token "$CHROME_WEBSTORE_REFRESH_TOKEN"
