# Secret scanning includes the built-in rules. Exceptions match specific findings.
# Keep every exception narrow. An entire file can contain unrelated credentials.
# If a real credential reaches Git, revoke it even after removing it from the tree.
minVersion = "2.0.0-rc.12"
filter = '''
// Chrome extension manifest keys are RSA *public* keys (SPKI, DER, base64). The extension pins
// its development id with one, which is what the id is derived from — publishing it is the
// mechanism, not a slip. A private key carries a different prefix (MIIEv/MIIJ), so this shape
// cannot cover one.
matchesAny(finding.secret, [`^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A`]) ||

// RFC 6455 §1.3 prints this exact Sec-WebSocket-Key on the page that defines the handshake. The
// WebSocket tests use it because a reader who knows the RFC recognises it.
matchesAny(finding.secret, [`^dGhlIHNhbXBsZSBub25jZQ==$`]) ||

// Source-adapter test fixtures: captured response bodies with the vendor's token field filled
// by an obvious placeholder. Listed one by one rather than by path — a fixture is where a real
// captured token would hide.
matchesAny(finding.secret, [
  `^ABCDEF1234567890ABCDEF12$`,
  `^KEY-abc\.def-123_xyz$`,
  `^3aa5b098-aa6d-4f6c-950a-b92a81363cf8$`,
  `^747e3af5-f7ef-4bd9-87f2-69c6499f4914$`,
  `^4bf8bdb8-e735-4205-a17e-891be1e1ffbd$`,
  `^0721c00d-3962-48a3-bc8b-3834a3765170$`,
  `^PDX_[A-Z0-9]+_[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}_[0-9]+$`,
]) ||

// Auth and mail test constants. Each is long enough to trip generic-api-key and says in its own
// text that it is not a credential.
matchesAny(finding.secret, [
  `^test-secret-that-is-long-enough-0001$`,
  `^fh_live_abc123$`,
]) ||

// logo.dev publishable key, history only. It was a `pk_` token — the kind designed to ship to a
// browser — and the code no longer carries it: company logos now go through our own
// logo.freehire.me proxy, which holds the credential server-side. Kept because the finding is
// in the history, where it stays.
matchesAny(finding.secret, [`^pk_fKgOEo0OT4KXvUshjPMGAQ$`]) ||

// ITviec listing markup names each posting by a UUID in a `data-job-key` attribute
// (internal/ingest/sources/testdata/itviec_list_page1.html). It is the posting's public id,
// printed on every listing page, and the word `key` is what trips generic-api-key. Pinned to
// the attribute AND the UUID shape, so any other token in that markup is still scanned.
matchesAny(finding.match, [`^data-job-key='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'$`]) ||

// Paradox names each posting by a `job_token` of the shape PDX_JONB_<UUID>_<number>
// (internal/ingest/sources/testdata/paradox/). It is the posting's id inside the public job
// JSON every visitor's browser receives, not a credential; the field name is what trips
// generic-api-key. Pinned to that exact shape.
matchesAny(finding.secret, [`^PDX_JONB_[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}_[0-9]+$`]) ||

// The extension's GA4 Measurement Protocol API secret. It ships inside every published build
// (MV3 cannot fetch it at runtime from anywhere a reader could not), and all it permits is
// sending events to the site's own analytics stream — public by construction, like the gtag
// measurement id beside it. Matched by the variable it is assigned to, so a different key
// pasted into the same file still fails.
matchesAny(finding.line, [`WXT_GA_API_SECRET=[A-Za-z0-9_-]{16,40}`]) ||

// A git commit SHA pinned as a version: a workflow's `uses: owner/action@<sha> # vX.Y.Z`
// (zizmor requires every action pinned so) and a mise tool built from a commit (`rev:<sha>`).
// sourcegraph-access-token fires on any 40-hex string near the word sourcegraph, and the scip-
// typescript indexer is `@sourcegraph/scip-typescript`, so a pin beside it trips the rule.
// Pinned to those two line shapes, so a bare 40-hex value anywhere else is still scanned.
matchesAny(finding.line, [
  `^\s*(?:-\s+)?uses:\s+[\w.-]+/[\w./-]+@[0-9a-f]{40}\s+#\s+v\S+\s*$`,
  `"cargo:https://github\.com/[\w.-]+/[\w.-]+" = "rev:[0-9a-f]{40}"`,
]) ||

// Test passwords, API examples, UI strings and local MinIO/perf defaults.
(finding.rule_id == "generic-password" && crypto.sha256(finding.secret) in [
  "1817cf31da74e02a9902eaa3b99a54ccd9465624db7f987ea7eb0a36908cc514",
