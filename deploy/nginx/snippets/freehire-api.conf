# Shared API-family body of the freehire apex HTTPS block: server tuning plus
# every location EXCEPT the web root `location /`. Included by BOTH freehire-app.conf
# (freehire.me: web root proxies to SvelteKit) and freehire-dev.conf (freehire.dev:
# web root 301s to .me, but these API paths keep serving directly). Splitting it
# this way lets .dev redirect the site while API clients on .dev keep working, with
# zero duplication of the subtle proxy config. Host-agnostic — every upstream gets
# `Host $host`, so a request keeps its own domain end to end.

client_max_body_size 12m;

# Compress proxied text responses. The main nginx.conf has `gzip on` but leaves
# gzip_proxied off and gzip_types at the default (text/html only), so proxied API
# JSON (e.g. /stats/facets, /jobs/facets — tens of KB) goes out uncompressed.
# Enable it here: ~8x smaller on the wire. Already-Content-Encoding'd upstream
# responses (the Node SSR HTML compresses itself) are skipped, so no double-gzip.
gzip on;
gzip_proxied any;
gzip_types application/json application/javascript text/css text/plain application/xml application/rss+xml image/svg+xml;
gzip_min_length 1024;
gzip_vary on;

# SvelteKit emits a large modulepreload `Link:` response header on pages with
# many JS chunks (e.g. /companies/:slug ~3.8k); the 4k default proxy_buffer_size
# overflows it -> 502 "upstream sent too big header". Size up the proxy buffers.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

location = /health { proxy_pass http://freehire_api; proxy_set_header Host $host; }

# SSE fit-analysis stream: the AI job-fit analysis streams over Server-Sent Events
# for up to a few minutes (a slow reasoning model, three stages). Disable response
# buffering so events reach the browser live, and raise the read timeout so the long
# stream isn't dropped at the 60s default. Regex location → takes precedence over the
# /api/ prefix below.
location ~ ^/api/v1/jobs/[^/]+/fit/stream$ { proxy_pass http://freehire_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 300s; }
# SSE assistant turns: one POST whose body streams the turn. Same reasons as the fit
# stream above — buffering off so frames reach the browser live, and a read timeout the
# turn cannot outlast.
#
# The autopilot is what forced this. On a vacancy with no cached fit analysis it computes
# the three-stage chain INLINE, before opening the stream, so nginx sees no byte for two
# minutes and cuts the request at the 60s default — measured 2026-08-21: five 504s on
# /tailor/, every one of them exactly 60.000s while the Go handler went on to finish in
# 2m6s and answer 200. The client cannot tell that from a real failure ("could not start
# the run"), and the run it reports as failed is in fact running.
#
# Regex location → takes precedence over the /api/ prefix below, and so does not inherit
# its company-walk limit_req. None of these paths carries company_slug.
location ~ ^/api/v1/assistant/sessions/[^/]+/(autopilot|messages|opening|retry|voice-turns)$ { proxy_pass http://freehire_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 300s; }
# Homepage "recently added jobs" live feed (freehire#2579): an indefinite SSE
# subscription — unlike the fit-analysis/assistant streams above, it never
# completes on its own, so there is no fixed few-minutes ceiling to size a
# read timeout against. Its own periodic "ping" event (every 15s) is what
# keeps this well under the timeout in normal operation; the 3600s ceiling
# only bounds a connection that has gone genuinely silent. Same buffering-off
# reasoning as the other SSE locations: without it nginx would hold entries
# in its proxy buffer instead of forwarding them to the browser live. Exact-
# match location → takes precedence over the /api/ prefix below, and so does
# not inherit its company-walk limit_req (this path carries no company_slug).
location = /api/v1/feed/recent { proxy_pass http://freehire_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; }
# Browser-tool wire: the agent drives a user's browser extension over this
# socket, so the handshake needs the upgrade headers the plain /api/ location
# below does not pass, and a read timeout long enough for an idle panel to stay
# attached. Exact-match location → takes precedence over the /api/ prefix.
# Uses the $http_upgrade map defined in the vhost.
location = /api/v1/tools/ws {
    proxy_pass http://freehire_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $assistant_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
# Agent-driven autofill: internal/autofillagent.Run drives every custom-widget
# combobox on the form ONE AT A TIME (open, read options, an LLM call to choose,
# select, verify — no parallelism, no timeout of its own), so a form with several
# of them routinely runs past the 60s default and the request gets cut here
# before the Go handler ever gets to answer, surfacing as a 504 the client can't
# tell apart from a real failure. Exact-match location → takes precedence over
# the /api/ prefix below.
location = /api/v1/me/autofill/run { proxy_pass http://freehire_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 300s; }
# Traced CV links (freehire#1357). These sit inside PDFs a recruiter opens by hand, so the path
# is short and readable rather than under /api/; the API resolves the token, records the click and
# 302s to the real destination. X-Real-IP matters here beyond rate limiting: it is what the visitor
# hash is keyed on, so without it every visitor would hash alike and "3 people opened this" would
# read as 1.
location /cv/ { proxy_pass http://freehire_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }

# The limit_req here bites ONLY on requests carrying `company_slug` -- the zone's key
# is empty for anything else, and limit_req skips an empty key. So this is not a
# budget on /api/; it is a budget on asking about companies one at a time. See
# conf.d/freehire-limit.conf for the measurements behind 2r/s and for why this is a
# 429 rather than a challenge.
#
# The more specific locations above (the fit stream, the tools socket, the autofill
# run) do not inherit it. None of them is reachable with this parameter.
location /api/ { limit_req zone=freehire_company_walk burst=30 nodelay; limit_req_status 429; limit_req_log_level error; proxy_pass http://freehire_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }

# The email preference centre, logged without its query string.
#
# Its `?t=` is a signed token that authenticates an otherwise unauthenticated caller
# against one account's mail settings, and it never expires by design. It has to be
# in the URL: a link in an email has nowhere else to carry it, and RFC 8058 fixes the
# one-click request body, so the address Gmail was handed is the only place left.
# Under the default format every click would write a permanently valid credential
# into the access log.
#
# So: same line, minus the arguments. See conf.d/freehire-logformat.conf for why the
# whole line is not simply switched off, and for why the field positions are
# identical to combined_purpose (internal/viewlog reads this file).
#
# `^~` so it wins over the regex locations above as well as the /api/ prefix below --
# and it deliberately does NOT inherit that prefix's limit_req, which keys on
# company_slug and would never bite here anyway. The endpoint carries its own
# per-IP limiter in the Go handler (internal/api/handler/email_prefs.go).
#
# The prefix covers both routes that carry the token: /api/v1/email-prefs and
# /api/v1/email-prefs/one-click. The PATCH takes its token in the body and needs
# none of this, but it shares the path and loses nothing by being here.
location ^~ /api/v1/email-prefs { access_log /var/log/nginx/access.log combined_purpose_no_query; proxy_pass http://freehire_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }


# PostHog product analytics, reverse-proxied SAME-ORIGIN so the client only
# ever talks to its own host — ad-blockers don't drop *.posthog.com beacons and
# no external host enters the app's script-src CSP. The SDK's api_host is
# `/ingest`; the trailing slashes strip the prefix, so /ingest/e/ -> eu.i.../e/
# and /ingest/static/recorder.js -> eu-assets.i.../static/recorder.js. EU
# region for data residency (CV/inbox/tracking PII). proxy_ssl_server_name is
# required — PostHog fronts these hosts on a CDN that needs SNI. `^~` short-
# circuits the regex locations above. Response buffers are already sized up at
# the server level, which also covers session-replay payloads.
#
# X-Forwarded-For on the event path is what PostHog resolves GeoIP from. Without
# it every event carries this host's own address and the whole geography reads as
# the Hetzner datacentre (Finland/Germany) rather than the visitor. It has to be
# set HERE and not inherited: proxy_set_header is not additive across levels, so
# the `Host` line above already discards whatever the server block defines. The
# static location needs none of this — it only fetches the recorder bundle.
location ^~ /ingest/static/ {
    proxy_pass https://eu-assets.i.posthog.com/static/;
    proxy_set_header Host eu-assets.i.posthog.com;
    proxy_ssl_server_name on;
}
location ^~ /ingest/ {
    proxy_pass https://eu.i.posthog.com/;
    proxy_set_header Host eu.i.posthog.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
}
