# `combined`, plus the request's Sec-Purpose header.
#
# internal/viewlog turns these lines into per-job view counts, and it counted a
# hover as a view. The app sets data-sveltekit-preload-data="hover", so moving the
# pointer across a listing fetches /jobs/<slug>/__data.json for every card the
# cursor passes — a request shape viewlog treats as a page open, because a real
# in-app click produces that same request and no other. Someone scrolling the feed
# on a desktop therefore "viewed" every job they scrolled past, and jobs.view_count
# is a figure shown to visitors.
#
# The browser already separates the two cases: a speculative fetch carries
# Sec-Purpose (`prefetch`, or `prefetch;prerender`), a real navigation carries
# nothing. `combined` has no field for it, so it never reached the parser. This
# format adds one, appended LAST so the leading fields keep their positions and
# anything else reading these lines is unaffected.
#
# Deploy order: the parser ships FIRST. Its pattern makes the new field optional,
# so it reads both formats and going parser-first is a no-op until this file lands.
# The other order feeds the old parser lines it cannot match, and a day that parses
# as nothing silently counts nothing.
#
# fail2ban is not affected — its nginx jail reads error.log, not this file.
#
# 2026-08-21 adds the two timing fields, and they close the gap that made "the site
# feels slow" unanswerable. Nothing anywhere measured how long a request took: the
# Go API exports a request COUNTER and no histogram, so the only per-request timing
# in the system was a journal line nobody aggregates. These two fields are what
# web-metrics.sh turns into latency percentiles, and they cover the SSR pages as
# well as the API — which the Go side could not have done at all, since it never
# sees a page render.
#
#   $request_time           what the client waited, first byte in to last byte out
#   $upstream_response_time what the upstream took, so the difference is nginx,
#                           the network and a slow client draining its socket
#
# web-metrics.sh had recorded the opposite decision — "latency needs
# $upstream_response_time in log_format, and internal/viewlog parses this log, not
# worth breaking that for". Reasonable, and untrue: viewlog's pattern is anchored
# at ^ and not at $, so it does not look at anything past the fields it names.
# Verified by running it, and pinned by TestParseLine/"ignores the timing fields
# appended for the latency metrics" in that package before this landed.
#
# Appended LAST, for the same reason Sec-Purpose was: every leading position is
# unchanged, so a reader that counts fields from the front is unaffected.
#
# ORDER MATTERS, and not for readability. $upstream_response_time is NOT always a
# single number: it is "-" when nginx answered by itself (a deny from the blocklist,
# a file off disk, a redirect) and a COMMA-SEPARATED LIST when a request was tried
# against more than one upstream — "0.100, 0.200", which any whitespace-splitting
# reader sees as two fields. $request_time has no such case, so it goes LAST and can
# be read off the end of the line without counting fields at all. That is exactly
# what web-metrics.sh does, and it is why the two are not in the intuitive order.
#
# The referer and user-agent are quoted but still contain spaces, so counting fields
# forward past $body_bytes_sent does not work either. Front-anchored readers stop
# before them; this reader is end-anchored. Nothing should try to meet in the middle.
log_format combined_purpose '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" "$http_sec_purpose" '
                            '$upstream_response_time $request_time';
