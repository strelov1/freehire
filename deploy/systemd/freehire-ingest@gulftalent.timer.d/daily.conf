# gulftalent egresses through a METERED hosted API (internal/platform/firecrawl), so it must
# not run on the hourly cadence gen-ingest-timers.sh gives every other provider: 24 runs a day
# against a 1 000-page monthly allowance is the allowance gone by the second day.
#
# OnCalendar is RESET before being set. A drop-in ADDS to the list rather than replacing it, so
# without the empty assignment this file would give the timer BOTH the hourly schedule and the
# daily one, which is the opposite of the intent and looks identical in `systemctl cat`.
#
# 09:40 UTC is clear of the nightly pg_dump (03:00-05:30) and both reindex runs (03:15, 15:15).
[Timer]
OnCalendar=
OnCalendar=*-*-* 09:40:00
RandomizedDelaySec=600
Persistent=true
