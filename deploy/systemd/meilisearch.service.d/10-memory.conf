# A ceiling on the search engine, so a rebuild cannot take the whole host with it.
#
# On 2026-09-14 the twice-daily facet reindex ran for 4h20m and, in its final phase,
# exhausted the machine: free memory fell from 18.6 GB to 623 MB in twelve minutes, the
# HOST's page cache collapsed from 21.6 GB to 289 MB, and 16 GB of swap filled completely.
# 1017 tasks blocked, system CPU hit 59%, context switches doubled, and nginx answered 504
# to 7,199 requests over eighteen minutes. It ended when Meilisearch returned 408 to the
# rebuild's document push and the reindex died — the site recovered because the work gave
# up, which is not a recovery.
#
# The engine had no bound of any kind: MemoryHigh, MemoryMax and MemorySwapMax were all
# `infinity`, and its cgroup held 20 GB of the host's 30. A rebuild asks for a second index
# on top of the live one — the `skills` embedder is 1024 dimensions over 1.37M documents,
# and an HNSW graph under construction is ANONYMOUS memory, which cannot be reclaimed. To
# find room for it the kernel evicted everything else's page cache and then swapped.
#
# MemoryHigh and not MemoryMax, deliberately: High THROTTLES and reclaims inside this
# cgroup, Max kills. Measured the day of the outage, 16.44 GB of the engine's 18.21 GB was
# file-backed — its memory-mapped LMDB index — against 1.39 GB of anonymous heap. So
# reclaim here mostly means handing back cache the engine re-faults from disk when it needs
# it: the cost is a slower read after pressure, not a dead search. The point is that the
# pressure lands on the process that caused it instead of on the rest of the machine.
#
# 18G leaves ~12G for Postgres, the two API colours, the SSR tier and the ~49 ingest
# workers. If search latency degrades measurably, raise it — and if a rebuild still
# exhausts the host at a higher figure, the honest answer is more RAM, not a bigger number
# here.
[Service]
MemoryHigh=18G
