# TEMPORARY 2026-09-03: one watched run at a 40GiB floor instead of 45.
# Index is 30G and 43G is free, so the rebuild fits; the standard floor budgets a
# 15G margin we are 2G short of. Environment= loses to EnvironmentFile=, so the
# override has to BE an EnvironmentFile, applied after the unit main file.
# REMOVE /etc/freehire-reindex-floor.env AND THIS FILE once the run finishes.
[Service]
EnvironmentFile=/etc/freehire-reindex-floor.env
