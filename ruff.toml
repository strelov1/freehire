# The one Ruff config for every tracked Python file: services/scrapling-fetch,
# scripts/ and .github/scripts/. The version is pinned in .mise.toml
# and in the python-lint job of .github/workflows/lint.yml.
#
# Findings are fixed, not baselined: no per-file ignores and no broader rule set here.
target-version = "py312"

# Python files only. Ruff 0.17 also formats the Python code blocks inside Markdown by
# default, which would put every document under a check the pre-commit hook does not run.
include = ["*.py"]

# Each directory is a flat set of modules that import one another by bare name, so isort
# must see them as first-party rather than sort them in with the installed packages.
src = ["services/scrapling-fetch", "scripts", ".github/scripts"]

[lint]
# Ruff's classic default selection (E4, E7, E9, F) written out, plus import sorting (I),
# bugbear (B) and pyupgrade (UP). Spelled out because the built-in default of recent
# releases is ~500 rules, security and style families included, and a version bump must
# not widen what the gates enforce.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
