# Container-only main config. The host's systemd/nginx configuration lives in freehire-ops.
# Every mutable file is in /tmp; image configuration and application code stay read-only.
include /etc/nginx/modules/*.conf;
worker_processes auto;
pid /tmp/freehire-web/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/freehire-web/client_temp;
    proxy_temp_path /tmp/freehire-web/proxy_temp;
    fastcgi_temp_path /tmp/freehire-web/fastcgi_temp;
    uwsgi_temp_path /tmp/freehire-web/uwsgi_temp;
    scgi_temp_path /tmp/freehire-web/scgi_temp;

    include /tmp/freehire-web/default.conf;
}
