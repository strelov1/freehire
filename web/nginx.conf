# nginx config for the freehire web container. nginx is the public face: it
# keeps the SvelteKit SSR app and the Go API same-origin (required for the
# SameSite=Lax auth cookie) by routing /api and /health to the backend and
# everything else to the in-container Node SSR server.
server {
    listen 80;

    # Security headers applied to every response. TLS is terminated upstream, so the
    # browser sees these over HTTPS. These are the non-breaking baseline; a script-src
    # CSP is configured in svelte.config.js (nonce-based) so it doesn't break SSR
    # hydration. `always` emits them on error responses too.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compress proxied text responses. The Go API returns JSON uncompressed (e.g. the
    # /stats/facets and /jobs/facets payloads run into tens of KB), and gzip cuts that
    # ~8x on the wire. `gzip_proxied any` lets nginx compress upstream responses; it
    # skips anything already Content-Encoding'd (the Node SSR HTML compresses itself),
    # so there is no double-compression. text/html is always gzipped when gzip is on.
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml application/rss+xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Brotli for the same response types (ngx_brotli, installed in web/Dockerfile).
    # A browser offers `br, gzip`; nginx picks brotli when both are on, which is
    # ~20% smaller than gzip on our SSR HTML. Without this module nginx could only
    # answer an Accept-Encoding of exactly `br` with an UNCOMPRESSED body — it has
    # no brotli encoder — so the pre-compressed .br assets below were dead weight.
    brotli on;
    brotli_comp_level 5;
    brotli_types application/json application/javascript text/css text/plain application/xml application/rss+xml image/svg+xml;
    brotli_min_length 1024;

    # Resolve the backend hostname at request time, not at startup — so the web
    # container boots even if `app` is briefly down/unresolved instead of nginx
    # refusing to start. The literal Node upstream needs no resolver.
    # Default is Docker's embedded DNS; docker-entrypoint.sh rewrites this to the
    # first nameserver in /etc/resolv.conf under Podman (aardvark-dns).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Backend service name inside the compose network.
    location /api/ {
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The backend keys its rate limiter on X-Real-IP. nginx OVERWRITES it with the
        # real peer ($remote_addr), so a client cannot spoof it — unlike X-Forwarded-For,
        # which is a client-appendable list.
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Traced CV links. These sit in PDFs a recruiter opens by hand, so the path is short and
    # readable rather than under /api/; the backend resolves the token and 302s to the real
    # destination. Everything else still goes to the SPA.
    location /cv/ {
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $backend http://app:8080;
        proxy_pass $backend;
    }

    # Hashed build assets, served from disk instead of proxied to Node. Every name
    # under _app/immutable/ carries a content hash, so the bytes for a given URL never
    # change and the long immutable cache is safe.
    #
    # Two reasons this is not left to adapter-node's sirv. It puts every asset byte
    # through the same event loop that renders pages, so a burst of asset requests
    # queues behind SSR (and vice versa); and nginx proxies with `gzip on`, which
    # re-compresses sirv's output as gzip, so the .br files `vite build` writes were
    # never sent — a client asking for `br` got the file UNCOMPRESSED (144 KB of CSS
    # against 26 KB pre-compressed). brotli_static/gzip_static serve those files
    # directly, which is what they were built for.
    #
    # `root` (not `alias`) because the request URI already starts with the path that
    # exists under build/client. The security headers are repeated here on purpose:
    # an add_header anywhere in a location REPLACES the inherited server-level set
    # rather than adding to it, so without them these responses would ship none.
    location /_app/immutable/ {
        root /app/build/client;
        brotli_static on;
        gzip_static on;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Everything else → the SvelteKit Node SSR server (adapter-node) in this
    # container. X-Forwarded-* let adapter-node reconstruct the public origin.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SvelteKit emits a large `Link: rel=modulepreload` response header that grows
        # with a page's module graph; some pages (e.g. company detail) exceed nginx's
        # default 4k proxy_buffer_size, which otherwise fails with 502 "upstream sent
        # too big header". Give the response-header buffer generous headroom.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }
}
