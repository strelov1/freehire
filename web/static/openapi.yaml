            "type": "boolean",
            "description": "True when `total` counts only what was read, not the whole match."
          }
        },
        "description": "A page of a filtered list, with what the filter dropped."
      },
      "Problem": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        },
        "description": "Every refusal, whatever its status: `{\"error\": msg}`. `code` is set only where a\nclient branches on the reason (the auth flows)."
      },
      "SuggestMeta": {
        "type": "object",
        "required": [
          "count"
        ],
        "properties": {
          "count": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "Suggestion": {
        "type": "object",
        "required": [
          "text",
          "parts",
          "jobs"
        ],
        "properties": {
          "text": {
            "type": "string",
            "description": "The whole phrase the row names — the recognised prefix plus the completion, e.g. \"Senior Software Engineer Google\"."
          },
          "parts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SuggestionPart"
            },
            "description": "Every part the row applies. Apply ALL of them: a row naming a role and a company that is\napplied as only one of the two silently discards what the caller typed."
          },
          "jobs": {
            "type": "integer",
            "format": "int64",
            "description": "Open postings behind the completion. Never zero — a suggestion that leads to an empty page is withheld."
          }
        }
      },
      "SuggestionKind": {
        "type": "string",
        "enum": [
          "title",
          "skill",
          "category",
          "company"
        ]
      },
      "SuggestionPart": {
        "type": "object",
        "required": [
          "kind",
          "text"
        ],
        "properties": {
          "kind": {
            "description": "Which vocabulary the part comes from, and so which parameter it applies to: `skill` →\n`skills`, `category` → `category`, `company` → `company_slug`. A `title` names no facet\nand is applied as `q`.",
            "allOf": [
              {
                "$ref": "#/components/schemas/SuggestionKind"
              }
            ]
          },
          "slug": {
            "type": "string",
            "description": "The facet value to apply. Absent for a `title`."
          },
          "text": {
            "type": "string",
            "description": "How this part reads on its own."
          }
        },
        "description": "One recognised piece of the query: a dictionary term, or text still being typed."
      },
      "TopCompany": {
        "type": "object",
        "required": [
          "slug",
          "name",
          "count"
        ],
        "properties": {
          "slug": {
            "type": "string"
          },
          "name": {
            "type": "string",
            "description": "Display name; the slug when the company has none yet."
          },
          "count": {
            "type": "integer"
          }
        },
        "description": "A company and how many of the matching postings it holds."
      }
    }
  }
}
