  "tags": [
    {
      "name": "Jobs",
      "description": "Public, unauthenticated reads. Jobs are returned in one wire shape (addressed by `public_slug`, never an internal id) shared by the list, detail, company, and search responses. Closed postings are excluded from lists and search and served only by the detail endpoint."
    },
    {
      "name": "Companies",
      "description": "Public reads. A company detail also returns a page of its open jobs."
    },
    {
      "name": "Search",
      "description": "Full-text job search with the shared filter vocabulary, facet counts, similar jobs and the reference data behind search."
    }
  ],
