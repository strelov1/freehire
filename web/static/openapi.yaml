    "/jobs/search": {
      "get": {
        "operationId": "searchJobs",
        "summary": "Full-text + faceted search over open jobs.",
        "description": "Free-text `q` plus any filter (the \"Filtering jobs\" section). Repeated values OR;\n`<param>_mode=and` requires all, `<param>_exclude` excludes. Newest first without `q`,\nby relevance with it. An unread param is listed in `meta.ignored_params`: check it, a\ndropped filter looks like a broad result.",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": false,
            "description": "Full-text query over `title`, `company`, `description`, and `location`. The first\nwords are required and trailing ones are dropped when too few postings match, so word\norder can change the result. Operators: quotes require every quoted word in any order\n(not a contiguous phrase); `-word` excludes; uppercase `OR` between words matches any\nalternative (at most 5); `title:` at the start of an alternative matches it in the\ntitle only, e.g. `title:\"product owner\" -junior OR title:produktchef`. `q_fields`\nnarrows the other alternatives. No exact-phrase matching. (e.g. `golang`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "q_fields",
            "in": "query",
            "required": false,
            "description": "Comma-separated subset of `title,company,description,location` to restrict `q` to,\ne.g. `title`. A name outside that set drops the whole parameter (reported in\n`meta.ignored_params`) rather than partially applying. (e.g. `title`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "q_prefix",
            "in": "query",
            "required": false,
            "description": "`true` lets the last word of `q` match as the start of a longer word (`data eng`\nfinds `engineer`), for suggestions while someone is still typing. Off by default:\nthe last word is read as complete, which is much faster on broad queries.\n(e.g. `true`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "description": "One of `created_at`, `posted_at`, `view_count`, `salary_min`, `salary_max`. Omit for\nrelevance/newest. (e.g. `posted_at`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "order",
            "in": "query",
            "required": false,
            "description": "`asc` or `desc` (default `desc`). (e.g. `desc`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "Page size, 1–100. (e.g. `20`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "description": "Rows to skip; `offset + limit` ≤ 10000. (e.g. `0`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "hide_seen",
            "in": "query",
            "required": false,
            "description": "`true` leaves out the postings the signed-in caller has already opened (the 1000 most\nrecently viewed, saved, applied to or hidden), inside the search, so `meta.total` and\npaging stay accurate. A per-person preference, not a filter: a saved search ignores\nit. Without a session or API key it is not applied and is listed in\n`meta.ignored_params`. (e.g. `true`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "hide_applied_companies",
            "in": "query",
            "required": false,
            "description": "`true` excludes every posting of employers represented in the newest 1,000\napplications made by the signed-in caller. Employers represented only by older\napplications can remain in results. Applied inside the search, so `meta.total` and\npaging describe what is left. A per-person preference, not a filter: a saved search\ncarrying it narrows nothing. Without a session or API key, or with a value that is\nnot a boolean, the search runs unhidden and the param is reported in\n`meta.ignored_params`. (e.g. `true`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
          {
            "name": "min_skill_match",
            "in": "query",
            "required": false,
            "description": "Keeps only postings whose skills your profile covers by at least this percent\n(1–100), across the whole ranking. Applies only with `sort=match`, to a signed-in\ncaller with profile skills; the read stops once no later posting can qualify or at a\ndepth bound, and then `meta.total` is a minimum with\n`meta.total_is_lower_bound: true`. A per-person preference: a saved search ignores\nit. Otherwise it is not applied and is listed in `meta.ignored_params`. (e.g. `70`)",
            "schema": {
              "type": "string"
            },
            "explode": false
          },
