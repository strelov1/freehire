          },
          "via_recruiter": {
            "type": "boolean",
            "description": "Present and `true` only when the posting states that it is published by an\nintermediary on a client's behalf. Absent otherwise — a recruiter who never says so is\nnot detected, so absence does not mean the employer posted it."
          },
          "equity": {
            "type": "string",
            "enum": [
              "salary_and_equity",
              "equity_only"
            ],
            "description": "What the posting states about equity compensation: `salary_and_equity` (offered beside\ncash pay) or `equity_only` (equity is the whole pay). Absent when the posting states\nneither — \"not stated\", not \"no equity\"."
          },
          "clearance_levels": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "confidential",
                "secret",
                "top_secret",
                "ts_sci",
                "public_trust",
                "interim",
                "other"
              ]
            },
            "description": "The security-clearance levels the posting states. Present exactly when\n`requires_clearance` is, absent otherwise. `other` is a non-US scheme or a clearance\nstated with no level."
          },
          "perks": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "Benefits the description states it offers (see the `perks` filter for the\nvocabulary). Empty when it names none of them — not a claim that the job offers none."
          },
          "engagement": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "The legal terms the posting states it engages its worker on (see the `engagement`\nfilter for the vocabulary). Empty when it does not say."
          },
          "auto_apply_available": {
            "type": "boolean",
            "description": "Present and `true` only when the posting's ATS provider is one freehire's auto-apply\nfeature can currently attempt to fill and submit for. Absent otherwise — a best-effort\nprovider-eligibility signal, never a guarantee of successful submission."
          },
          "apply_questions": {
            "type": "integer",
            "minimum": 0,
            "description": "How many questions the posting's application form REQUIRES beyond the standard fields\nevery form asks for (name, contact details, CV, cover letter), counted from the form\nfreehire captured from the employer's ATS. Optional questions, the equal-opportunity\nsurvey and consent boxes are not counted. `0` means no REQUIRED question beyond the\nbasics. Absent when freehire holds no form for the posting — \"not known\", never\n\"long\". Served by search hits and the job detail; a list read straight from the\ndatabase may omit it."
          },
          "posted_at": {
            "type": "string",
            "format": "date-time",
            "nullable": true
