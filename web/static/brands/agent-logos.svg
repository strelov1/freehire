<svg width="135" height="53" viewBox="0 0 135 53" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- The agents the MCP strip names (CliBanner.svelte), as one overlapping stack: Claude,
     ChatGPT, Cursor, Grok. Each mark lifts in turn, left to right, then the row rests.
     The rightmost is painted first so the leftmost sits on top. -->
<style>
@keyframes lift {
  0% { transform: none; animation-timing-function: ease-in-out; }
  3.78% { transform: translateY(-2px) scale(1.15); }
  8.11%, 100% { transform: none; }
}
.mark {
  transform-box: fill-box;
  transform-origin: center;
  animation: lift 3.7s linear infinite;
}
#claude { animation-delay: 0s; }
#chatgpt { animation-delay: 0.18s; }
#cursor { animation-delay: 0.36s; }
#grok { animation-delay: 0.54s; }
@media (prefers-reduced-motion: reduce) {
  .mark { animation: none; }
}
</style>
