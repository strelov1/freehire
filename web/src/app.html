<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Warm the company-logo origin: every job row and company header renders an
    <img> from it (CompanyLogo → $lib/logo), so a listing opens a connection to it
    within the first paint, on every page that matters. Its handshake is otherwise
    paid at the moment the first logo is needed.

    Only this one origin gets a preconnect. googletagmanager.com is the other
    candidate Lighthouse names, but it is loaded from $lib/analytics behind cookie
    consent: outside a consent-required region it starts unprompted, inside one it
    may never start at all, and a preconnect the visitor then never uses spends a
    connection slot against the resources that do. dns-prefetch is the honest
    weight for it — name resolution only, discarded cheaply if consent says no. -->
    <link rel="preconnect" href="https://logo.freehire.me" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <!-- PWA installability: manifest generated by SvelteKitPWA (vite.config.ts) at
    the default `generateSW` filename, served at the site root in both dev and
    prod. theme-color/apple-* meta are static (no build-time value), so they live
    here rather than behind the virtual:pwa-info module. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="freehire" />
    <script>
      // No flash of the wrong theme: apply the persisted (or OS) choice before
      // first paint. Mirrors theme.svelte.ts; the toggle re-syncs on mount.
      (function () {
        try {
          var m = localStorage.getItem('hire.theme');
          var dark =
            m === 'dark' ||
            ((!m || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
      // Same trick for the Product Hunt strip: it renders on the server (so it never
      // shoves the page down after hydration), and this hides it before first paint
      // for a visitor who already closed it. Mirrors $lib/productHunt.ts.
      (function () {
        try {
          if (localStorage.getItem('hire.ph-banner-dismissed') === '1')
            document.documentElement.classList.add('ph-dismissed');
        } catch (e) {}
      })();
      // And once more for the onboarding nudge above the job feed, which is the
      // costliest of the three: it sits in the flow directly above the rows, so
      // appearing after hydration moved the whole feed down. Mirrors the lifecycle
      // in $lib/onboarding.ts — 'seen' and 'done' both retire the banner, anything
      // else (including no entry at all) leaves it visible for a first-time visitor.
      (function () {
        try {
          var o = localStorage.getItem('hire.onboarding');
          if (o === 'seen' || o === 'done')
            document.documentElement.classList.add('onboarding-seen');
        } catch (e) {}
      })();
    </script>
    <!-- Google Analytics is no longer bootstrapped inline here: it now loads via
    $lib/analytics (initTrackers), gated on cookie consent alongside PostHog. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
