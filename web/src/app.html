<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <!-- PWA installability: manifest generated by SvelteKitPWA (vite.config.ts) at
    the default `generateSW` filename, served at the site root in both dev and
    prod. theme-color/apple-* meta are static (no build-time value), so they live
    here rather than behind the virtual:pwa-info module. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="freehire" />
    <script>
      // No flash of the wrong theme: apply the persisted (or OS) choice before
      // first paint. Mirrors theme.svelte.ts; the toggle re-syncs on mount.
      (function () {
        try {
          var m = localStorage.getItem('hire.theme');
          var dark =
            m === 'dark' ||
            ((!m || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
      // Same trick for the Product Hunt strip: it renders on the server (so it never
      // shoves the page down after hydration), and this hides it before first paint
      // for a visitor who already closed it. Mirrors $lib/productHunt.ts.
      (function () {
        try {
          if (localStorage.getItem('hire.ph-banner-dismissed') === '1')
            document.documentElement.classList.add('ph-dismissed');
        } catch (e) {}
      })();
    </script>
    <!-- Google Analytics is no longer bootstrapped inline here: it now loads via
    $lib/analytics (initTrackers), gated on cookie consent alongside PostHog. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
