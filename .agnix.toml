# agnix lints the agent instruction files — every AGENTS.md, .cursor/rules — and CI runs it
# with --strict, so a warning fails the build. What is switched off below was measured on
# the first run (2026-10-24: 36 warnings, 0 errors) and each part is off for a stated
# reason, not to make the number go away. A rule that is wrong for ONE line belongs in an
# inline suppression beside that line instead.

[rules]
# The Codex rules (CDX-*) are on so that ONE of them runs, the size cap; every other one is
# listed in disabled_rules below. Nobody works on this repository with Codex, but the cap is
# the only check that notices an instruction file growing past what an agent reads well:
# CDX-AG-009 warns on any AGENTS.md over 32 KiB (Codex's project_doc_max_bytes, fixed in the
# rule). internal/ingest/sources/AGENTS.md reached 527 KiB before anything said so. A file
# still over the cap carries a file-level `<!-- agnix-disable CDX-AG-009 -->` on its first
# line; remove it once the file fits.
codex = true

disabled_rules = [
  # The other Codex rules, each off for a stated reason:
  #   - "References missing file" (CDX-AG-005) reads every backticked path-shaped token as
  #     a file — Go identifiers (`internal/search.FromJob`), URLs, the private ops repo's
  #     paths: 19 of its 20 findings. The links an agent FOLLOWS are Markdown links, and
  #     `pnpm check:links` already resolves every one and fails on a miss.
  #   - "Potential secret" (CDX-AG-002): all five hits were placeholders (`LLM_API_KEY=…`).
  #     gitleaks scans these files on every commit and the whole history in CI.
  #   - The instruction-chain size (CDX-AG-010) sums the root and a nested AGENTS.md against
  #     the same 32 KiB: with a ~32 KiB root, every package file would fail it. The per-file
  #     cap is the gate this repository keeps.
  #   - The rest are about Codex itself — its config file (CDX-004/005/006), an
  #     AGENTS.override.md (CDX-AG-008) — or style opinions about what an AGENTS.md should
  #     say (CDX-AG-001/003/006).
  "CDX-AG-001",
  "CDX-AG-002",
  "CDX-AG-003",
  "CDX-AG-005",
  "CDX-AG-006",
  "CDX-AG-008",
  "CDX-AG-010",
  "CDX-004",
  "CDX-005",
  "CDX-006",
  # "Ambiguous term" — `often`, `usually`, `regularly` in sentences that describe measured
  # behaviour ("a crawl usually returns"), not instructions. A style opinion, not a defect.
  "PE-004",
  # "Conflicting package managers". Deliberate: extension/ is npm-managed while the rest of
  # the JS is pnpm, and the root AGENTS.md says so. The rule cannot tell a conflict from
  # two packages that are documented to differ.
  "XP-004",
]
