# typos (https://github.com/crate-ci/typos), run by the `docs` CI job and by lefthook.
# The catalogue is multilingual, so vocabulary sources are excluded rather than allow-listed
# word by word; what remains below is the residue in code, docs and web strings.
# CI and lefthook pin the version together with its digest (see ci.yml).

[files]
extend-exclude = [
  # Facet dictionaries: city, place and title vocabularies in a dozen languages.
  "internal/dict/**",
  "*.tsv",
  # Captured provider responses, verbatim and in the provider's language.
  "internal/ingest/**/testdata/**",
  "internal/job/jobderive/testdata/workmode/**",
  "extension/lib/fixtures/**",
  # Machine output: fixed by editing the dictionary or the generator, never by hand.
  "web/src/lib/generated/**",
  # The ogen router splits route paths into character-by-character prefixes ("ources").
  "internal/api/apigen/**",
  "web/static/geo-cities.json",
  "*.svg",
  "pnpm-lock.yaml",
  # Archived change proposals are a historical record, frozen as written.
  "openspec/changes/archive/**",
]

