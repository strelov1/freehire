# Worklist for cmd/harvest-linkedin: which markets to ask who is hiring right now.
#
# Each query pages LinkedIn's public job-search listing and yields the companies behind the
# postings, which harvest-ats then follows to their ATS board. Keep this list small and
# deliberate — pages are the multiplier on a run's request count, and the run is a discovery
# pass, not a crawl.
#
#   keywords: what to search for (required)
#   location: the market, a LinkedIn place string (required — a query without one is refused)
#   jobage:   only postings from the last N days (optional, default 7)
#   pages:    result pages to walk, 10 postings each (optional, default 1)
#
# The starter set that preceded this one asked to be judged by measurement rather than kept on
# faith, so it was: six queries over 15 pages surfaced 12 companies the catalogue did not have.
# That yield is what this list widens on, and it widens along two axes the measurement named.
#
# The Nordics come first because of WHICH platforms the harvest can actually key. Teamtailor is
# Swedish and its tenant density follows, and its boards are the ones a guessed candidate can
# now reach at all — a Teamtailor board is keyed by the careers host, and until the harvest
# shaped its guesses that way every one of them probed a host that did not exist.
#
# The rest widens the role vocabulary rather than the page depth: a seventh page of "golang" is
# the same employers further down, while a market's QA and mobile postings are different
# companies entirely. Depth stays at 3 for the markets that yielded and 2 elsewhere.
queries:
  # --- Nordics: Teamtailor's home market, where a host-keyed guess has the most to find ---
  - keywords: software engineer
    location: Sweden
    pages: 3
  - keywords: backend developer
    location: Sweden
    pages: 3
  - keywords: software engineer
    location: Denmark
    pages: 3
  - keywords: developer
    location: Norway
    pages: 3
  - keywords: software developer
    location: Finland
    pages: 3

  # --- the markets the first probe measured, kept at the depth that yielded ---
  - keywords: golang
    location: Germany
    pages: 3
  - keywords: backend engineer
    location: Netherlands
    pages: 3
  - keywords: data engineer
    location: Poland
    pages: 3
  - keywords: frontend developer
    location: Spain
    pages: 2
  - keywords: devops
    location: United Kingdom
    pages: 2
  - keywords: product manager
    location: Remote
    pages: 2

  # --- role vocabulary the first probe never asked for, across the same and nearby markets ---
  - keywords: qa engineer
    location: Poland
    pages: 2
  - keywords: mobile developer
    location: Germany
    pages: 2
  - keywords: site reliability engineer
    location: Netherlands
    pages: 2
  - keywords: data scientist
    location: United Kingdom
    pages: 2
  - keywords: security engineer
    location: Germany
    pages: 2
  - keywords: fullstack developer
    location: Portugal
    pages: 2
  - keywords: software engineer
    location: Ireland
    pages: 2
  - keywords: backend developer
    location: Switzerland
    pages: 2
  - keywords: software engineer
    location: Belgium
    pages: 2
  - keywords: python developer
    location: Czechia
    pages: 2
  - keywords: java developer
    location: Romania
    pages: 2
