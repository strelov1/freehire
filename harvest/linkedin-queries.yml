# Compact blocks: every keyword in `keywords` is searched in every place in `locations`, after the
# explicit queries above (an explicit entry keeps its own budget). Budgets come from the
# registration flags (--pages, --jobage).
matrix:
  # --- 2026-11-17 expansion, measured before it was written ---
  # The first day of the 80-search harvest (pages 10, a 30-day window) published 1040 new
  # LinkedIn Easy Apply postings and onboarded 152 employer ATS boards. Yield was flat across
  # markets (roughly 40-60 published postings per search on its first crawl), so the list widens
  # on both axes: more roles in the largest markets, and every remaining market LinkedIn's guest
  # search resolves (Worldwide does; "European Union" returns nothing).
  - keywords: [data analyst, machine learning engineer, frontend developer, devops engineer, qa engineer, product designer, android developer, ios developer, cybersecurity, full stack developer]
    locations: [United States, United Kingdom, Germany, France, India, Canada, Australia, Netherlands, Spain, Italy, Brazil, Poland]
  - keywords: [software engineer]
    locations: [Pakistan, Bangladesh, Sri Lanka, Thailand, Qatar, Kuwait, Bahrain, Oman, Jordan, Lebanon, Morocco, Tunisia, Ghana, Rwanda, Ethiopia, Uganda, Tanzania, Mauritius, Georgia, Armenia, Kazakhstan, Uzbekistan, Azerbaijan, Moldova, Bosnia and Herzegovina, North Macedonia, Albania, Montenegro, Nepal, Cambodia, China, Norway, Switzerland, Finland, Czechia, Portugal, Romania, Singapore, Mexico, Argentina, Colombia, Chile]
  - keywords: [desarrollador]
    locations: [Peru, Uruguay, Costa Rica, Ecuador, Panama, Guatemala, Dominican Republic, Bolivia, Paraguay, Puerto Rico]
  - keywords: [software engineer, frontend developer, backend developer, devops engineer, data engineer]
    locations: [Worldwide]
  # --- 2026-11-17 dense IT coverage ---
  # After the widened roster lifted the harvest to ~260 published postings an hour, the owner
  # asked for dense IT coverage. One keyword's 100 newest postings are a small slice of a large
  # market and different roles surface different employers, so the twenty largest markets get
  # thirty IT roles each, plus local-language titles where English keywords miss postings.
  # Affordable because a known posting is re-read only every few days (the seen-set), so a
  # revisit costs its listing pages, not a detail request per card.
  - keywords: [software engineer, backend developer, frontend developer, full stack developer, mobile developer, android developer, ios developer, devops engineer, site reliability engineer, cloud engineer, data engineer, data scientist, data analyst, machine learning engineer, ai engineer, qa engineer, test automation engineer, security engineer, network engineer, systems administrator, it support, product manager, product designer, solutions architect, embedded software engineer, java developer, python developer, .net developer, golang developer, engineering manager]
    locations: [United States, United Kingdom, India, Germany, France, Canada, Australia, Netherlands, Spain, Italy, Brazil, Poland, Mexico, Singapore, United Arab Emirates, Ireland, Sweden, Switzerland, Portugal, Israel]
  - keywords: [softwareentwickler, entwickler]
    locations: [Germany]
  - keywords: [ingénieur logiciel]
    locations: [France]
  - keywords: [programador]
    locations: [Spain, Mexico, Portugal]
  - keywords: [programmatore]
    locations: [Italy]
  - keywords: [programador, engenheiro de software]
    locations: [Brazil]
  - keywords: [programista]
    locations: [Poland]
  - keywords: [ontwikkelaar]
    locations: [Netherlands]
  - keywords: [softwareentwickler]
    locations: [Switzerland]
  # --- 2026-11-22 beyond IT ---
  # Four days on, the 729-search roster had saturated: 79% of listed cards were already stored
  # and daily growth fell from ~27k to ~700 published postings (71,905 in total). The Easy Apply
  # pass ended on its own before its 40-page cap in 869 of 911 searches, so depth was not the
  # limit; the search space was. The owner chose to widen beyond IT: common non-IT professions
  # in the twenty largest markets, and narrower IT specialisations in the twelve largest.
  - keywords: [sales manager, account executive, business development manager, sales representative, marketing manager, digital marketing specialist, content writer, customer service representative, customer success manager, accountant, financial analyst, hr manager, recruiter, project manager, operations manager, administrative assistant, graphic designer, ux designer, logistics coordinator, supply chain analyst, mechanical engineer, electrical engineer, civil engineer, nurse, teacher]
    locations: [United States, United Kingdom, India, Germany, France, Canada, Australia, Netherlands, Spain, Italy, Brazil, Poland, Mexico, Singapore, United Arab Emirates, Ireland, Sweden, Switzerland, Portugal, Israel]
  - keywords: [react developer, node.js developer, angular developer, vue developer, typescript developer, php developer, ruby on rails developer, kotlin developer, flutter developer, react native developer, c++ developer, rust developer, scala developer, kubernetes engineer, aws engineer, azure engineer, data architect, bi analyst, power bi developer, salesforce developer, sap consultant, servicenow developer, blockchain developer, unity developer, game developer]
    locations: [United States, United Kingdom, Germany, France, India, Canada, Australia, Netherlands, Spain, Italy, Brazil, Poland]
  # --- 2026-11-22 firehose: take the whole market ---
  # The owner asked to take everything, IT and non-IT. A keyword-less search ("*") lists a whole
  # location, newest first; the guest listing stops around 600-700 cards per query, so the
  # busiest markets are sliced (US by state, India by city). A dedicated lane revisits these;
  # the Easy Apply pass does the heavy lifting. The window was first 6h for the busiest slices,
  # but nearly every firehose card is a new detail read, so one rotation of the lane took ~13h
  # (7 searches in 45 min on 2026-11-22) and a 6h window would leave gaps. Every slice now takes
  # 24h; Texas showed 140 Easy Apply postings in 6h, well under the cap at a day.
  - keywords: ["*"]
    locations: [United States, "California, United States", "Texas, United States", "New York, United States", "Florida, United States", "Illinois, United States", "Washington, United States", "Massachusetts, United States", "Georgia, United States", "North Carolina, United States", "Virginia, United States", "New Jersey, United States", "Pennsylvania, United States", "Ohio, United States", "Colorado, United States", "Arizona, United States", India, "Bengaluru, Karnataka, India", "Hyderabad, Telangana, India", "Pune, Maharashtra, India", "Mumbai, Maharashtra, India", "Chennai, Tamil Nadu, India", "Delhi, India", "Gurugram, Haryana, India", "Noida, Uttar Pradesh, India", United Kingdom, Germany, France, Canada, Australia, Brazil, Netherlands, Spain, Italy, Mexico, Poland, Worldwide]
    jobage_hours: 24
  - keywords: ["*"]
    locations: [Austria, Belgium, Bulgaria, Croatia, Cyprus, Czechia, Denmark, Estonia, Finland, Greece, Hungary, Iceland, Ireland, Latvia, Lithuania, Luxembourg, Malta, Norway, Portugal, Romania, Serbia, Slovakia, Slovenia, Sweden, Switzerland, Ukraine, Turkey, Israel, Egypt, Saudi Arabia, United Arab Emirates, Qatar, Kuwait, Bahrain, Oman, Jordan, Lebanon, Morocco, Tunisia, Nigeria, Kenya, Ghana, South Africa, Rwanda, Ethiopia, Uganda, Tanzania, Mauritius, Japan, South Korea, Taiwan, Hong Kong, Singapore, Malaysia, Indonesia, Philippines, Vietnam, Thailand, Pakistan, Bangladesh, Sri Lanka, Nepal, Cambodia, China, New Zealand, Argentina, Chile, Colombia, Peru, Uruguay, Costa Rica, Ecuador, Panama, Guatemala, Dominican Republic, Bolivia, Paraguay, Puerto Rico, Georgia, Armenia, Kazakhstan, Uzbekistan, Azerbaijan, Moldova, Bosnia and Herzegovina, North Macedonia, Albania, Montenegro]
    jobage_hours: 24
