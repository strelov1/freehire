# Suppressions for the secret scanner, and the rule for adding one.
#
# EVERY ENTRY ALLOWLISTS A LINE SHAPE, NEVER A PATH. gitleaks combines a `paths` key
# with `regexes` using OR and prunes the file before reading it, so a path entry does
# not narrow a rule — it switches the scanner off for that file entirely, including for
# the real credential someone pastes into it next year. `_test.go` is exactly the file
# that invites a path entry and exactly the file where a live token is most likely to be
# used as a "realistic" fixture.
#
# The ten findings on adoption were all argued individually and are listed below. None
# was a live credential; the one that was ever real is a publishable browser token that
# the code no longer carries at all. A finding that survives this file is a leak: it is
# already in the history, in every clone and in the runner's cache, and the response is
# to REVOKE the credential. Rewriting history does not un-leak anything.
#
# Note what neither this file nor the scanner reaches: a key pasted into an issue, a
# chat or an environment store never passes through git.

[extend]
# Without this the custom rules below REPLACE the built-in rule set rather than adding
# to it, which is a green scan that looks for almost nothing.
useDefault = true

[[allowlists]]
description = "Chrome extension manifest keys are RSA *public* keys (SPKI, DER, base64). The extension pins its development id with one, which is what the id is derived from — publishing it is the mechanism, not a slip. A private key carries a different prefix (MIIEv/MIIJ), so this shape cannot cover one."
regexTarget = "secret"
regexes = ['''^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A''']

[[allowlists]]
description = "RFC 6455 §1.3 prints this exact Sec-WebSocket-Key on the page that defines the handshake. The WebSocket tests use it because a reader who knows the RFC recognises it."
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "Source-adapter test fixtures: captured response bodies with the vendor's token field filled by an obvious placeholder. Listed one by one rather than by path — a fixture is where a real captured token would hide."
regexTarget = "secret"
regexes = [
  # internal/ingest/sources — comeet, mts, solidjobs
  '''^ABCDEF1234567890ABCDEF12$''',
  '''^KEY-abc\.def-123_xyz$''',
  '''^3aa5b098-aa6d-4f6c-950a-b92a81363cf8$''',
  # internal/ingest/sources — itviec: listing cards' data-job-key, a public posting id
  # every visitor's page carries (generic-api-key fires on the attribute name "job-key")
  '''^747e3af5-f7ef-4bd9-87f2-69c6499f4914$''',
  '''^4bf8bdb8-e735-4205-a17e-891be1e1ffbd$''',
  '''^0721c00d-3962-48a3-bc8b-3834a3765170$''',
  # internal/ingest/sources — paradox: the detail resource's "job_token" is the posting's
  # public id, the same value every apply URL carries as ?job_id= (generic-api-key fires on
  # the field name). The shape is the platform's: PDX_<site code>_<uuid>_<location id>.
  '''^PDX_[A-Z0-9]+_[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}_[0-9]+$''',
]

[[allowlists]]
description = "Auth and mail test constants. Each is long enough to trip generic-api-key and says in its own text that it is not a credential."
regexTarget = "secret"
regexes = [
  '''^test-secret-that-is-long-enough-0001$''',
  '''^fh_live_abc123$''',
]

[[allowlists]]
description = "logo.dev publishable key, history only. It was a `pk_` token — the kind designed to ship to a browser — and the code no longer carries it: company logos now go through our own logo.freehire.me proxy, which holds the credential server-side. Kept because the finding is in the history, where it stays."
regexTarget = "secret"
regexes = ['''^pk_fKgOEo0OT4KXvUshjPMGAQ$''']

[[allowlists]]
description = "ITviec listing markup names each posting by a UUID in a `data-job-key` attribute (internal/ingest/sources/testdata/itviec_list_page1.html). It is the posting's public id, printed on every listing page, and the word `key` is what trips generic-api-key. Pinned to the attribute AND the UUID shape, so any other token in that markup is still scanned."
regexTarget = "match"
regexes = ['''^data-job-key='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'$''']

[[allowlists]]
description = "Paradox names each posting by a `job_token` of the shape PDX_JONB_<UUID>_<number> (internal/ingest/sources/testdata/paradox/). It is the posting's id inside the public job JSON every visitor's browser receives, not a credential; the field name is what trips generic-api-key. Pinned to that exact shape."
regexTarget = "secret"
regexes = ['''^PDX_JONB_[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}_[0-9]+$''']

[[allowlists]]
description = "The extension's GA4 Measurement Protocol API secret. It ships inside every published build (MV3 cannot fetch it at runtime from anywhere a reader could not), and all it permits is sending events to the site's own analytics stream — public by construction, like the gtag measurement id beside it. Matched by the variable it is assigned to, so a different key pasted into the same file still fails."
regexTarget = "line"
regexes = ['''WXT_GA_API_SECRET=[A-Za-z0-9_-]{16,40}''']

[[allowlists]]
description = "A git commit SHA pinned as a version: a workflow's `uses: owner/action@<sha> # vX.Y.Z` (zizmor requires every action pinned so) and a mise tool built from a commit (`rev:<sha>`). sourcegraph-access-token fires on any 40-hex string near the word sourcegraph, and the scip-typescript indexer is `@sourcegraph/scip-typescript`, so a pin beside it trips the rule. Pinned to those two line shapes, so a bare 40-hex value anywhere else is still scanned."
regexTarget = "line"
regexes = [
  '''^\s*(?:-\s+)?uses:\s+[\w.-]+/[\w./-]+@[0-9a-f]{40}\s+#\s+v\S+\s*$''',
  '''"cargo:https://github\.com/[\w.-]+/[\w.-]+" = "rev:[0-9a-f]{40}"''',
]
