# WhatJobs — Australia publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# AU account.
#
# The publisher id is NOT here: it lives in the "au:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-au" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
# This account's IT inventory is thin — onboarded anyway per an explicit call to include any
# market with at least one real, corroborated IT posting rather than requiring deep volume.
#
- company: WhatJobs AU — Data engineers
  board: "data engineer" # ~2, this account's overall inventory is tiny (447 total, mostly gig work)
- company: WhatJobs AU — Full stack developers
  board: "full stack developer" # ~1, same caveat
