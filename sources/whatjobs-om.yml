# WhatJobs — Oman publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# OM account.
#
# The publisher id is NOT here: it lives in the "om:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-om" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs OM — Data engineers
  board: "data engineer" # ~38, feed runs dry at page 2
- company: WhatJobs OM — Full stack developers
  board: "full stack developer" # ~35, collapses at page 2
- company: WhatJobs OM — Software engineers
  board: "software engineer" # ~32, feed runs dry at page 2
- company: WhatJobs OM — Backend developers
  board: "backend developer" # ~16, feed runs dry at page 2
- company: WhatJobs OM — DevOps engineers
  board: "devops engineer" # ~13, feed runs dry at page 2
- company: WhatJobs OM — Python developers
  board: "python developer" # ~13, feed runs dry at page 2
- company: WhatJobs OM — Java developers
  board: "java developer" # ~12, collapses at page 1
