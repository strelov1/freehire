# WhatJobs — Argentina publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the AR account.
#
# The publisher id is NOT here: it lives in the "ar:" entry of WHATJOBS_PUBLISHER_IDS, the single
# variable shared by every WhatJobs market. Without an "ar:" entry the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other market's
# (its own publisher id, its own id space for the tracked-URL posting id), so it registers under
# its own provider name, "whatjobs-ar" — see whatjobsMarkets in internal/sources/whatjobs.go.
#
# Argentina inventory only, confirmed live: postings resolve to ar.whatjobs.com tracked URLs.
# English role titles corroborate well (LATAM tech postings mix English and Spanish), so most
# keywords below are English; Spanish is used only where it measured meaningfully more volume.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted). One keyword was tested only
# to the page shown without collapsing (still corroborating when the measurement stopped), so its
# count is a floor, not a final total.
- company: WhatJobs AR — Backend developers
  board: "desarrollador backend" # ~77 corroborated, feed runs dry at page 3
- company: WhatJobs AR — Frontend developers
  board: "frontend developer" # ~17, collapses at page 1
- company: WhatJobs AR — Full stack developers
  board: "full stack developer" # ~357, collapses at page 8
- company: WhatJobs AR — DevOps engineers
  board: "devops engineer" # ~142, feed runs dry at page 4
- company: WhatJobs AR — Java developers
  board: "java developer" # ~84, collapses at page 3
- company: WhatJobs AR — Data engineers
  board: "data engineer" # ≥384 corroborated through page 8 tested, still going
- company: WhatJobs AR — React developers
  board: "react developer" # ~48, collapses at page 2
- company: WhatJobs AR — Python developers
  board: "python developer" # ~35, collapses at page 2
- company: WhatJobs AR — iOS developers
  board: "ios developer" # ~20, feed runs dry at page 2
