# WhatJobs — Denmark publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# DK account.
#
# The publisher id is NOT here: it lives in the "dk:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-dk" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs DK — Data engineers
  board: "data engineer" # ≥400 corroborated through page 8 tested, still going
- company: WhatJobs DK — Full stack developers
  board: "full stack developer" # ~140, collapses at page 4
- company: WhatJobs DK — DevOps engineers
  board: "devops engineer" # ~80, feed runs dry at page 3
- company: WhatJobs DK — Java developers
  board: "java developer" # ~38, collapses at page 2
