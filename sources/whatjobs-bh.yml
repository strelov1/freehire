# WhatJobs — Bahrain publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# BH account.
#
# The publisher id is NOT here: it lives in the "bh:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-bh" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs BH — Software engineers
  board: "software engineer" # ~44, feed runs dry at page 3
- company: WhatJobs BH — Data engineers
  board: "data engineer" # ~30, feed runs dry at page 2
- company: WhatJobs BH — Full stack developers
  board: "full stack developer" # ~17, collapses at page 1
- company: WhatJobs BH — Java developers
  board: "java developer" # ~15, collapses at page 1
- company: WhatJobs BH — DevOps engineers
  board: "devops engineer" # ~13, collapses at page 1
- company: WhatJobs BH — Python developers
  board: "python developer" # ~7, feed runs dry at page 2
- company: WhatJobs BH — Backend developers
  board: "backend developer" # ~3, feed runs dry at page 2
- company: WhatJobs BH — Frontend developers
  board: "frontend developer" # ~3, collapses at page 1
