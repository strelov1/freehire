# UKG Ready (formerly Kronos Workforce Ready) boards. Provider is the filename; each entry is
# company + board. board = "<host>/<tenant>" (see internal/ingest/sources/ukgready.go); the host
# selects the UKG environment the tenant is hosted in and is not derivable from the tenant id.
# Tenant ids are case-insensitive, so boards are written in lower case, and one tenant belongs
# here ONCE — an environment is fronted by several white-label hosts that all serve the same
# tenants, so a second host spelling of a board already listed is the same crawl target. Not to
# be confused with sources/ukg.yml — that is UKG Pro Recruiting, a different product.
# Each board validated live (>0 open postings) before adding.
