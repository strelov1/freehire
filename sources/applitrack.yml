# AppliTrack (Frontline Education) boards. Provider is the filename; each entry is company +
# board. board = the tenant path segment of the career site, as in
# https://www.applitrack.com/<board>/onlineapp/jobpostings/view.asp?AppliTrackJobId=<id>
# (see internal/ingest/sources/applitrack.go). The segment is case-insensitive, so boards are
# written in lower case and a tenant belongs here once.
#
# THE CRAWL READS ONLY EACH DISTRICT'S TECHNOLOGY CATEGORIES, never its whole board. This is a
# K-12 ATS: measured over the 86,033 postings 2,387 live tenants were listing on 2026-09-02,
# freehire's non-technical gate turned away 45.5% and KEPT 46,855 crossing guards, lunchroom
# supervisors and assistant football coaches, because that dictionary was written against
# tech-company boards. The platform's own category facet answers this — the same fleet's
# technology categories held 360 postings, of which the gate turned away 12. The adapter argues
# it at length and lists the categories that count.
#
# So a board is here because its TECHNOLOGY slice was live-validated (it linked postings on
# 2026-09-02), not because the district is hiring. A district with a full board and no technology
# category is deliberately absent: the crawl would read nothing from it, every run, forever.
#
# Two entries will read oddly and both are right. Some tenants are CONSORTIA rather than
# districts ("Wayne County Schools Employment Network"), because that is the applicant pool the
# platform sells; and a name may be carried by two boards, because two districts in different
# states are genuinely called the same thing. Neither is a duplicate to merge away.
#
# Boards are named by the district name the platform itself renders on the career site. A few are
# named after themselves, because those tenants run an older page template that renders the name
# only inside a header IMAGE — there is no text anywhere to read it from.
