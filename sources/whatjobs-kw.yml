# WhatJobs — Kuwait publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# KW account.
#
# The publisher id is NOT here: it lives in the "kw:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-kw" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs KW — Software engineers
  board: "software engineer" # ~54, feed runs dry at page 3
- company: WhatJobs KW — Data engineers
  board: "data engineer" # ~31, feed runs dry at page 3
- company: WhatJobs KW — Python developers
  board: "python developer" # ~39, collapses at page 2
- company: WhatJobs KW — Java developers
  board: "java developer" # ~25, feed runs dry at page 2
- company: WhatJobs KW — Full stack developers
  board: "full stack developer" # ~16, collapses at page 1
- company: WhatJobs KW — Backend developers
  board: "backend developer" # ~3, feed runs dry at page 2
- company: WhatJobs KW — DevOps engineers
  board: "devops engineer" # ~3, collapses at page 1
