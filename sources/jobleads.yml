# JobLeads — a multi-country job aggregator crawled as a multi-company source.
#
# Each entry's board is a SEARCH KEYWORD (the API has no per-employer board), `region`
# scopes it to a market (alpha-2 country filter) and `company` is a display label only —
# the real employer comes from each posting. Keyword list is data-driven: it mirrors the
# platform's own SEO vocabulary, and every keyword's first IT page was verified 96-100%
# dev-relevant live on 2026-08-30; real per-keyword yield is measured on the first crawl.
#
# Provider facts (verified live 2026-08-30): keyless POST API behind a Cloudflare edge
# that rejects the plain Go fingerprint; totalResultCount is page-scoped; ranking rotates
# between runs (14-day sweepGrace); detail descriptions/company are paywalled — body
# assembled from the public sections, company from the search feed; on-topic density
# decays past ~page 25, so the walk is capped at jobleadsMaxPages = 50 (relevance cutoff
# + loop safety).
#
# COLD RUN: the first full run hydrates every board's detail at a shared ~1 req/s —
# expect ~10^5 requests / ~24h for this file; a Type=oneshot timer cuts that short, so
# run it by hand once before enabling the schedule. Steady state afterwards is one walk
# plus new postings, ~an hour per run.
- company: JobLeads — Frontend Developer
  board: Frontend Developer
  region: IT
