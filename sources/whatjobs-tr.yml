# WhatJobs — Turkey publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# TR account.
#
# The publisher id is NOT here: it lives in the "tr:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-tr" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs TR — Software engineers
  board: "software engineer" # ~153, feed runs dry at page 5
- company: WhatJobs TR — Full stack developers
  board: "full stack developer" # ~81, feed runs dry at page 3
- company: WhatJobs TR — Data engineers
  board: "data engineer" # ~50, feed runs dry at page 2
- company: WhatJobs TR — DevOps engineers
  board: "devops engineer" # ~50, feed runs dry at page 2
- company: WhatJobs TR — Java developers
  board: "java developer" # ~53, collapses at page 2
- company: WhatJobs TR — Backend developers
  board: "backend developer" # ~30, feed runs dry at page 2
- company: WhatJobs TR — Android developers
  board: "android developer" # ~11, feed runs dry at page 2
- company: WhatJobs TR — iOS developers
  board: "ios developer" # ~15, feed runs dry at page 2
- company: WhatJobs TR — Frontend developers
  board: "frontend developer" # ~13, feed runs dry at page 2
