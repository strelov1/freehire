# WhatJobs — Norway publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# NO account.
#
# The publisher id is NOT here: it lives in the "no:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-no" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs NO — Software engineers
  board: "software engineer" # ≥176 corroborated through page 5 tested, still going
- company: WhatJobs NO — Data engineers
  board: "data engineer" # ~127, feed runs dry at page 4
- company: WhatJobs NO — Full stack developers
  board: "full stack developer" # ~60, feed runs dry at page 3
- company: WhatJobs NO — Java developers
  board: "java developer" # ~32, collapses at page 2
- company: WhatJobs NO — Backend developers
  board: "backend developer" # ~22, feed runs dry at page 2
- company: WhatJobs NO — DevOps engineers
  board: "devops engineer" # ~27, feed runs dry at page 2
- company: WhatJobs NO — Python developers
  board: "python developer" # ~21, collapses at page 1
