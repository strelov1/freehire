# WhatJobs — Germany publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the DE account.
#
# The publisher id is NOT here: it lives in the "de:" entry of WHATJOBS_PUBLISHER_IDS, the single
# variable shared by every WhatJobs market. Without a "de:" entry the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other market's
# (its own publisher id, its own id space for the tracked-URL posting id), so it registers under
# its own provider name, "whatjobs-de" — see whatjobsMarkets in internal/sources/whatjobs.go.
#
# Germany inventory only, confirmed live: postings resolve to de.whatjobs.com tracked URLs.
# Unlike Brazil, English role keywords corroborate POORLY here — "backend developer" collapsed at
# page 1 with only 40% of postings actually naming it. German postings are titled in German, so
# every keyword below is the German term instead (verified live, not assumed).
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted). Three keywords were tested
# only to the page shown without collapsing (still corroborating when the measurement stopped),
# so their count is a floor, not a final total.
- company: WhatJobs DE — Software engineers
  board: "softwareentwickler" # ~253 corroborated, collapses at page 6
- company: WhatJobs DE — Backend engineers
  board: "backend entwickler" # ~95, feed runs dry at page 4
- company: WhatJobs DE — Frontend engineers
  board: "frontend entwickler" # ~90, collapses at page 3
- company: WhatJobs DE — Java developers
  board: "java entwickler" # ~106, collapses at page 3
- company: WhatJobs DE — Python developers
  board: "python entwickler" # ~87, feed runs dry at page 3
- company: WhatJobs DE — Full stack engineers
  board: "full stack entwickler" # ~113, collapses at page 3
- company: WhatJobs DE — DevOps engineers
  board: "devops ingenieur" # ≥460 corroborated through page 12 tested, still going
- company: WhatJobs DE — Cloud engineers
  board: "cloud ingenieur" # ≥490 corroborated through page 10 tested, still going
- company: WhatJobs DE — QA engineers
  board: "qa ingenieur" # ≥490 corroborated through page 10 tested, still going
- company: WhatJobs DE — Data engineers
  board: "data engineer" # ~328, collapses at page 8 (English term still corroborates here)
