# WhatJobs — Sweden publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# SE account.
#
# The publisher id is NOT here: it lives in the "se:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-se" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs SE — Software engineers
  board: "software engineer" # ~114, feed runs dry at page 4
- company: WhatJobs SE — Full stack developers
  board: "full stack developer" # ~20, feed runs dry at page 2
- company: WhatJobs SE — Data engineers
  board: "data engineer" # ~40, feed runs dry at page 2
- company: WhatJobs SE — DevOps engineers
  board: "devops engineer" # ~33, feed runs dry at page 2
- company: WhatJobs SE — Java developers
  board: "java developer" # ~19, collapses at page 1
