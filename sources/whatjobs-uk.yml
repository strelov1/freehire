# WhatJobs — United Kingdom publisher account. Same CPC-network shape as sources/whatjobs.yml
# (see its header for the keyword-as-board design); this file only carries what differs for the
# UK account.
#
# The publisher id is NOT here: it lives in the "uk:" entry of WHATJOBS_PUBLISHER_IDS, the single
# variable shared by every WhatJobs market. Without a "uk:" entry the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other market's
# (its own publisher id, its own id space for the tracked-URL posting id), so it registers under
# its own provider name, "whatjobs-uk" — see whatjobsMarkets in internal/sources/whatjobs.go.
#
# UK inventory only, confirmed live: postings resolve to uk.whatjobs.com tracked URLs. Like the US
# account, this one is deep — English keywords corroborate at or near 100% for many pages, well
# past what this run's testing walked.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted). Most keywords here were
# tested only to the page shown WITHOUT collapsing, so their count is a floor, not a final total —
# this account is deep enough that a proper collapse-point measurement would need the full
# whatjobsMaxPages budget.
