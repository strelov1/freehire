# Workstream (www.workstream.us) boards. Provider is the filename; each entry is company + board.
# board = the employer's eight-hex career-site id, the segment after "/j/" in
# https://www.workstream.us/j/<board> — the id the platform's own legacy careers URL,
# /j/<employer-slug>, 301-redirects onto (see internal/ingest/sources/workstream.go).
#
# There is no seed list for this platform and no directory of career sites: its sitemap.xml is
# the marketing site's and carries no /j/ URL at all. Every board below was discovered by
# cmd/harvest-boards from Common Crawl's index of www.workstream.us/j/* and kept only because a
# live probe returned postings — 1,388 candidates, 777 live.
#
# ONE BOARD PER EMPLOYER NAME, and the 777 are deliberately not all here. This is a trade, not a
# deduplication: the 540 boards left out are real franchise operators posting real jobs at their
# own stores, and leaving them out is lost coverage. It is made because of how they are NAMED.
# Workstream is sold to franchisees and each operator's account reports the BRAND as its employer,
# so 358 of the 777 live boards are called "Chick-fil-A", 67 "Jimmy John's", 60 "Culver's".
# sources.Config.Shard assigns whole COMPANIES to shards — it must, because the stale-job sweep
# scopes closes by company_slug — so those 358 are one indivisible lump larger than any run's
# budget: `--shard=1/40` over the full harvest still crawled 363 of 777 boards. A file that cannot
# be sharded cannot be crawled at all at this platform's pace (~0.5 req/s per IP; see
# workstreamRequestInterval), which is what decided the cut. Keeping the first board of each
# distinct employer leaves 237, and those 237 do shard evenly (119/118).
#
# Raising this is a real option, but it needs the naming fixed first — company_slug_aliases or a
# per-operator name — not just more entries.
