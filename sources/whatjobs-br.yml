# WhatJobs — Brazil publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the full explanation of the keyword-as-board design); this file only carries what
# differs for the BR account.
#
# The publisher id is NOT here: it is the account credential and lives in the "br:" entry of
# WHATJOBS_PUBLISHER_IDS, the single variable shared by every WhatJobs market (see
# sources/whatjobs.yml's header). Without a "br:" entry the provider is not registered and this
# file fails validation, by design. It is a SEPARATE account from sources/whatjobs.yml's (a
# different publisher id, a different id space for the tracked-URL posting id), so it registers
# under its own provider name, "whatjobs-br" — see whatjobsMarkets in internal/sources/whatjobs.go.
#
# Brazil inventory only, confirmed live: postings resolve to br.whatjobs.com tracked URLs and
# São Paulo-area locations. Brazilian tech postings are titled in English as often as not, so the
# same English role keywords corroborate here too — verified live rather than assumed.
#
# Keyword volumes below are CORROBORATED counts measured live on 2026-08-10 — the number of
# postings that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted). Two keywords from the US
# file's list are swapped out here because they barely exist in this account's inventory:
# "kubernetes engineer" collapsed at page 1 with only 12 corroborated postings and "rust
# developer" at page 1 with 5 — "devops engineer" and "java developer" replace them, both with
# real BR volume (Java is a mainstay of the region's enterprise/banking market).
- company: WhatJobs BR — Backend engineers
  board: "backend engineer" # ~251 corroborated, collapses at page 7
- company: WhatJobs BR — Frontend engineers
  board: "frontend engineer" # ~80, collapses at page 3
- company: WhatJobs BR — React developers
  board: "react developer" # ~110, collapses at page 3
- company: WhatJobs BR — Python developers
  board: "python developer" # ~89, collapses at page 3
- company: WhatJobs BR — Java developers
  board: "java developer" # ~146, collapses at page 4
- company: WhatJobs BR — DevOps engineers
  board: "devops engineer" # ~172, collapses at page 5
- company: WhatJobs BR — iOS developers
  board: "ios developer" # ~252, feed runs dry at page 10
- company: WhatJobs BR — Android developers
  board: "android developer" # ~62, collapses at page 2
- company: WhatJobs BR — Node.js developers
  board: "node.js developer" # ~28, collapses at page 2
- company: WhatJobs BR — Go developers
  board: "golang" # ~66, collapses at page 3
