# WhatJobs — Colombia publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# CO account.
#
# The publisher id is NOT here: it lives in the "co:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-co" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs CO — Full stack developers
  board: "full stack developer" # ≥400 corroborated through page 8 tested, still going
- company: WhatJobs CO — Data engineers
  board: "data engineer" # ≥400 through page 8 tested, still going
- company: WhatJobs CO — Backend developers
  board: "desarrollador backend" # ~150, feed runs dry at page 5
- company: WhatJobs CO — DevOps engineers
  board: "devops engineer" # ~213, feed runs dry at page 6
- company: WhatJobs CO — Java developers
  board: "java developer" # ~91, collapses at page 3
- company: WhatJobs CO — React developers
  board: "react developer" # ~78, collapses at page 3
- company: WhatJobs CO — Python developers
  board: "python developer" # ~60, collapses at page 2
- company: WhatJobs CO — Frontend developers
  board: "frontend developer" # ~45, collapses at page 2
- company: WhatJobs CO — iOS developers
  board: "ios developer" # ~41, feed runs dry at page 2
- company: WhatJobs CO — Android developers
  board: "android developer" # ~18, feed runs dry at page 2
