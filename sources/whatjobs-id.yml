# WhatJobs — Indonesia publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# ID account.
#
# The publisher id is NOT here: it lives in the "id:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-id" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs ID — Backend developers
  board: "backend developer" # ≥377 corroborated through page 8 tested, still going
- company: WhatJobs ID — Data engineers
  board: "data engineer" # ~273 through page 8 tested, still going
- company: WhatJobs ID — Frontend developers
  board: "frontend developer" # ~172, collapses at page 5
- company: WhatJobs ID — Full stack developers
  board: "full stack developer" # ~143, collapses at page 4
- company: WhatJobs ID — Java developers
  board: "java developer" # ~137, collapses at page 5
- company: WhatJobs ID — DevOps engineers
  board: "devops engineer" # ~99, collapses at page 3
- company: WhatJobs ID — Python developers
