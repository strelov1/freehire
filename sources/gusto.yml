# Gusto Hiring (jobs.gusto.com) boards. Provider is the filename; each entry is company + board.
# board = the whole path segment of the board URL, "<company-slug>-<company-uuid>" as in
# https://jobs.gusto.com/boards/<board> — the uuid alone and the slug alone both 404, so neither
# half is the id (see internal/ingest/sources/gusto.go).
#
# ONE ENTRY PER COMPANY UUID. A renamed employer keeps its OLD slug resolving against the same
# uuid, so two spellings of one board both answer 200 and list identical postings — and because
# the pipeline namespaces an external id by BOARD, listing both would store every one of that
# employer's postings twice. 33 of the 825 candidates this file was harvested from were such
# twins; each was folded onto the spelling the platform's own posting breadcrumb links back to.
# The same care is due of anything appended later: a trailing ".json" also answers 200 (the board
# route ignores it), which is a second way to spell one board.
#
# Every board below was probed live and kept only because it returned postings.
