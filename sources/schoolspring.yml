# SchoolSpring (schoolspring.com) — PowerSchool's US K-12 education job board, crawled as a
# multi-company aggregator over one central keyless API. Keyless.
#
# Each entry's board is a SEARCH KEYWORD, not a tenant id: SchoolSpring has no per-employer
# board (one index serves all 80,611 open postings, and an employer is a filter over it), so a
# keyword is how a slice is selected. The shape matches sources/whatjobs.yml, whose board is
# also a keyword, and sources/hh.yml, whose board is a professional_role. company is a display
# label only — the real employer is the school district read off each posting.
#
# WHY THE CRAWL IS SCOPED AT ALL, since this file would otherwise be one line: this is a school
# board. classify.IsTech fires on 36 of its 80,611 titles (0.04%), and freehire's ingest filter
# would not save the catalogue from the rest — classify.ConfirmedNonTech is a non-tech TITLE
# dictionary with no term for K-12 classified staff, and run over the live index it admits
# 41,543 postings (51.5%) that are school psychologists, bus monitors, crossing guards, football
# coaches and cafeteria workers. The platform's own category taxonomy cannot select the technical
# slice either (37% of postings carry no category, the densest ones reach a quarter of the
# technical postings, and they overlap enough that one board per category would double-store 40%
# of its rows). See internal/ingest/sources/schoolspring.go.
#
# The keyword is a case-insensitive SUBSTRING match over a posting's title AND its employer
# name, which is why every keyword below is a whole phrase: bare "network" pulls in 235 stale
# teaching postings from an employer called "Acero Schools Network", and "it manager" matches
# "Unit Manager". A phrase that starts matching employer names instead of titles shows up in
# the per-board rejection line cmd/ingest logs, which is what that line is for.
#
# The counts beside each board are live listing totals measured on 2026-09-02. They sum to 418
# rows over 381 distinct postings — a title matching two keywords is listed under both, and
# stored under both. The first prod-shaped crawl ingested 383 of those rows across 241 school
# districts in 56s, turning away 27 as non-technical (6.6%) and failing none.
