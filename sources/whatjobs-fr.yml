# WhatJobs — France publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the FR account.
#
# The publisher id is NOT here: it lives in the "fr:" entry of WHATJOBS_PUBLISHER_IDS, the single
# variable shared by every WhatJobs market. Without a "fr:" entry the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other market's
# (its own publisher id, its own id space for the tracked-URL posting id), so it registers under
# its own provider name, "whatjobs-fr" — see whatjobsMarkets in internal/sources/whatjobs.go.
#
# France inventory only, confirmed live: postings resolve to fr.whatjobs.com tracked URLs and
# Paris-area locations. Unlike Germany, both English and French role titles corroborate well here
# — French tech postings mix the two freely — so the list below picks whichever phrasing measured
# more volume per role.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted). Three keywords were tested
# only to the page shown without collapsing (still corroborating when the measurement stopped),
# so their count is a floor, not a final total.
- company: WhatJobs FR — Backend developers
  board: "développeur backend" # ~262 corroborated, feed runs dry at page 7
- company: WhatJobs FR — Frontend developers
  board: "développeur frontend" # ~31, feed runs dry at page 2
- company: WhatJobs FR — React developers
  board: "react developer" # ~117, collapses at page 3
- company: WhatJobs FR — Python developers
  board: "python developer" # ~175, collapses at page 6
- company: WhatJobs FR — Java developers
  board: "java developer" # ~111, collapses at page 3
- company: WhatJobs FR — DevOps engineers
  board: "ingénieur devops" # ≥490 corroborated through page 10 tested, still going
- company: WhatJobs FR — Full stack developers
  board: "développeur full stack" # ≥490 corroborated through page 10 tested, still going
- company: WhatJobs FR — Data engineers
  board: "data engineer" # ≥398 corroborated through page 8 tested, still going
- company: WhatJobs FR — iOS developers
  board: "ios developer" # ~29, feed runs dry at page 2
- company: WhatJobs FR — Android developers
  board: "android developer" # ~33, feed runs dry at page 2
