# hiringthing boards. Provider is the filename; each entry is company + board.
# board = the full HiringThing careers host (see internal/ingest/sources/hiringthing.go).
# The platform is white-labelled, so a tenant is served under the vendor's own domain
# (<tenant>.hiringthing.com) and under each reseller's (<tenant>.prismhr-hire.com,
# <tenant>.oasisrecruit.com, <tenant>.verahr-hiring.com, <tenant>.gnahiring.com, ...):
# the host is the board, a slug alone names nothing. The adapter reads https://<board>/
# (the whole board, one page) and then each posting page's own job record.
# Each board validated live (>0 postings linked from its listing) before adding.

