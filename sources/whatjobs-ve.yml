# WhatJobs — Venezuela publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# VE account.
#
# The publisher id is NOT here: it lives in the "ve:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-ve" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs VE — Full stack developers
  board: "full stack developer" # ~25, feed runs dry at page 2
- company: WhatJobs VE — Backend developers
  board: "desarrollador backend" # ~10, feed runs dry at page 2
- company: WhatJobs VE — DevOps engineers
  board: "devops engineer" # ~8, feed runs dry at page 2
- company: WhatJobs VE — Data engineers
  board: "data engineer" # ~7, feed runs dry at page 2
- company: WhatJobs VE — Java developers
  board: "java developer" # ~5, collapses at page 1
