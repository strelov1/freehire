# WhatJobs — Austria publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the AT account.
#
# The publisher id is NOT here: it lives in the "at:" entry of WHATJOBS_PUBLISHER_IDS, the single
# variable shared by every WhatJobs market. Without an "at:" entry the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other market's
# (its own publisher id, its own id space for the tracked-URL posting id), so it registers under
# its own provider name, "whatjobs-at" — see whatjobsMarkets in internal/sources/whatjobs.go.
#
# Austria inventory only, confirmed live: postings resolve to at.whatjobs.com tracked URLs.
# German role titles corroborate here as they do for DE (sources/whatjobs-de.yml), but the
# account's total inventory (~8k live on 2026-08-10) is mostly non-tech (sales, hospitality,
# print), so its tech segment is genuinely small — every keyword below tops out under 40
# corroborated postings. That is real signal, not a mismeasurement: this is a small country's
# smaller job market, not the deep US/DE/UK-scale feed.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
- company: WhatJobs AT — Data engineers
  board: "data engineer" # ~38 corroborated, collapses at page 2
- company: WhatJobs AT — Full stack engineers
  board: "full stack entwickler" # ~19, collapses at page 1
- company: WhatJobs AT — Java developers
  board: "java entwickler" # ~12, collapses at page 1
