# WhatJobs — Luxembourg publisher account. Same CPC-network shape as sources/whatjobs.yml (see its
# header for the keyword-as-board design); this file only carries what differs for the
# LU account.
#
# The publisher id is NOT here: it lives in the "lu:" entry of WHATJOBS_PUBLISHER_IDS, the
# single variable shared by every WhatJobs market. Without it the provider is not registered
# and this file fails validation, by design. It is a SEPARATE account from every other
# market's (its own publisher id, its own id space for the tracked-URL posting id), so it
# registers under its own provider name, "whatjobs-lu" — see whatjobsMarkets in
# internal/sources/whatjobs.go.
#
# Keyword volumes are CORROBORATED counts measured live on 2026-08-10 — the number of postings
# that actually name the keyword's terms, not the feed's own padded `total` (see
# sources/whatjobs.yml's header for why `total` cannot be trusted).
#
#
- company: WhatJobs LU — Data engineers
  board: "data engineer" # ~50, feed runs dry at page 3
- company: WhatJobs LU — Full stack developers
  board: "full stack developer" # ~18, collapses at page 1
- company: WhatJobs LU — Java developers
  board: "java developer" # ~16, collapses at page 1
- company: WhatJobs LU — Software engineers
  board: "software engineer" # ~15, collapses at page 1
- company: WhatJobs LU — Python developers
  board: "python developer" # ~8, collapses at page 1
- company: WhatJobs LU — DevOps engineers
  board: "devops engineer" # ~7, collapses at page 1
- company: WhatJobs LU — Backend developers
  board: "backend developer" # ~3, collapses at page 1
