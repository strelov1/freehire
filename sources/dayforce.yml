# Dayforce (formerly Ceridian) career sites. Provider is the filename; each entry is
# company + board. board = "<tenant>/<site>", the two path segments a site's own URL carries
# on jobs.dayforcehcm.com, so https://jobs.dayforcehcm.com/en-US/dcrusa/join-us is
# "dcrusa/join-us" (see internal/ingest/sources/dayforce.go). A tenant may run several sites,
# and each is its own board.
#
# An optional third segment names the site's culture ("gm/candidateportal/fr-CA"); omitted it
# is en-US, which every English site answers. Only a site publishing in NO English culture
# needs one — and a site must appear ONCE however many cultures it publishes in, because one
# posting keeps the same id in all of them.
#
# Candidates were harvested out-of-band and each board here was validated live (>0 open
# postings) by cmd/harvest-boards before being added.
