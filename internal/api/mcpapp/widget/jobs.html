<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freehire</title>
<style>
  /* The host's own variables win (MCP Apps hostContext.styles); ours are the fallback,
     copied from design-system/dist/tokens-{light,dark}.css. */
  :root {
    color-scheme: light dark;
    --fh-bg: var(--color-background-primary, light-dark(oklch(0.997 0.003 130), oklch(0.16 0.006 110)));
    --fh-fg: var(--color-text-primary, light-dark(oklch(0.13 0 0), oklch(0.985 0 0)));
    --fh-muted-fg: var(--color-text-secondary, light-dark(oklch(0.43 0 0), oklch(0.72 0 0)));
    --fh-muted: var(--color-background-secondary, light-dark(oklch(0.955 0 0), oklch(0.24 0 0)));
    --fh-border: var(--color-border-primary, light-dark(oklch(0.92 0 0), oklch(1 0 0 / 8%)));
    --fh-good: light-dark(oklch(0.52 0.14 150), oklch(0.78 0.15 150));
    --fh-warn: light-dark(oklch(0.55 0.15 70), oklch(0.83 0.19 84));
    --fh-bad: light-dark(oklch(0.577 0.245 27.3), oklch(0.704 0.191 22.2));
    --fh-radius: var(--border-radius-md, 10px);
    --fh-font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: transparent; color: var(--fh-fg); font: 14px/1.45 var(--fh-font); }
  .notice { margin: 0 0 8px; padding: 8px 10px; border-radius: var(--fh-radius); background: var(--fh-muted); color: var(--fh-muted-fg); font-size: 12px; }
  .empty { padding: 16px; color: var(--fh-muted-fg); }
  .list { display: flex; flex-direction: column; }
  .card { display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid var(--fh-border); }
  .list .card:last-child { border-bottom: 0; }
  .logo { flex: none; width: 40px; height: 40px; border-radius: 8px; object-fit: contain; background: #fff; border: 1px solid var(--fh-border); }
  .mono { display: flex; align-items: center; justify-content: center; background: var(--fh-muted); color: var(--fh-muted-fg); font-weight: 600; font-size: 16px; }
  .body { min-width: 0; flex: 1; }
  .title { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .meta { margin: 2px 0 0; color: var(--fh-muted-fg); font-size: 13px; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 0; font-size: 13px; }
  .salary { font-weight: 600; }
  .skills { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0; padding: 0; list-style: none; }
  .skills li { padding: 1px 8px; border-radius: 999px; background: var(--fh-muted); font-size: 12px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; }
  .btn { display: inline-block; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--fh-border); color: var(--fh-fg); text-decoration: none; font-size: 13px; font-weight: 500; cursor: pointer; background: transparent; font-family: inherit; }
  .btn.primary { background: var(--fh-fg); color: var(--fh-bg); border-color: var(--fh-fg); }
  .btn:focus-visible, select:focus-visible { outline: 2px solid var(--fh-fg); outline-offset: 3px; }
  .btn[hidden] { display: none; }
  .btn:disabled, select:disabled { cursor: default; opacity: 0.6; }
  /* The account controls sit in the card's own action row; status lines wrap below it. */
  .account-actions, .account-controls { display: contents; }
  .stage-select { min-width: 0; max-width: 100%; padding: 5px 28px 5px 12px; border: 1px solid var(--fh-border); border-radius: 999px; background: transparent; color: var(--fh-fg); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; }
  .stage-select option { background: var(--fh-bg); color: var(--fh-fg); }
  .action-status { flex-basis: 100%; margin: 0; font-size: 12px; color: var(--fh-muted-fg); overflow-wrap: anywhere; }
  .action-status:empty { display: none; }
  .action-recovery { flex-basis: 100%; font-size: 12px; }
  .action-recovery[hidden] { display: none; }
  .action-recovery label { display: block; margin-bottom: 8px; }
  .account-actions[data-state="confirmed"] .action-status { color: var(--fh-good); }
  .account-actions[data-state="failed"] .action-status, .account-actions[data-state="unknown"] .action-status { color: var(--fh-bad); }
  .source { margin-left: auto; color: var(--fh-muted-fg); font-size: 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .badge { padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; font-size: 12px; }
  .badge.good { color: var(--fh-good); }
  .badge.warn { color: var(--fh-warn); }
  .badge.bad { color: var(--fh-bad); }
  .badge.plain { color: var(--fh-muted-fg); }
  .detail { padding: 0 12px 12px; }
  .detail h3 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; }
  .detail ul { margin: 0; padding-left: 18px; }
  .detail .apply { margin: 14px 0 0; color: var(--fh-muted-fg); font-size: 13px; }
  .description { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
  .description.collapsed { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .more { margin: 6px 0 0; }
</style>
</head>
<body>
<main id="root"></main>
<script>
"use strict";
// Draws a freehire search_jobs or get_job result inside an MCP Apps host (ChatGPT, Claude).
//
// Rules this page keeps, each enforced by a Go test beside it:
// - Wire data lives only in variables named `result`, `job` and `req`, so the field guard
//   can find every field the page reads and check it against wire.go.
// - Values are inserted as text, never as markup; a URL is used only when it is https.
// - No direct network access: account actions go through the host's approved MCP connection.
(function () {
  const root = document.getElementById("root");
  const SKILLS_SHOWN = 5;
  let hostCapabilities = {};
  let nextId = 1;
  let lastToolResult;
  const actionStates = new Map();
  const STAGES = ["preparing", "applied", "screening", "responded", "interview", "offer", "accepted", "rejected", "withdrawn", "expired"];

  // ---- the bridge: JSON-RPC over postMessage to the host -------------------------------

  const pending = new Map();
  // "*" is deliberate, and what the official ext-apps PostMessageTransport sends with. The
  // page runs in a sandboxed frame and cannot know its host's origin (ChatGPT's and Claude's
  // differ, and neither is ours to list), while the recipient is fixed: window.parent, the
  // frame's own embedder. Tracking actions carry only a posting slug and chosen stage,
  // never credentials or notes. Incoming
  // messages are the side that needs a check, and get one: event.source must be the parent.
  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params, timeout) {
    const id = nextId++;
    return new Promise(function (resolve, reject) {
      const timer = timeout ? setTimeout(function () {
        pending.delete(id);
        reject(new Error("The host did not confirm the request in time."));
      }, timeout) : undefined;
      pending.set(id, { resolve: resolve, reject: reject, timer: timer });
      send({ jsonrpc: "2.0", id: id, method: method, params: params });
    });
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method: method, params: params || {} }); }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const waiter = pending.get(message.id);
      pending.delete(message.id);
      clearTimeout(waiter.timer);
      if (message.error) waiter.reject(message.error); else waiter.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-result") {
      render(message.params);
    } else if (message.method === "ui/notifications/host-context-changed") {
      applyHostContext(message.params);
    }
  });

  function applyHostContext(context) {
    if (!context) return;
    if (context.theme === "light" || context.theme === "dark") {
      document.documentElement.dataset.theme = context.theme;
    }
    const variables = context.styles && context.styles.variables;
    if (variables) {
      for (const name of Object.keys(variables)) {
        if (name.startsWith("--") && typeof variables[name] === "string") {
          document.documentElement.style.setProperty(name, variables[name]);
        }
      }
    }
  }

  // The frame is as tall as the host makes it; the page says how tall it wants to be.
  //
  // Measured as the official ext-apps App does: the root's scrollHeight is never less than
  // the frame, so a frame that grew could never shrink again ("Show less", a shorter result).
  // max-content measures the content itself. Sent only on a change, and only once the host
  // has been told the page is ready — before that it may not accept a notification.
  let ready = false, lastWidth = 0, lastHeight = 0;
  function reportSize() {
    if (!ready) return;
    const html = document.documentElement;
    const original = html.style.height;
    html.style.height = "max-content";
    const height = Math.ceil(html.getBoundingClientRect().height);
    html.style.height = original;
    const width = Math.ceil(window.innerWidth);
    if (width === lastWidth && height === lastHeight) return;
    lastWidth = width;
    lastHeight = height;
    notify("ui/notifications/size-changed", { width: width, height: height });
  }

  function start() {
    notify("ui/notifications/initialized");
    ready = true;
    const observer = new ResizeObserver(reportSize);
    observer.observe(document.documentElement);
    observer.observe(document.body);
  }

  // Field names are McpUiInitializeRequest's (ext-apps src/spec.types.ts); a test holds them.
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "freehire-jobs", version: "1" },
    appCapabilities: {},
  }).then(function (init) {
    hostCapabilities = (init && init.hostCapabilities) || {};
    applyHostContext(init && init.hostContext);
    start();
    if (lastToolResult) render(lastToolResult);
  }, start);

  // ChatGPT also hands the result to the page directly, before any bridge message.
  if (window.openai && window.openai.toolOutput) {
    render({ structuredContent: window.openai.toolOutput });
  }

  // ---- links ----------------------------------------------------------------------------

  function safeURL(value) {
    if (typeof value !== "string") return "";
    try {
      return new URL(value).protocol === "https:" ? value : "";
    } catch (e) {
      return "";
    }
  }

  // A link is a real anchor, so a host with no bridge still opens it; where the host can open
  // links itself, that is what the click asks for instead.
  function link(label, href, primary) {
    const a = el("a", primary ? "btn primary" : "btn", label);
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.addEventListener("click", function (event) {
      if (hostCapabilities.openLinks) {
        event.preventDefault();
        request("ui/open-link", { url: href }).catch(function () { window.open(href, "_blank", "noopener"); });
      } else if (window.openai && typeof window.openai.openExternal === "function") {
        event.preventDefault();
        window.openai.openExternal({ href: href });
      }
    });
    return a;
  }

  // ---- rendering ------------------------------------------------------------------------

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null && text !== "") node.textContent = String(text);
    return node;
  }

  function render(toolResult) {
    if (!toolResult) return;
    if (toolResult.isError) {
      root.replaceChildren();
      const first = (toolResult.content || [])[0];
      root.append(el("p", "empty", first && first.text ? first.text : "freehire could not answer this request."));
      return;
    }
    const result = toolResult.structuredContent;
    if (!result || (!Array.isArray(result.jobs) && typeof result.description !== "string")) return;
    lastToolResult = toolResult;
    draw();
  }

  function draw() {
    const result = lastToolResult && lastToolResult.structuredContent;
    if (!result) return;
    for (const state of actionStates.values()) state.views = [];
    root.replaceChildren();
    if (Array.isArray(result.jobs)) renderList(result);
    else if (typeof result.description === "string") renderDetail(result);
  }

  function renderList(result) {
    if (result.ignored_params && result.ignored_params.length) {
      root.append(el("p", "notice", "Not applied: " + result.ignored_params.join(", ") + ". These results are wider than asked."));
    }
    if (!result.jobs.length) {
      root.append(el("p", "empty", "No open postings matched."));
      return;
    }
    const list = el("div", "list");
    for (const job of result.jobs) list.append(card(job, true));
    root.append(list);
  }

  function renderDetail(job) {
    root.append(card(job, false));
    const detail = el("section", "detail");

    const badges = el("div", "badges");
    const reality = { "fresh": ["Looks live", "good"], "stale": ["May be stale", "warn"], "likely-evergreen": ["Evergreen posting", "warn"] }[job.reality];
    if (reality) badges.append(el("span", "badge " + reality[1], reality[0]));
    const ghost = { "possible": ["Possibly not being filled", "warn"], "likely": ["Likely not being filled", "bad"] }[job.ghost_level];
    if (ghost) badges.append(el("span", "badge " + ghost[1], ghost[0]));
    if (job.fake_freshness) badges.append(el("span", "badge warn", "Reposted date"));
    const seen = ago(job.last_seen_at);
    if (seen) badges.append(el("span", "badge plain", "Last seen open " + seen));
    if (badges.childElementCount) detail.append(badges);

    const requirements = job.requirements || [];
    for (const [priority, heading] of [["required", "Required"], ["preferred", "Nice to have"]]) {
      const items = requirements.filter(function (req) { return req.priority === priority; });
      if (!items.length) continue;
      detail.append(el("h3", "", heading));
      const ul = el("ul");
      for (const req of items) ul.append(el("li", "", req.text));
      detail.append(ul);
    }

    if (job.description) {
      detail.append(el("h3", "", "Description"));
      const text = el("p", "description collapsed", job.description);
      detail.append(text);
      const more = el("button", "btn more", "Show all");
      more.type = "button";
      more.addEventListener("click", function () {
        const collapsed = text.classList.toggle("collapsed");
        more.textContent = collapsed ? "Show all" : "Show less";
      });
      detail.append(more);
    }

    if (job.apply_via) {
      let line = "Applications go through " + job.apply_via;
      if (job.apply_requires && job.apply_requires.length) line += "; the form asks for " + job.apply_requires.join(", ");
      detail.append(el("p", "apply", line + "."));
    }
    root.append(detail);
  }

  // card is the header both views share: who, what, where, how much, and the way out.
  function card(job, compact) {
    const node = el("article", "card");
    node.append(logo(job.company));
    const body = el("div", "body");
    body.append(el(compact ? "h2" : "h1", "title", job.title));
    body.append(el("p", "meta", [job.company, where(job)].filter(Boolean).join(" · ")));

    const facts = el("p", "facts");
    const pay = salary(job);
    if (pay) facts.append(el("span", "salary", pay));
    if (job.seniority) facts.append(el("span", "", label(job.seniority)));
    if (job.employment_type) facts.append(el("span", "", label(job.employment_type)));
    if (job.visa_sponsorship) facts.append(el("span", "", "Visa sponsorship"));
    const posted = ago(job.posted_at);
    if (posted) facts.append(el("span", "", "Posted " + posted));
    if (facts.childElementCount) body.append(facts);

    const skills = (job.skills || []).slice(0, SKILLS_SHOWN);
    if (skills.length) {
      const ul = el("ul", "skills");
      for (const skill of skills) ul.append(el("li", "", skill));
      body.append(ul);
    }

    const actions = el("div", "actions");
    const page = safeURL(job.url);
    if (page) actions.append(link("Open on freehire", page, true));
    const employer = safeURL(job.official_job_url);
    if (employer) actions.append(link("Employer's posting", employer, false));
    if (hostCapabilities.serverTools && typeof job.slug === "string" && job.slug.trim()) {
      actions.append(accountActions(job));
    }
    if (job.source) actions.append(el("span", "source", "via " + job.source));
    body.append(actions);

    node.append(body);
    return node;
  }

  // The host proxies these calls using its approved connection. No credential or
  // network request belongs in the iframe, and changing a stage never sends notes.
  function accountActions(job) {
    let state = actionStates.get(job.slug);
    if (!state) {
      state = { phase: "idle", saved: false, selectedStage: "", message: "", checkedNoChange: false, views: [] };
      actionStates.set(job.slug, state);
    }
    const panel = el("section", "account-actions");
    panel.setAttribute("aria-label", "Your tracking for " + job.title);
    const controls = el("div", "account-controls");
    const save = el("button", "btn", "Save job");
    save.type = "button";
    const stage = el("select", "stage-select");
    stage.setAttribute("aria-label", "Application stage for " + job.title);
    const placeholder = el("option", "", "Set stage");
    placeholder.value = "";
    stage.append(placeholder);
    for (const value of STAGES) {
      const option = el("option", "", label(value));
      option.value = value;
      stage.append(option);
    }
    stage.value = state.selectedStage;
    const update = el("button", "btn primary", "Update stage");
    update.type = "button";
    controls.append(save, stage, update);
    const status = el("p", "action-status");
    status.setAttribute("role", "status");
    status.setAttribute("aria-live", "polite");
    const recovery = el("div", "action-recovery");
    const confirmationLabel = el("label");
    const confirmation = el("input");
    confirmation.type = "checkbox";
    confirmationLabel.append(confirmation, document.createTextNode(" I checked my freehire board; this change was not applied."));
    const allowRetry = el("button", "btn", "I checked, allow retry");
    allowRetry.type = "button";
    recovery.append(confirmationLabel, allowRetry);
    panel.append(controls, status, recovery);

    function renderState() {
      const busy = state.phase === "saving" || state.phase === "updating";
      const locked = busy || state.phase === "unknown";
      panel.dataset.state = state.phase;
      panel.setAttribute("aria-busy", String(busy));
      save.disabled = locked || state.saved;
      save.textContent = state.phase === "saving" ? "Saving..." : state.saved ? "Saved" : "Save job";
      stage.disabled = locked;
      update.disabled = locked || !state.selectedStage;
      // Shown only once a stage is picked, so an idle card carries two controls, not three.
      update.hidden = !state.selectedStage;
      update.textContent = state.phase === "updating" ? "Updating..." : "Update stage";
      status.textContent = state.message;
      recovery.hidden = state.phase !== "unknown";
      confirmation.checked = state.checkedNoChange;
      allowRetry.disabled = !state.checkedNoChange;
    }

    function refresh() {
      for (const view of state.views) view();
    }

    function unknown() {
      state.phase = "unknown";
      state.checkedNoChange = false;
      state.message = "We could not confirm this change. Check your freehire board before trying again.";
      refresh();
    }

    function run(name, args) {
      if (state.phase === "saving" || state.phase === "updating" || state.phase === "unknown") return;
      state.phase = name === "save_job" ? "saving" : "updating";
      state.message = name === "save_job" ? "Saving to your freehire board..." : "Updating your application stage...";
      refresh();
      request("tools/call", { name: name, arguments: args }, 30000).then(function (reply) {
        if (!reply || typeof reply !== "object" || !Array.isArray(reply.content)) { unknown(); return; }
        if (reply.isError) {
          const text = (reply.content || []).find(function (item) { return item && item.type === "text" && typeof item.text === "string"; });
          state.phase = "failed";
          state.message = text ? text.text.slice(0, 280) : "freehire could not make this change. Try again when the problem is resolved.";
          refresh();
          return;
        }
        let account = reply.structuredContent;
        if (!account) {
          const text = (reply.content || []).find(function (item) { return item && item.type === "text" && typeof item.text === "string"; });
          try { account = text && JSON.parse(text.text); } catch (error) { unknown(); return; }
        }
        if (!account || !Number.isSafeInteger(account.job_id) || account.job_id < 1) { unknown(); return; }
        if (name === "save_job") {
          if (typeof account.saved_at !== "string" || !Number.isFinite(Date.parse(account.saved_at))) { unknown(); return; }
          state.saved = true;
          state.message = "Saved to your freehire board.";
        } else {
          if (account.stage !== args.stage) { unknown(); return; }
          state.message = "Stage updated to " + label(account.stage) + ".";
        }
        state.phase = "confirmed";
        refresh();
      }).catch(unknown);
    }

    state.views.push(renderState);
    confirmation.addEventListener("change", function () {
      state.checkedNoChange = confirmation.checked;
      refresh();
    });
    allowRetry.addEventListener("click", function () {
      if (state.phase !== "unknown" || !state.checkedNoChange) return;
      state.phase = "idle";
      state.checkedNoChange = false;
      state.message = "You confirmed no change on your board. Choose Save job or Update stage to try again.";
      refresh();
    });
    save.addEventListener("click", function () { run("save_job", { slug: job.slug }); });
    stage.addEventListener("change", function () {
      state.selectedStage = STAGES.includes(stage.value) ? stage.value : "";
      refresh();
    });
    update.addEventListener("click", function () {
      if (state.selectedStage) run("track_job", { slug: job.slug, stage: state.selectedStage });
    });
    refresh();
    return panel;
  }

  // logo is the company's mark from our proxy, or its initial when the proxy has none.
  function logo(company) {
    const monogram = el("div", "logo mono", (company || "?").trim().charAt(0).toUpperCase());
    if (!company) return monogram;
    const img = el("img", "logo");
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.addEventListener("error", function () { img.replaceWith(monogram); });
    img.src = "https://logo.freehire.me/" + encodeURIComponent(company);
    return img;
  }

  function where(job) {
    const place = job.location || (job.countries || []).join(", ");
    const mode = job.work_mode ? label(job.work_mode) : "";
    if (place && mode && place.toLowerCase().indexOf(job.work_mode) === -1) return place + " · " + mode;
    return place || mode;
  }

  const PERIODS = { year: "/yr", month: "/mo", day: "/day", hour: "/hr" };

  function salary(job) {
    if (job.salary_min == null && job.salary_max == null) return "";
    const format = function (n) {
      try {
        return new Intl.NumberFormat("en", job.salary_currency
          ? { style: "currency", currency: job.salary_currency, notation: "compact", maximumFractionDigits: 1 }
          : { notation: "compact", maximumFractionDigits: 1 }).format(n);
      } catch (e) {
        return String(n);
      }
    };
    const low = job.salary_min, high = job.salary_max;
    const range = low != null && high != null && low !== high ? format(low) + "–" + format(high) : format(low != null ? low : high);
    return range + (PERIODS[job.salary_period] || "");
  }

  function label(value) {
    if (value === "c_level") return "C-level";
    const words = String(value).replace(/[_-]+/g, " ");
    return words.charAt(0).toUpperCase() + words.slice(1);
  }

  function ago(timestamp) {
    const then = Date.parse(timestamp || "");
    if (isNaN(then)) return "";
    const days = Math.floor((Date.now() - then) / 86400000);
    if (days < 1) return "today";
    if (days < 30) return days + "d ago";
    if (days < 365) return Math.floor(days / 30) + "mo ago";
    return Math.floor(days / 365) + "y ago";
  }
})();
</script>
