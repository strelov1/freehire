<script>window._initialData={"autoOpenTwoPaneViewjobResponse": {"body": {"jobKey": "b2d02bb2a34565d6", "jobTitle": "Senior DevOps Engineer - Tempus", "jobLocation": "Pittsburgh, PA 15222", "jobCountry": "US", "salaryInfoModel": {"featureTokens": [], "matchingSalary": false, "minimumPayPreferencePresent": false, "salaryCurrency": "USD", "salaryLabel": {"scope": null, "usefulPercent": null}, "salaryMax": 172500, "salaryMin": 86250, "salarySource": "EXTRACTION", "salaryText": "$86,250 - $172,500 a year", "salaryTextFormatted": false, "salaryType": "YEARLY", "userMinimumPayAmount": null, "userMinimumPaySalaryType": null}, "jobInfoWrapperModel": {"jobInfoModel": {"sanitizedJobDescription": "\u003Cdiv>\n \u003Cb>Job Profile\u003C/b>\n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb>\u003Cbr>\n    Overview\u003C/b>\u003C/h1>\n \u003Cbr>\n  At PNC, our people are our greatest differentiator and competitive advantage in the markets we serve. We are all united in delivering the best experience for our customers. We work together each day to foster an inclusive workplace culture where all of our employees feel respected, valued and have an opportunity to contribute to the company’s success. As a DevOps Engineer within PNC's Tempus Technologies organization, you may be based in a remote location. This is a remote position. Work may be performed from a quiet, confidential space in a home location, approved by PNC. This position may not be available in all geographic locations. \n \u003Cbr>\n \u003Cbr>\n  Founded in 1987, Tempus Technologies is the expert leader of secure payments at the point of interaction. We're committed to developing exceptional point-of-sale payment integration technology and software solutions to meet the growing needs of our customers' business requirements. As a leader in the industry, we recognize our employees as one of our greatest assets. Tempus is growing and our team is growing with us, allowing for unlimited possibilities for career advancement and the potential for employees to develop their own individual career paths. \n \u003Cbr>\n \u003Cbr>\n  As a DevOps Engineer, you will lead efforts to enhance the efficiency and reliability of our cloud-based infrastructure. You will be responsible for designing, automating, and managing deployments while ensuring system security and scalability. You will collaborate with cross-functional teams to streamline operations and improve performance. Responsibilities may include: \n \u003Cbr>\n  Infrastructure Automation &amp; Management: \n \u003Cbr>\n \u003Cul>\n  \u003Cli>Design, build, implement, and maintain Azure cloud infrastructure using Infrastructure as Code (IaC) tools such as Terraform, Bicep, or ARM templates.\u003C/li>\n  \u003Cli>Automate provisioning, scaling, and configuration management of Azure resources.\u003C/li>\n  \u003Cli>Implement Infrastructure as Code (IaC) principles to ensure consistency and repeatability.\u003C/li>\n  \u003Cli>Monitor, troubleshoot, and optimize system performance to enhance reliability and cost efficiency.\u003C/li>\n \u003C/ul>\n \u003Cbr>\n  CI/CD &amp; Deployment Optimization: \n \u003Cbr>\n \u003Cul>\n  \u003Cli>Design, implement, and manage CI/CD pipelines using Azure DevOps and GitHub Enterprise to enable rapid and reliable application delivery.\u003C/li>\n  \u003Cli>Automate deployment workflows, infrastructure changes, and rollback strategies.\u003C/li>\n  \u003Cli>Collaborate with development teams to integrate DevOps best practices into the software delivery lifecycle.\u003C/li>\n \u003C/ul>\n \u003Cbr>\n  Monitoring, Logging &amp; Performance Optimization: \n \u003Cbr>\n \u003Cul>\n  \u003Cli>Implement and maintain monitoring, alerting, and logging solutions using Azure Monitor or ELK Stack.\u003C/li>\n  \u003Cli>Proactively identify and resolve system performance bottlenecks.\u003C/li>\n  \u003Cli>Develop alerting thresholds and incident response strategies based on system performance and business needs.\u003C/li>\n \u003C/ul>\n \u003Cbr>\n  Security and Compliance: \n \u003Cbr>\n \u003Cul>\n  \u003Cli>Implement and enforce security best practices for cloud infrastructure, CI/CD pipelines, and deployments.\u003C/li>\n  \u003Cli>Work closely with security teams to ensure compliance with industry regulations and best practices.\u003C/li>\n  \u003Cli>Automate security patching and vulnerability management for cloud-based environments.\u003C/li>\n \u003C/ul>\n \u003Cbr>\n  Key Relationships: \n \u003Cbr>\n \u003Cul>\n  \u003Cli>IT Managers\u003C/li>\n  \u003Cli>DevOps Teams\u003C/li>\n  \u003Cli>IT Incident Managers\u003C/li>\n \u003C/ul>\n \u003Cbr>\n  Due to the nature of the position, we are seeking experienced the following qualifications: \n \u003Cbr>\n \u003Cul>\n  \u003Cli>Proven experience as a Site Reliability Engineer or similar role.\u003C/li>\n  \u003Cli>Strong expertise in cloud platforms and container orchestration.\u003C/li>\n  \u003Cli>Proficiency in scripting languages (e.g., PowerShell, Bash).\u003C/li>\n  \u003Cli>Experience with infrastructure management tools such as Terraform and Kubernetes.\u003C/li>\n  \u003Cli>Experience with monitoring and logging tools.\u003C/li>\n  \u003Cli>Strong understanding of DevOps principles and practices.\u003C/li>\n  \u003Cli>Excellent problem-solving and communication skills.\u003C/li>\n  \u003Cli>Experience with Azure cloud platform.\u003C/li>\n  \u003Cli>Familiarity with CI/CD pipelines and tools such as GitHub actions.\u003C/li>\n  \u003Cli>Knowledge of monitoring and logging tools such as Elastic Stack.\u003C/li>\n  \u003Cli>Site Reliability Engineer certifications.\u003C/li>\n \u003C/ul>\n \u003Cbr>\n \u003Cp>\u003C/p> This position may be eligible for remote work in select geographic locations, subject to approval by PNC. If approved, work must be conducted from a quiet, secure, and confidential home-based workspace. Occasional in-office participation may be required based on business needs. \n \u003Cp>\u003C/p> PNC will not provide sponsorship for employment visas or participate in STEM OPT for this position. \n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb> Job Description\u003C/b>\u003C/h1>\n \u003Cp>As a(n) [position title] within PNC's [name of division] organization, you will be based in [city/state location of position].\u003C/p>\n \u003Cbr>\n \u003Cul>\n  \u003Cli>Applies solution design and support while consistently meeting customer needs. Leverages technical knowledge and industry experience to design, build and maintain infrastructure technology solutions.\u003C/li>\n  \u003Cli>Develops software components and hardware for projects; aligns these with business strategies and objectives.\u003C/li>\n  \u003Cli>Independently solves common problems and updates applications with new technology.\u003C/li>\n  \u003Cli>Collaborates with engineers, architects, developers and other staff to meet project objectives.\u003C/li>\n  \u003Cli>Analyzes the technological needs of customers and provides ongoing support for clients.\u003C/li>\n \u003C/ul>\n \u003Cp>\u003C/p> PNC Employees take pride in our reputation and to continue building upon that we expect our employees to be: • Customer Focused: Knowledgeable of the values and practices that align customer needs and satisfaction as primary considerations in all business decisions and able to leverage that information in creating customized customer solutions. • Managing Risk: Assessing and effectively managing all of the risks associated with their business objectives and activities to ensure they adhere to and support PNC's Enterprise Risk Management Framework. \n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb>\u003Cbr>\n    Qualifications\u003C/b>\u003C/h1>\n \u003Cp>\u003C/p>\n \u003Cp>Successful candidates must demonstrate appropriate knowledge, skills, and abilities for a role. Listed below are skills, competencies, work experience, education, and required certifications/licensures needed to be successful in this position.\u003C/p>\n \u003Cp>\u003C/p>\n \u003Ch2>\u003Cb> Job Specific Skills\u003C/b>\u003C/h2> Cloud Platform, Configuration Management (CM), DevOps, Infrastructure As Code (IaC), Linux, Operating Systems (OS), Solutions Design, System Designs, Troubleshooting, Virtualization \n \u003Cp>\u003C/p>\n \u003Ch2>\u003Cb> Competencies\u003C/b>\u003C/h2> Application Delivery Process, Consulting, Effectiveness Measurement, Industry Knowledge, IT Industry: Trends &amp; Directions, IT Standards, Procedures &amp; Policies, Planning: Tactical, Strategic, Problem Solving \n \u003Cp>\u003C/p>\n \u003Ch2>\u003Cb> Work Experience\u003C/b>\u003C/h2> Roles at this level typically require a university / college degree, with 3+ years of relevant / direct industry experience. Certifications are often desired. In lieu of a degree, a comparable combination of education, job specific certification(s), and experience (including military service) may be considered. \n \u003Cp>\u003C/p>\n \u003Ch2>\u003Cb> Education\u003C/b>\u003C/h2> Bachelors \n \u003Cp>\u003C/p>\n \u003Ch2>\u003Cb> Certifications\u003C/b>\u003C/h2> No Required Certification(s) \n \u003Cp>\u003C/p>\n \u003Ch2>\u003Cb> Licenses\u003C/b>\u003C/h2> No Required License(s) \n \u003Cp>\u003C/p>\n \u003Ch2>\u003Cb> Language Assessments\u003C/b>\u003C/h2>\n \u003Cbr>\n \u003Cp>\u003C/p> No Required or Preferred Language Assessments \n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb>\u003Cbr>\n    Pay Transparency\u003C/b>\u003C/h1>\n \u003Cp>\u003C/p> Base Salary: $86,250.00 – $172,500.00 \n \u003Cp>\u003C/p> Salaries may vary based on geographic location, market data and on individual skills, experience, and education. This role is incentive eligible with the payment based upon company, business and/or individual performance. \n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb> Application Window\u003C/b>\u003C/h1>\n \u003Cp>\u003C/p> Generally, this opening is expected to be posted for two business days from 11/24/2026, although it may be longer with business discretion. \n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb> Benefits\u003C/b>\u003C/h1>\n \u003Cp>\u003C/p> PNC offers a comprehensive range of benefits to help meet your needs now and in the future. Depending on your eligibility, options for full-time employees include: medical/prescription drug coverage (with a Health Savings Account feature), dental and vision options; employee and spouse/child life insurance; short and long-term disability protection; 401(k) with PNC match, pension and stock purchase plans; dependent care reimbursement account; back-up child/elder care; adoption, surrogacy, and doula reimbursement; educational assistance, including select programs fully paid; a robust wellness program with financial incentives. \n \u003Cp>\u003C/p> In addition, PNC generally provides the following paid time off, depending on your eligibility: maternity and/or parental leave; up to 11 paid holidays each year; 9 occasional absence days each year, unless otherwise required by law; between 15 to 25 vacation days each year, depending on career level; and years of service. \n \u003Cp>\u003C/p>\n \u003Cp>To learn more about these and other programs, including benefits for full time and part-time employees, visit pncthrive.com.\u003C/p>\n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb> Disability Accommodations Statement\u003C/b>\u003C/h1>\n \u003Cp>\u003C/p>\n \u003Cp>If an accommodation is required to participate in the application process, please contact us via email at AccommodationRequest@pnc.com. Please include “accommodation request” in the subject line title and be sure to include your name, the job ID, and your preferred method of contact in the body of the email. Emails not related to accommodation requests will not receive responses. Applicants may also call 877-968-7762 and say \"Workday\" for accommodation assistance. All information provided will be kept confidential and will be used only to the extent required to provide needed reasonable accommodations.\u003Cbr>\u003C/p>\n \u003Cp>\u003Cbr>\n   At PNC we foster an inclusive and accessible workplace. We provide reasonable accommodations to employment applicants and qualified individuals with a disability who need an accommodation to perform the essential functions of their positions.\u003C/p>\n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb> Equal Employment Opportunity (EEO)\u003C/b>\u003C/h1>\n \u003Cp>\u003Cbr>\n   PNC provides equal employment opportunity to qualified persons regardless of race, color, sex, religion, national origin, age, sexual orientation, gender identity, disability, veteran status, or other categories protected by law.\u003C/p>\n \u003Cp>\u003C/p>\n \u003Cp>This position is subject to the requirements of Section 19 of the Federal Deposit Insurance Act (FDIA) and, for any registered role, the Secure and Fair Enforcement for Mortgage Licensing Act of 2008 (SAFE Act) and/or the Financial Industry Regulatory Authority (FINRA), which prohibit the hiring of individuals with certain criminal history.\u003C/p>\n \u003Cp>\u003C/p>\n \u003Ch1>\u003Cb> California Residents \u003C/b>\u003C/h1>\n \u003Cp>\u003C/p>\n \u003Cp>Refer to the California Consumer Privacy Act Privacy Notice to gain understanding of how PNC may use or disclose your personal information in our hiring practices.\u003C/p>\n\u003C/div>", "jobInfoHeaderModel": {"companyName": "PNC Financial Services Group"}}}}}};</script>
