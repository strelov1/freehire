EPour l'un de nos clients basé à Genève, nous recherchons un(e) \u003Cstrong\u003EIngénieur(e) sécurité investigation avancée et réponse à incident\u003C\u002Fstrong\u003E pour renforcer ses capacités de cybersécurité opérationnelle.\u003C\u002Fp\u003E \u003Ch3\u003E \u003Cstrong\u003EContexte\u003C\u002Fstrong\u003E \u003C\u002Fh3\u003E \u003Cp\u003EL'équipe de surveillance et de coordination de la sécurité informatique souhaite disposer d'une compétence dédiée à la surveillance des événements de sécurité, à l'investigation des alertes et à la qualification des incidents de cybersécurité.\u003C\u002Fp\u003E \u003Cp\u003ECette fonction s'inscrit dans l'évolution du dispositif de sécurité opérationnelle. Elle vise notamment à renforcer l'exploitation des alertes produites par les solutions de sécurité, en particulier l'EDR, ainsi que la capacité de l'organisation à rechercher et analyser les traces d'une compromission et à y répondre dans le but de l'éradiquer.\u003C\u002Fp\u003E \u003Cp\u003EVous travaillez en interaction étroite avec le SOC externe, les équipes de sécurité opérationnelle et les équipes infrastructure, réseau, systèmes, applications et IAM.\u003C\u002Fp\u003E \u003Ch3\u003E \u003Cstrong\u003EVos missions\u003C\u002Fstrong\u003E \u003C\u002Fh3\u003E \u003Cul\u003E \u003Cli\u003E \u003Cp\u003EDétecter, analyser, investiguer et contribuer au traitement des événements et incidents de cybersécurité, en exploitant les alertes EDR et les autres sources de données de sécurité disponibles\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EAnalyser la couverture de détection, proposer, développer et ajuster des règles ou cas d'usage de détection à partir des incidents observés, des techniques d'attaque et du framework MITRE ATT&amp;CK\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EÉvaluer la qualité des télémétries et données de sécurité nécessaires à une investigation et identifier les lacunes de visibilité\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EConduire la réponse aux incidents : qualification, définition du périmètre, confinement, collecte des éléments techniques, accompagnement de l'éradication et du rétablissement, puis capitalisation des enseignements\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003ECoordonner les aspects techniques et les investigations avec le SOC externe et les équipes infrastructure, réseau, systèmes, applications et IAM\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003ETransformer une alerte technique en une compréhension de la situation de sécurité : ce qui s'est produit, sur quel système, avec quel compte ou quelle identité, par quel vecteur, quelles actions ont été réalisées, quels autres systèmes pourraient être concernés, s'il s'agit ou non d'un incident de sécurité et quelles mesures de confinement ou de remédiation sont nécessaires\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EProposer, créer et ajuster des règles de détection et réduire les taux de faux positifs et de faux négatifs\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003C\u002Ful\u003E \u003Cp\u003E \u003Cstrong\u003EFormation\u003C\u002Fstrong\u003E \u003C\u002Fp\u003E \u003Cul\u003E \u003Cli\u003E \u003Cp\u003EMaster universitaire en informatique, diplôme d'ingénieur EPF ou équivalent\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003C\u002Ful\u003E \u003Cp\u003E \u003Cstrong\u003ECompétences essentielles\u003C\u002Fstrong\u003E \u003C\u002Fp\u003E \u003Cul\u003E \u003Cli\u003E \u003Cp\u003EExpérience professionnelle confirmée en SOC, CSIRT ou équipe de réponse à incident, avec pratique effective d'investigations de sécurité complexes\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EExcellente connaissance des principes de fonctionnement d'un SOC\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EUtilisation opérationnelle approfondie d'un EDR\u002FXDR pour l'investigation (analyse des arbres de processus, investigation endpoint, etc.), la recherche, la collecte de traces et les actions de réponse\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EExpérience pratique d'un SIEM et maîtrise d'un langage de requête permettant de conduire des investigations sur de grands volumes de logs (SPL ou équivalent)\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EMaîtrise de l'analyse de logs\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EBonne connaissance des techniques et tactiques utilisées par les attaquants et capacité à les analyser au travers de MITRE ATT&amp;CK\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EMaîtrise de la recherche par IoC, IoA et TTP\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003ECapacité à conduire une investigation de sécurité\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EConnaissance des principales techniques d'attaque, des mécanismes de persistance et de mouvement latéral\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EExcellente compréhension des systèmes Windows et Linux\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EConnaissance de TCP\u002FIP, DNS, HTTP(S), proxy, firewall et VPN\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EConnaissance d'Active Directory\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003ECompréhension des mécanismes d'authentification (Kerberos, NTLM, OAuth2, OIDC, SAML)\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003ECapacité à investiguer les compromissions d'identités : comptes compromis, élévation de privilèges, vol d'identifiants, mouvements latéraux et abus des mécanismes d'authentification\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003C\u002Ful\u003E \u003Cp\u003E \u003Cstrong\u003ECompétences appréciées\u003C\u002Fstrong\u003E \u003C\u002Fp\u003E \u003Cul\u003E \u003Cli\u003E \u003Cp\u003EExpérience en Threat Hunting\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EConnaissance du cloud (Entra ID, M365, Azure)\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003C\u002Ful\u003E \u003Cp\u003E \u003Cstrong\u003EUn plus\u003C\u002Fstrong\u003E \u003C\u002Fp\u003E \u003Cul\u003E \u003Cli\u003E \u003Cp\u003EConnaissance des mécanismes SOAR\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EScripting PowerShell\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EScripting Python\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EConnaissance des outils de forensic\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003C\u002Ful\u003E \u003Cp\u003E \u003Cstrong\u003EQualités personnelles\u003C\u002Fstrong\u003E \u003C\u002Fp\u003E \u003Cul\u003E \u003Cli\u003E \u003Cp\u003EEsprit analytique et capacité à investiguer méthodiquement\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003ECuriosité et goût pour la recherche technique\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003ERigueur et qualité de documentation\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003ECapacité à communiquer et à travailler avec des équipes multidisciplinaires\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003Cli\u003E \u003Cp\u003EAutonomie et capacité à travailler sous pression lors d'incidents\u003C\u002Fp\u003E \u003C\u002Fli\u003E \u003C\u002Ful\u003E \u003C\u002Fdiv\u003E \u003C\u002Fdiv\u003E"},"title":"Ingénieur(e) sécurité investigation avancée et réponse à incident","trackingLinks":[{"type":"job_hit","url":"https:\u002F\u002Fimg.one.jobcloud.ch?c=h79x&a=1&jz=5h79x90cae85afa5c2600dbaf4f71598d05ecAIANMAQUAABQAAAAAAKA&jx=6ncgq9d95519f4de44d7f98634b1fbf45da75F4BUGBQAAAAQ"},{"type":"application_start","url":"https:\u002F\u002Fimg.one.jobcloud.ch?c=h79x&a=2&jz=5h79x90cae85afa5c2600dbaf4f71598d05ecAIANMAQUAABQAAAAAAKA&jx=6ncgq9d95519f4de44d7f98634b1fbf45da75F4BUG
