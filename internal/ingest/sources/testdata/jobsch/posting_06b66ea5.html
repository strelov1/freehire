Ihre Zeit zur Arbeit hinweisen. \nSie können also 30 bis 45 Minuten so kostenlos verschwenden. Am Ausgang können Sie nur auf Ihr Auto zugreifen, da Sie kein Abzeichen haben, um es in der Garage zu erreichen, so dass Sie auch 30 Minuten verlieren. Wie man arbeitet, ist nicht schlecht. Außer, dass jeder denkt, dass er der Chef ist! Sogar die Neusten kommen, um dir Befehle zu geben, während sie auch neu sind. Nach drei Tagen Zeitarbeit verlassen sie dich ohne Grund, so dass sie dich nicht mehr brauchen, auch wenn du gut arbeitest und du es ernst meinst, dass sie nichts mehr zu wachsen haben. \nAh, ich hatte die Arbeitspause vergessen. Wenn es Leute gibt, die die Pause machen, können Sie mit ihnen ausgehen, um Ihre Pause zu machen, und wenn sie zu spät zur Arbeit kommen, müssen Sie mit ihnen warten, um Ihre Pause herzlich machen zu können, und wenn sie sich entscheiden, zurückzukehren, bevor die Pause vorbei ist, müssen Sie Ihre Pause unterbrechen, sonst können Sie nicht darauf zugreifen, da Sie keinen Eintrittspass haben.\n Sehr schlechte Erfahrung wirklich.","originalLanguage":"de","positiveFeedback":"Für mich nicht nur die Konzentration auf die Arbeit.","rating":1,"relation":"former_employee","title":"Die Umwelt ist nicht schrecklich. ","translations":{"en":{"body":null,"id":"0c3052ff-27e7-4e7c-9f72-7686a6fd9631","negativeFeedback":"When you arrive at work in the morning, you lose half an hour of your time getting to work. You go to reception and hand in your ID card so that you can get a badge that will give you access to the garage to park your car, and then you hand the badge back to ask for another badge that will get you to work. Then you end up at the top because you don't have an access pass. So you wait until someone happens to come by to open the door for you. Then you can start your work time. So you can waste 30 to 45 minutes for free. At the exit, you can only access your car because you don't have a badge to get to the garage, so you lose another 30 minutes. How to work is not bad. Except that everyone thinks they're the boss! Even the newest employees come to give you orders, even though they're new too. After three days of temporary work, they leave you for no reason, so they don't need you anymore, even if you work well and you're serious about it, they have nothing more to grow. Ah, I forgot about the work break. If there are people who take the break, you can go out with them to take your break, and if they come back late to work, you have to wait with them to be able to take your break properly, and if they decide to come back before the break is over, you have to interrupt your break, otherwise you can't access it because you don't have an entry pass. Very bad experience indeed.","positiveFeedback":"For me, it's not just about focusing on work.","title":"The environment isn't terrible. "},"fr":{"body":null,"id":"ffd9fa95-af56-4bfb-9886-39eeec5b7d99","negativeFeedback":"Lorsque vous arrivez au travail le matin, vous perdez une demi-heure de votre temps pour vous rendre au travail. Vous vous rendez à la réception et remettez votre carte d'identité afin d'obtenir un badge qui vous permettra d'accéder au garage pour garer votre voiture, puis vous rendez le badge pour demander un autre badge qui vous permettra d'accéder à votre lieu de travail. Vous vous retrouvez alors bloqué, car vous n'avez pas de badge d'accès. Vous devez donc attendre qu'une personne passe par hasard pour vous ouvrir. Vous pouvez alors signaler votre arrivée au travail. Vous pouvez ainsi perdre 30 à 45 minutes gratuitement. À la sortie, vous ne pouvez accéder à votre voiture que parce que vous n'avez pas de badge pour atteindre le garage, ce qui vous fait perdre 30 minutes supplémentaires. La façon de travailler n'est pas mauvaise. Sauf que tout le monde se prend pour le patron ! Même les nouveaux arrivants viennent vous donner des ordres, alors qu'ils sont eux aussi nouveaux. Après trois jours de travail temporaire, ils vous licencient sans raison, prétextant qu'ils n'ont plus besoin de vous, même si vous travaillez bien et que vous êtes sérieux, et qu'ils n'ont plus rien à apprendre. Ah, j'avais oublié la pause. S'il y a des gens qui prennent la pause, vous pouvez sortir avec eux pour prendre votre pause, et s'ils arrivent en retard au travail, vous devez attendre avec eux pour pouvoir prendre votre pause, et s'ils décident de revenir avant la fin de la pause, vous devez interrompre votre pause, sinon vous ne pouvez pas y accéder car vous n'avez pas de badge d'entrée. Très mauvaise expérience vraiment.","positiveFeedback":"Pour moi, il ne s'agit pas seulement de se concentrer sur le travail.","title":"L'environnement n'est pas terrible. "},"de":{"body":null,"id":"bf3ca045-4380-44f8-9464-673b75775a00","negativeFeedback":"Wenn Sie morgens am Arbeitsplatz ankommen, verlieren Sie eine halbe Stunde Ihrer Zeit, um zur Arbeit zu kommen. Sie gehen zur Rezeption und geben Ihren Ausweis ab, damit Sie einen Ausweis erhalten können, damit sie Ihnen Zugang zur Garage geben können, um Ihr Auto zu parken, und dann geben Sie den Ausweis zurück, um nach einem anderen Abzeichen zu fragen, das Sie zur Arbeit bringen können. Dann kommen Sie an die Spitze, weil Sie keinen Zugangspass haben. Du bleibst also warten, bis eine Person zufällig vorbeikommt, um dich zu öffnen.\n Dann können Sie auf Ihre Zeit zur Arbeit hinweisen. \nSie können also 30 bis 45 Minuten so kostenlos verschwenden. Am Ausgang können Sie nur auf Ihr Auto zugreifen, da Sie kein Abzeichen haben, um es in der Garage zu erreichen, so dass Sie auch 30 Minuten verlieren. Wie man arbeitet, ist nicht schlecht. Außer, dass jeder denkt, dass er der Chef ist! Sogar die Neusten kommen, um dir Befehle zu geben, während sie auch neu sind. Nach drei Tagen Zeitarbeit verlassen sie dich ohne Grund, so dass sie dich nicht mehr brauchen, auch wenn du gut arbeitest und du es ernst meinst, dass sie nichts mehr zu wachsen haben. \nAh, ich hatte die Arbeitspause vergessen. Wenn es Leute gibt, die die Pause machen, können Sie mit ihnen ausgehen, um Ihre Pause zu machen, und wenn sie zu spät zur Arbeit kommen, müssen Sie mit ihnen warten, um Ihre Pause herzlich machen zu können, und wenn sie sich entscheiden, zurückzukehren, bevor die Pause vorbei ist, müssen Sie Ihre Pause unterbrechen, sonst können Sie nicht darauf zugreifen, da Sie keinen Eintrittspass haben.\n Sehr schlechte Erfahrung wirklich.","positiveFeedback":"Für mich nicht nur die Konzentration auf die Arbeit.","title":"Die Umwelt ist nicht schrecklich. "}},"reviewDetails":{"applicant":{"jobDescription":null,"applicationProcess":null,"personalizedAnswer":null,"responseTime":null},"employee":{"salary":1,"management":1,"atmosphere":1,"conditions":1}}},{"body":null,"comments":[],"contractType":"permanent","createdAt":"2019-01-24T15:08:54+01:00","id":"1e662478-f89c-49db-a7db-a826eb902336","negativeFeedback":"Es hat alles reibungslos geklappt, ich sehe daher keinen Punkt, der verbessert werden müsste.","originalLanguage":"de","positiveFeedback":"Die gewünschte Festanstellung hat auf Anhieb geklappt. Vielen Dank an die Mitarbeiter der Asspro für ihren Einsatz!","rating":5,"relation":"former_employee","title":"Die Festanstellung hat superschnell geklappt","translations":{"en":{"body":null,"id":"b789a6a0-a2ed-4f54-87c4-7b012ab12b75","negativeFeedback":"Everything went smoothly, so I don't see any point that needs to be improved.","positiveFeedback":"The desired fixed position has worked right away. Many thanks to the employees of Asspro for their commitment!","title":"The permanent position worked super fast."},"fr":{"body":null,"id":"0384537f-64df-4ff2-90fd-4bbf1d34f3e4","negativeFeedback":"Tout s'est bien passé, donc je ne vois aucun point à améliorer.","positiveFeedback":"La position fixe souhaitée a fonctionné tout de suite. Un grand merci aux collaborateurs d'Asspro pour leur engagement !","title":"Le poste permanent a travaillé très vite."},"de":{"body":null,"id":"0c55ae3d-b485-
