er Teams.\n \nDich erwartet ein Arbeitsumfeld, das unterstützt und fordert\nWir pflegen eine respektvolle, soziale und leistungsfördernde Kultur. Wertschätzung ist für uns selbstverständlich, genauso wie Vertrauen und Eigenverantwortung.\nDie Vereinbarkeit von Beruf und Privatleben ist uns wichtig. Deshalb bieten wir geregelte und familienfreundliche Arbeitszeiten, wo immer es möglich ist.\n \nDer Herzschlag von SV - unsere Werte\nHerzlichkeit, Hands-on-Mentalität, Vorwärtsdenken und Verantwortungsbewusstsein prägen unser tägliches Handeln. Unsere Werte sind mehr als Worte. Sie sind Ausdruck unserer Identität und fest in unserer Unternehmenskultur verankert.\n \nRaum für Entwicklung. Raum für dich.\nMenschen, die täglich ihr Bestes geben und gemeinsam wachsen möchten, finden bei uns echte Entwicklungsperspektiven und vielfältige Karrierewege.\nSV wurde mehrfach mit dem Friendly Work Space Label ausgezeichnet. Dieses Gütesiegel steht für eine systematische und nachhaltige Förderung von Gesundheit, Wertschätzung und einer starken Arbeitskultur.\n \nDu mit uns. Ein Erfolgsrezept.\nWir freuen uns darauf, dich kennenzulernen. ","benefits":[],"logoImage":{"src":"https:\u002F\u002Fmedia.jobs.ch\u002Fmedia\u002Fc680e562-2395-40b9-b6b2-11fb02bb92b4"},"backgroundImage":{"src":"https:\u002F\u002Fmedia.jobs.ch\u002Fmedia\u002Fa0b7d6e1-2143-4304-9540-1468e6fd0045"},"portrait":{"employees":{"count":200000,"minValue":1001,"range":"\u003E 1 000"}},"contactAddress":{"city":"Dübendorf","zipCode":"8600","street":"Wallisellenstrasse 57, Memphispark"},"locationCoords":{"lat":47.3936050950065,"lon":8.62020441161597},"locationCoordsExact":false},"dataUpdateCount":1,"dataUpdatedAt":1793187125166,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["public\u002Fcompany","7e83e969-6022-416b-8e76-a24208f3d063"],"queryHash":"[\"public\u002Fcompany\",\"7e83 3],"employmentTypeIds":["5"],"externalUrl":undefined,"headhunterApplicationAllowed":false,"id":"5a0ccca1-4c1f-4b9f-a13b-6f69f922528e","initialPublicationDate":undefined,"isActive":true,"isBoosted":undefined,"isNew":false,"isPaid":true,"languageSkills":[],"layoutType":undefined,"listingTags":[],"locations":[],"logo":undefined,"mood":undefined,"offerId":undefined,"place":"Rümlang","publicationDate":"2026-10-18T14:33:25+00:00","publicationEndDate":undefined,"regions":[],"salary":undefined,"skills":undefined,"street":undefined,"synonym":undefined,"template":undefined,"title":"Informatiker im Aussendienst 80 - 100% (m\u002Fw\u002Fd)","trackingLinks":undefined,"videos":[],"zipcode":undefined}],"meta":{"numPages":0,"searchHash":undefined,"totalHits":3,"showingResultsFor":undefined,"originalSearchQuery":undefined,"splitByInitial":undefined,"aggregations":{"place":[],"synonymCollection":[]},"baseOptions":{},"facets":{}},"numPages":0,"currentPage":0},"dataUpdateCount":1,"dataUpdatedAt":1793187125176,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["recommendation-collection\u002Fjob\u002F","b7ca4d07-9996-49da-aa3f-4beabe3db24e",3],"queryHash":"[\"recommendation-collection\u002Fjob\u002F\",\"b7ca4d07-9996-49da-aa3f-4beabe3db24e\",3]"},{"state":{"data":[{"body":null,"comments":[],"contractType":"permanent","createdAt":"2025-01-17T13:55:42+01:00","id":"d888e55c-908a-42e9-b8b8-ec18519a5626","negativeFeedback":"Auswahlverfahren der Bewerber.\nMehr auf Fachkenntnisse als auf oberflächliche Dinge achten.","originalLanguage":"de","positiveFeedback":"Ich führte das Gespräch mit zwei Mitarbeiterinnen des \"Head of Sales\". Es wurde erwähnt, dass das Gespräch in einer lockeren Atmosphäre stattfinden würde – das war es auch: nett und humorvoll. Im Vorstellungsgespräch wurde mir bestätigt, dass meine Fachkompetenz zu 100 % passt und alle Anforderungen der SV Group für diese Stelle erfüllt. Auch auf meine Nachfrage, ob noch etwas fehle, worauf ich mich vorbereiten könnte, wurde mir versichert, dass mein Wissen und meine Fachkompetenz genau das abdecken, was sie benötigen.\n\nIch habe bewusst Fragen gestellt, da ich den Eindruck hatte, dass kein grosses Interesse an weiteren Informationen zu meinem Werdegang bestand. Das wäre legitim, wenn meine Qualifikationen wirklich alles erfüllen.\n\nDass es kaum Fragen zu meiner Person gab, störte mich zunächst nicht, da ich davon ausging, dass man sich auf Fachkompetenz und die herausragenden Arbeitszeugnisse meiner letzten beiden Arbeitgeber stützte. Am Ende wurde der weitere Prozess erklärt: Im zweiten Schritt sollte ein Fragebogen zu meiner Persönlichkeit folgen, der keinen Einfluss auf die Auswahl habe, sowie ein kleiner Test zu einer praktischen Aufgabe.\n\nZwei Tage später erhielt ich wie vereinbart eine Rückmeldung per Telefon:\n„Du hast es fachlich voll drauf, aber es gab noch 2–3 andere Mitbewerber, die besser ins Team, besser zu den anderen Abteilungen und besser zur SV Group passen.“\n\nMir fehlte nur noch der Zusatz: „... die noch besser zu Dübendorf, noch besser zu Zürich und vielleicht noch besser zur Nachbarschaft passen!“ Wenn doch die anderen Abteilungen und die SV Group eine grosse Rolle spielen, warum war kein geschultes HR-Personal beim Gespräch dabei?\n\nNachdem ich per E-Mail höflich Kritik geäussert hatte, wurde betont, dass sie „ehrlich und mit Klarheit“ kommunizieren wollen. Leider war diese Absage weder ehrlich noch klar. Sie wirkte erniedrigend und oberflächlich. Ich unterstelle den Mitarbeiterinnen keine böse Absicht, halte die Auswahl jedoch für fragwürdig.","rating":2,"relation":"applicant","title":"Diskriminierender Beigeschmack.","translations":{"en":{"body":null,"id":"8d1f1ece-b5ff-4753-893e-9ea0364351c7","negativeFeedback":"Applicant selection process.\nPay more attention to specialist knowledge than to superficial things.","positiveFeedback":"I had a conversation with two employees from the Head of Sales. It was mentioned that the interview would take place in a relaxed atmosphere - and it was: nice and humorous. During the interview, they confirmed that my professional skills were a 100% match and that I met all of the SV Group's requirements for this position. When I asked if there was anything else I needed to prepare for, I was assured that my knowledge and expertise covered exactly what they needed.\n\nI deliberately asked questions as I had the impression that there was not much interest in further information about my background. That would be legitimate if my qualifications really covered everything.\n\nThe fact that there were hardly any questions about me didn't bother me at first, as I assumed that they were relying on professional expertise and the outstanding references from my last two employers. At the end, the further process was explained: the second step would be a questionnaire about my personality, which would have no influence on the selection, and a short test on a practical task.\n\nTwo days later, I received feedback by phone as agreed:\n\"You've got it all professionally, but there were 2-3 other competitors who fit better into the team, better with the other departments and better with the SV Group.\"\n\nThe only thing missing was the addition: \"... who would fit in even better with Dübendorf, even better with Zurich and perhaps even better with the neighborhood!\" If the other departments and the SV Group play a major role, why weren't there any trained HR staff present at the interview?\n\nAfter I had politely expressed criticism by e-mail, it was emphasized that they wanted to communicate \"honestly and with clarity\". Unfortunately, this rejection was neither honest nor clear. It came across as demeaning and superficial. I am not implying any malicious intent on the part of the employees, but I do consider the selection to be questionable.","title":"Discriminatory aftertaste."},"fr":{"body":null,"id":"8bb624d3-bc26-4372-984c-c54d8e42402a","negativeFeedback":"Procédure de sélection des candidats.\nSe concentrer davantage sur les compétences professionnelles que sur des éléments superficiels.","positiveFeedback":"J'ai eu l'entretien avec deux collaboratrices du \"Head of Sales\". Il était mentionné que l'entretien se déroulerait dans une atmosphère décontractée - c'est ce qui s'est passé : agréable et plein d'humour. Lors de l'entretien, on m'a confirmé que mes compétences professionnelles correspondaient à 100 % et qu'elles répondaient à toutes les exigences de SV Group pour ce poste. Même lorsque j'ai demandé s'il me manquait quelque chose pour me préparer, on m'a assuré que mes connaissances et mes compétences professionnelles couvraient exactement ce dont ils avaient besoin.\n\nJ'ai délibérément posé des questions, car j'avais l'impression qu'il n'y avait pas grand intérêt à obtenir davantage d'informations sur mon parcours. Ce serait légitime si mes qualifications répondaient vraiment à tous les critères.\n\nLe fait qu'il n'y ait pratiquement pas eu de questions sur ma personne ne m'a pas dérangé au début, car je partais du principe que l'on s'appuyait sur les compétences professionnelles et les excellents certificats de travail de mes deux derniers employeurs. A la fin, on m'a expliqué la suite du processus : la deuxième étape consisterait en un questionnaire sur ma personnalité, qui n'aurait aucune influence sur la sélection, et un petit test sur une tâche pratique.\n\nDeux jours plus tard, j'ai reçu une réponse par téléphone, comme convenu :\n\"Tu as tout ce qu'il faut sur le plan professionnel, mais il y avait 2-3 autres concurrents qui s'intègrent mieux dans l'équipe, mieux dans les autres départements et mieux dans SV Group\".\n\nIl ne me manquait plus que l'ajout : \"... qui conviennent encore mieux à Dübendorf, encore mieux à Zurich et peut-être encore mieux au voisinage !\" Si les autres départements et SV Group jouent un rôle important, pourquoi n'y avait-il pas de personnel RH formé lors de l'entretien ?\n\nAprès que j'ai poliment émis des critiques par e-mail, ils ont souligné qu'ils voulaient communiquer \"honnêtement et avec clarté\". Malheureusement, ce refus n'était ni honnête ni clair. Elle semblait humiliante et superficielle. Je ne soupçonne pas les collaboratrices d'être mal intentionnées, mais j'estime que leur choix est discutable.","title":"Un arrière-goût de discrimination."},"de":{"body":null,"id":"abb47712-649e-4f10-919f-e2ffe9be107c","negativeFeedback":"Auswahlverfahren der Bewerber.\nMehr auf Fachkenntnisse als auf oberflächliche Dinge achten.","positiveFeedback":"Ich führte das Gespräch mit zwei Mitarbeiterinnen des \"Head of Sales\". Es wurde erwähnt, dass das Gespräch in einer lockeren Atmosphäre stattfinden würde – das war es auch: nett und humorvoll. Im Vorstellungsgespräch wurde mir bestätigt, dass meine Fachkompetenz zu 100 % passt und alle Anforderungen der SV Group für diese Stelle erfüllt. Auch auf meine Nachfrage, ob noch etwas fehle, worauf ich mich vorbereiten könnte, wurde mir versichert, dass mein Wissen und meine Fachkompetenz genau das abdecken, was sie benötigen.\n\nIch habe bewusst Fragen gestellt, da ich den Eindruck hatte, dass kein grosses Interesse an weiteren Informationen zu meinem Werdegang bestand. Das wäre legitim, wenn meine Qualifikationen wirklich alles erfüllen.\n\nDass es kaum Fragen zu meiner Person gab, störte mich zunächst nicht, da ich davon ausging, dass man sich auf Fachkompetenz und die herausragenden Arbeitszeugnisse meiner letzten beiden Arbeitgeber stützte. Am Ende wurde der weitere Prozess erklärt: Im zweiten Schritt sollte ein Fragebogen zu meiner Persönlichkeit folgen, der keinen Einfluss auf die Auswahl habe, sowie ein kleiner Test zu einer praktischen Aufgabe.\n\nZwei Tage später erhielt ich wie vereinbart eine Rückmeldung per Telefon:\n„Du hast es fachlich voll drauf, aber es gab noch 2–3 andere Mitbewerber, die besser ins Team, besser zu den anderen Abteilungen und besser zur SV Group passen.“\n\nMir fehlte nur noch der Zusatz: „... die noch besser zu Dübendorf, noch besser zu Zürich und vielleicht noch besser zur Nachbarschaft passen!“ Wenn doch die anderen Abteilungen und die SV Group eine grosse Rolle spielen, warum war kein geschultes HR-Personal beim Gespräch dabei?\n\nNachdem ich per E-Mail höflich Kritik geäussert hatte, wurde betont, dass sie „ehrlich und mit Klarheit“ kommunizieren wollen. Leider war diese Absage weder ehrlich noch klar. Sie wirkte erniedrigend und oberflächlich. Ich unterstelle den Mitarbeiterinnen keine böse Absicht, halte die Auswahl jedoch für fragwürdig.","title":"Diskriminierender Beigeschmack."}},"reviewDetails":{"applicant":{"jobDescription":4,"applicationProcess":null,"personalizedAnswer":null,"responseTime":null},"employee":{"salary":null,"management":null,"atmosphere":null,"conditions":null}}},{"body":null,"comments":[],"contractType":"permanent","createdAt":"2022-06-10T10:35:31+02:00","id":"9ce02b81-cc9b-4d84-b3ed-904987b4eb28","negativeFeedback":"Die Zusammenarbeit mit den einzelnen CH Kantone könnte noch besser sein.","originalLanguage":"de","positiveFeedback":"Das Arbeitsklima bei SV ist super. Tolle Arbeitskollegen kennengelernt. Jeder ist sehr freundlich, herzlich und authentisch.","rating":4,"relation":"current_employee","title":"HERZLICHE Gastronomie- und Hotelmanagement-Gruppe","translations":{"en":{"body":null,"id":"88c8aace-34c4-4dd2-91bb-750d3a276bed","negativeFeedback":"The cooperation with the individual CH cantons could be even better.","positiveFeedback":"The working atmosphere at SV is great. I've met some great colleagues. Everyone is very friendly, warm and authentic.","title":"HEARTY Gastronomy and Hotel Management Group"},"fr":{"body":null,"id":"b3b700f8-ecbd-42eb-9d99-1dc08c18f342","negativeFeedback":"La collaboration avec les différents cantons suisses pourrait être encore meilleure.","positiveFeedback":"L'ambiance de travail chez SV est super. J'ai rencontré des collègues de travail formidables. Tout le monde est très amical, chaleureux et authentique.","title":"Groupe de gestion gastronomique et hôtelière HERZLICHE"},"de":{"body":null,"id":"157d3503-d5c1-4a54-81d5-4a51caf08666","negativeFeedback":"Die Zusammenarbeit mit den einzelnen CH Kantone könnte noch besser sein.","positiveFeedback":"Das Arbeitsklima bei SV ist super. Tolle Arbeitskollegen kennengelernt. Jeder ist sehr freundlich, herzlich und authentisch.","title":"HERZLICHE Gastronomie- und Hotelmanagement-Gruppe"}},"reviewDetails":{"applicant":{"jobDescription":null,"applicationProcess":null,"personalizedAnswer":null,"responseTime":null},"employee":{"salary":3,"management":4,"atmosphere":5,"conditions":4}}},{"body":null,"comments":[],"contractType":"permanent","createdAt":"2021-06-09T14:22:31+02:00","id":"14242d73-8940-4ce7-b69c-d45755750102","negativeFeedback":"Der Betrieb gibt sich als Familienfreundlich aus aber dem ist nicht so !\nIn anderen Betrieben gibt es Familienzulagen nebst dem Kindergeld und wenn das Kind mehr wie einmal Krank ist im Jahr was bei Kindern evt auch 2-3 mal sein kann hat man ein Gespräch mit dem HR. \nDie Kündigungen zur Covid Zeit wurden nicht mit einem Sozialprogram oder Massenentlassung (mit den Ämtern) getätigt sondern die erste Kündigungswelle wurden die aussortiert wo die letzten 5 Jahre irgendwelche Einträge gehabt haben es würde dann genau drauf geschaut ob irgendwas davon noch zu verwenden ist und das wurde dann zum Kündigen verwendet.\nNur die Zahlen sind relevant da die Aktionäre ja Ihr Geld sehen wollen also sehe ich nicht wirklich einen non Profit Betrieb.\nBei den Qualifikationsgesprächen wird seit paar Jahren immer geschaut das die Mitarbeiter nicht so gut bewertet werden das war auch eine Anweisung von oben aber uns wurde nie gesagt wieso ?!","originalLanguage":"de","positiveFeedback":"Ich hatte sehr viele Freiheiten im Betrieb da meine Zahlen immer gut waren also hauptsächlich die Produktivität und die Warenkosten. Ich konnte meine Arbeitszeit selber machen solang alles funktioniert.","rating":1,"relation":"former_employee","title":"Familienfreundlicher Betrieb","translations":{"en":{"body":null,"id":"28a40db2-b513-4ee1-ba8f-3a6b1747773d","negativeFeedback":"The company claims to be family friendly but that is not the case!\nIn other companies there are family allowances in addition to the child benefit and if the child is sick more than once a year, which may be 2-3 times with children, you have a conversation with the HR.\nThe dismissals at the Covid time were not made with a social program or mass dismissal (with the offices) but the first wave of dismissals were sorted out those who have had any entries in the last 5 years it would then be looked closely at whether any of it is still to be used and that was then used to dismiss.\nOnly the numbers are relevant as the shareholders want to see their money so I don't really see a non profit business.\nIn the qualification interviews for a few years is always looked that the employees are not so well evaluated that was also an instruction from above but we were never told why?","positiveFeedback":"I had a lot of freedom in the company because my numbers were always good, so mainly the productivity and the cost of goods. I could make my own working hours as long as everything worked.","title":"Family friendly company"},"fr":{"body":null,"id":"0047ce2d-bddd-4fcc-bce7-f800ff4eaee9","negativeFeedback":"L'entreprise prétend être favorable aux familles, mais ce n'est pas le cas !\nDans d'autres entreprises, il existe des allocations familiales en plus des allocations familiales et si l'enfant est malade plus d'une fois par an, ce qui peut être 2 ou 3 fois avec des enfants, vous avez une conversation avec le RH.\nLes licenciements à l'époque du Covid n'ont pas été effectués dans le cadre d'un programme social ou d'un licenciement de masse (avec les bureaux), mais la première vague de licenciements a consisté à trier ceux qui avaient eu des entrées au cours des cinq dernières années, puis à examiner de près s'ils étaient encore utilisables et à les licencier.\nSeuls les chiffres sont pertinents car les actionnaires veulent voir leur argent, donc je ne vois pas vraiment une entreprise à but non lucratif.\nDans les entretiens de qualification depuis quelques années, il semble toujours que les employés ne soient pas si bien évalués. C'était aussi une instruction d'en haut mais on ne nous a jamais dit pourquoi ?","positiveFeedback":"J'avais beaucoup de liberté dans l'entreprise car mes chiffres étaient toujours bons, donc principalement la productivité et le coût des marchandises. Je pouvais faire mes propres horaires de travail tant que tout fonctionnait.","title":"Entreprise familiale"},"de":{"body":null,"id":"e23217de-5e7a-4249-939e-7e049ec42147","negativeFeedback":"Der Betrieb gibt sich als Familienfreundlich aus aber dem ist nicht so !\nIn anderen Betrieben gibt es Familienzulagen nebst dem Kindergeld und wenn das Kind mehr wie einmal Krank ist im Jahr was bei Kindern evt auch 2-3 mal sein kann hat man ein Gespräch mit dem HR. \nDie Kündigungen zur Covid Zeit wurden nicht mit einem Sozialprogram oder Massenentlassung (mit den Ämtern) getätigt sondern die erste Kündigungswelle wurden die aussortiert wo die letzten 5 Jahre irgendwelche Einträge gehabt haben es würde dann genau drauf geschaut ob irgendwas davon noch zu verwenden ist und das wurde dann zum Kündigen verwendet.\nNur die Zahlen sind relevant da die Aktionäre ja Ihr Geld sehen wollen also sehe ich nicht wirklich einen non Profit Betrieb.\nBei den Qualifikationsgesprächen wird seit paar Jahren immer geschaut das die Mitarbeiter nicht so gut bewertet werden das war auch eine Anweisung von oben aber uns wurde nie gesagt wieso ?!","positiveFeedback":"Ich hatte sehr viele Freiheiten im Betrieb da meine Zahlen immer gut waren also hauptsächlich die Produktivität und die Warenkosten. Ich konnte meine Arbeitszeit selber machen solang alles funktioniert.","title":"Familienfreundlicher Betrieb"}},"reviewDetails":{"applicant":{"jobDescription":null,"applicationProcess":null,"personalizedAnswer":null,"responseTime":null},"employee":{"salary":1,"management":1,"atmosphere":1,"conditions":2}}},{"body":null,"comments":[],"contractType":"permanent","createdAt":"2020-12-12T08:15:48+01:00","id":"e982ec89-36e8-4991-b725-1ab784fa31c2","negativeFeedback":"Ich habe bei der Einführung in die neue Arbeitsstelle sehr schlechte Erfahrungen gemacht. Dort besteht sicher noch viel Verbesserungspotenzial. Meine Vorgesetzten machten sich sehr rar, schlecht erreichbar. Man fühlte sich allein gelassen.","originalLanguage":"de","positiveFeedback":"Das Qualitätsmanagment System ist sicher hervorragend, in Betrieben mit mindestens ca. 3 festangestellten Mitarbeitern. In Betrieben mit nur einer Vollzeitstelle und Aushilfen, wird das QMS zur grossen Belastung. Listen, Formulare, Dokumentation.....\nWenn die ganze QMS Verantwortung bei nur einer Person liegt, ist es schwierig, Kochen, Servieren, Abwasch, Reinigung, Administratorisches und die unzähligen Listen unter einen Hut zu kriegen.","rating":4,"relation":"current_employee","title":"Mangelhafte Führung","translations":{"en":{"body":null,"id":"62cdddcf-d3c2-4cc6-bcdc-22d63a05b0ba","negativeFeedback":"I had very bad experiences during the introduction to the new job. I am sure there is still a lot of room for improvement. My superiors made themselves very rare, difficult to reach. One felt left alone.","positiveFeedback":"The quality management system is certainly excellent in companies with at least 3 permanent employees. In companies with only one full-time employee and temporary workers, the QMS becomes a big burden. Lists, forms, documentation.....\nIf the whole QMS responsibility is with only one person, it is difficult to manage cooking, serving, washing up, cleaning, administrative tasks and the countless lists.","title":"Unsatisfactory guidance"},"fr":{"body":null,"id":"22690e5e-49fb-4cf6-b363-d202ac3c1f29","negativeFeedback":"J'ai eu de très mauvaises expériences lors de l'introduction à mon nouveau travail. Je suis sûr qu'il y a encore beaucoup de choses à améliorer. Mes supérieurs se sont faits très rares, difficiles à atteindre. On se sentait seul.","positiveFeedback":"Le système de gestion de la qualité est certainement excellent dans les entreprises comptant au moins 3 employés permanents. Dans les entreprises qui ne comptent qu'un seul employé à temps plein et des travailleurs temporaires, le SGQ devient une lourde charge. Listes, formulaires, documentation.....\nSi toute la responsabilité du SGQ est confiée à une seule personne, il est difficile de gérer la cuisine, le service, la vaisselle, le nettoyage, les tâches administratives et les innombrables listes.","title":"Orientation insatisfaisante"},"de":{"body":null,"id":"0c07aacd-43f9-48d2-8b65-032c88d080a8","negativeFeedback":"Ich habe bei der Einführung in die neue Arbeitsstelle sehr schlechte Erfahrungen gemacht. Dort besteht sicher noch viel Verbesserungspotenzial. Meine Vorgesetzten machten sich sehr rar, schlecht erreichbar. Man fühlte sich allein gelassen.","positiveFeedback":"Das Qualitätsmanagment System ist sicher hervorragend, in Betrieben mit mindestens ca. 3 festangestellten Mitarbeitern. In Betrieben mit nur einer Vollzeitstelle und Aushilfen, wird das QMS zur grossen Belastung. Listen, Formulare, Dokumentation.....\nWenn die ganze QMS Verantwortung bei nur einer Person liegt, ist es schwierig, Kochen, Servieren, Abwasch, Reinigung, Administratorisches und die unzähligen Listen unter einen Hut zu kriegen.","title":"Mangelhafte Führung"}},"reviewDetails":{"applicant":{"jobDescription":null,"applicationProcess":null,"personalizedAnswer":null,"responseTime":null},"employee":{"salary":2,"management":1,"atmosphere":3,"conditions":2}}},{"body":null,"comments":[],"contractType":"permanent","createdAt":"2019-03-01T09:22:59+01:00","id":"821698de-0cb2-4739-9b99-8e09cb6f9372","negativeFeedback":"manchmal muss auch die hohe Führung kontrolliert werden.\nansonsten finde ich alles gut. Mitarbeiterin wirklich wollen und Initiative zeigen, werden sehr gefördert.","originalLanguage":"de","positiveFeedback":"es macht sehr viel Spass. der teamzusammenhalt stimmt. die Mitarbeiterförderumg ist Top und auch über die Führung kann ich nicht meckern.\nich arbeite sehr gerne für die SV.\nman darf nie vergessen, schwarze Schafe gibt es leider überall","rating":5,"relation":"current_employee","title":"nur weiter zu empfehlen!","translations":{"en":{"body":null,"id":"894b19d1-15b5-49d7-a8f1-95eb575f43ac","negativeFeedback":"sometimes the high leadership must also be controlled.\notherwise I think everything's fine. Employees who really want to and show initiative are very much encouraged.","positiveFeedback":"it's a lot of fun. the team spirit is right. the employee development program is top and I can't complain about the management either.\nI like working for the SV very much.\nyou must never forget, black sheep are unfortunately everywhere","title":"only to recommend!"},"fr":{"body":null,"id":"0108686a-0543-401e-ba8c-51db7375489d","negativeFeedback":"Parfois, la haute direction doit aussi être contrôlée.\nsinon je pense que tout va bien. Les employés qui veulent vraiment faire preuve d'initiative sont très encouragés.","positiveFeedback":"C'est très amusant. L'esprit d'équipe a raison. Le programme de perfectionnement des employés est le meilleur et je ne peux pas non plus me plaindre de la direction.\nJ'aime beaucoup travailler pour le SV.\nil ne faut jamais oublier que les moutons noirs sont malheureusement partout.","title":"seulement à recommander !"},"de":{"body":null,"id":"23ef58a4-7b41-4fad-a834-9d39f95e8d46","negativeFeedback":"manchmal muss auch die hohe Führung kontrolliert werden.\nansonsten finde ich alles gut. Mitarbeiterin wirklich wollen und Initiative zeigen, werden sehr gefördert.","positiveFeedback":"es macht sehr viel Spass. der teamzusammenhalt stimmt. die Mitarbeiterförderumg ist Top und auch über die Führung kann ich nicht meckern.\nich arbeite sehr gerne für die SV.\nman darf nie vergessen, schwarze Schafe gibt es leider überall","title":"nur weiter zu empfehlen!"}},"reviewDetails":{"applicant":{"jobDescription":null,"applicationProcess":null,"personalizedAnswer":null,"responseTime":null},"employee":{"salary":4,"management":5,"atmosphere":4,"conditions":4}}},{"body":"Das Arbeitsklima ist nicht immer gut, der Lohn ist sehr niedrig dafür gute Arbeitszeiten","comments":[],"contractType":null,"createdAt":"2018-10-19T13:51:46+02:00","id":"f37f8dd3-d9ef-4f5a-93b7-c3c5eabb3e4e","negativeFeedback":null,"originalLanguage":"de","positiveFeedback":null,"rating":2,"relation":"current_employee","title":"Spezielles Arbeitsklima, niedriger Lohn, gute Arbeitszeit","translations":{"en":{"body":"The working climate is not always good, the wages are very low but good working hours","id":"9d37f14f-d9d9-4a25-9cd0-6df2169445ff","negativeFeedback":null,"positiveFeedback":null,"title":"Special working climate, low wages, good working hours"},"fr":{"body":"Le climat de travail n'est pas toujours bon, les salaires sont très bas mais les heures de travail sont bonnes.","id":"be463bd3-12e1-4dba-8972-1461a7bbe7f3","negativeFeedback":null,"positiveFeedback":null,"title":"Climat de travail particulier, bas salaires, bonnes heures de travail"},"de":{"body":"Das Arbeitsklima ist nicht immer gut, der Lohn ist sehr niedrig dafür gute Arbeitszeiten","id":"e511f60a-5c2f-4937-911d-7c56f1c8eca7","negativeFeedback":null,"positiveFeedback":null,"title":"Spezielles Arbeitsklima, niedriger Lohn, gute Arbeitszeit"}}},{"body":"Leider ist bei dem Arbeitgeber das einzige was zählt die Zahlen. Die Mitarbeiter werden nicht korrekt behandelt. Wenn man das nicht akzeptiert, muss man gehen. Traurig aber wahr..","comments":[],"contractType":null,"createdAt":"2018-09-25T13:12:11+02:00","id":"90f8d41f-a8ae-4e26-bf7d-61dc70af3beb","negativeFeedback":null,"originalLanguage":"de","positiveFeedback":null,"rating":1,"relation":"former_employee","title":"Zahlen zählen","translations":{"en":{"body":"Unfortunately for the employer, the only thing that matters is the numbers. The employees are not treated correctly. If you don't accept that, you have to go. Sad but true.","id":"d1e87800-9e68-4fc4-8d73-40d911f0e9bd","negativeFeedback":null,"positiveFeedback":null,"title":"count numbers"},"fr":{"body":"Malheureusement pour l'employeur, la seule chose qui compte, ce sont les chiffres. Les employés ne sont pas traités correctement. Si tu n'acceptes pas ça, tu dois partir. Triste mais vrai.","id":"74fee331-6942-4cda-8548-2d6929f56da1","negativeFeedback":null,"positiveFeedback":null,"title":"compter les numéros"},"de":{"body":"Leider ist bei dem Arbeitgeber das einzige was zählt die Zahlen. Die Mitarbeiter werden nicht korrekt behandelt. Wenn man das nicht akzeptiert, muss man gehen. Traurig aber wahr..","id":"547637a4-93f1-4eeb-95c2-c83b12bec755","negativeFeedback":null,"positiveFeedback":null,"title":"Zahlen zählen"}}},{"body":"Der Umgang ist nett solange man funktioniert und zu allem \"ja\" sagt. Die Betriebsleitungen machen was Sie denken, solange Zahlen stimmen ist offensichtlich alles erlaubt.   Der Auftritt nach aussen Image etc.) ist sehr gut entspricht aber leider nicht der Praxis.  Reklamiert man oder wendet sich direkt an den Vorgesetzte Stellen  hat man eher schlechten Karten. Arbeitsmenge und Pensum passen nicht zu zusammen. Weiterkommen ist weniger von können und Leistung abhängig, sondern sehr Personenbezogen. Vorgesetzte war wenig kompetent und besass auch keine Sozielkompetenz. Getreu dem Motto - Team = Toll ein anderer Machts","comments":[],"contractType":null,"createdAt":"2018-07-29T17:08:10+02:00","id":"c0cde881-e1ea-401a-8c87-005be60fd6b0","negativeFeedback":null,"originalLanguage":"de","positiveFeedback":null,"rating":2,"relation":"former_employee","title":"Eher abzuraten","translations":{"en":{"body":"The contact is nice as long as you work and say \"yes\" to everything. The plant management does what you think, as long as numbers are correct everything is obviously allowed.   The appearance to the outside (image etc.) is very good but unfortunately does not correspond to practice.  If one complains or turns directly to the superiors, one has rather bad cards. The amount of work and the workload don't go together. Progress is less dependent on ability and performance, but very person-related. Superiors were not competent and had no social competence. True to the motto - Team = Great a different power","id":"4cfe83ce-4c32-4286-a1a7-8bffc3875365","negativeFeedback":null,"positiveFeedback":null,"title":"Rather to be discouraged"},"fr":{"body":"Le contact est agréable tant que vous travaillez et que vous dites \"oui\" à tout. La direction de l'usine fait ce que vous pensez, tant que les chiffres sont corrects, tout est évidemment permis.   L'apparence extérieure (image, etc.) est très bonne mais ne correspond malheureusement pas à la pratique.  Si l'on se plaint ou se tourne directement vers les supérieurs, on a des cartes plutôt mauvaises. La quantité de travail et la charge de travail ne vont pas de pair. Les progrès dépendent moins de l'aptitude et de la performance, mais sont très liés à la personne. Les supérieurs n'étaient pas compétents et n'avaient aucune compétence sociale. Fidèle à la devise - Team = Great a different power","id":"7f9c6ee0-e8e9-44c1-9947-4a8a13eaacc9","negativeFeedback":null,"positiveFeedback":null,"title":"Plutôt d'être découragé"},"de":{"body":"Der Umgang ist nett solange man funktioniert und zu allem \"ja\" sagt. Die Betriebsleitungen machen was Sie denken, solange Zahlen stimmen ist offensichtlich alles erlaubt.   Der Auftritt nach aussen Image etc.) ist sehr gut entspricht aber leider nicht der Praxis.  Reklamiert man oder wendet sich direkt an den Vorgesetzte Stellen hat man eher schlechten Karten. Arbeitsmenge und Pensum passen nicht zu zusammen. Weiterkommen ist weniger von können und Leistung abhängig, sondern sehr Personenbezogen. Vorgesetzte war wenig kompetent und besass auch keine Sozielkompetenz. Getreu dem Motto - Team = Toll ein anderer Machts","id":"839fd138-53c9-4e06-b818-dbdeb87d1c4c","negativeFeedback":null,"positiveFeedback":null,"title":"Eher abzuraten"}}},{"body":"Dummerweise habe ich an dem Tag nicht die Mails gelesen, den gleichzeitig mit dem Tag für das Probearbeiten hatte ich auch die Absage im Postfach. Nur hat mir das niemand (bewusst?) dort gesagt (Schelm wer böses dabei denkt) die Crew war erstaunt das ich nicht von einer temporären Firma gekommen sei um aus zu helfen. Logisch, für diesen Tag war schönes Wetter angesagt und sie haben mit einem Ansturm in der Küche gerechnet. Eigentlich habe ich das innerlich abgehakt, letzte Woche habe ich bei einem temporär Einsatz mit einem Koch gesprochen der hat genau das gleiche erlebt in der Filiale..... Es ist so, solange die Zahlen stimmen kann jeder Betriebsleiter machen was er will! Von diesem Erlebnis habe ich sogar den Mailverkehr gespeichert, den ich habe mich gewehrt! Den Firmenumsatz auf die Hoffnungen von Bewerbern zu generieren ist nicht Swiss-like, zumal dies nicht nur mir passiert ist.","comments":[],"contractType":null,"createdAt":"2018-06-18T17:32:01+02:00","id":"bfe5e559-1647-4f9b-b0f6-10c32488c78d","negativeFeedback":null,"originalLanguage":"de","positiveFeedback":null,"rating":1,"relation":"applicant","title":"\"Probearbeiten\"","translations":{"en":{"body":"Unfortunately, I didn't read the mails that day, and I had the cancellation in the mailbox at the same time as the day for the rehearsal. Only nobody told me that (consciously?) there (rogue who thinks evil) the crew was surprised that I didn't come from a temporary company to help out. Logically, for this day beautiful weather was announced and they counted on a rush in the kitchen. Actually I've ticked that off inside, last week I spoke with a cook on a temporary assignment who experienced exactly the same thing in the branch..... It is so, as long as the numbers are right, every plant manager can do what he wants! From this experience I have even saved the mail traffic that I have resisted! Generating the company turnover on the hopes of applicants is not Swiss-like, especially as this has not only happened to me.","id":"9364a531-a06c-4dc1-886a-4e6e444b02c6","negativeFeedback":null,"positiveFeedback":null,"title":"\"Trial Works\""},"fr":{"body":"Malheureusement, je n'ai pas lu les mails ce jour-là, et j'ai reçu l'annulation dans la boîte aux lettres en même temps que le jour de la répétition. Seulement personne ne m'a dit que (consciemment ?) là (le voyou qui pense le mal) l'équipage était surpris que je ne vienne pas d'une compagnie temporaire pour aider. Logiquement, pour cette journée le beau temps était annoncé et ils comptaient sur une ruée dans la cuisine. En fait, j'ai coché cette case à l'intérieur, la semaine dernière, j'ai parlé à un cuisinier en mission temporaire qui a vécu exactement la même chose dans la succursale....... C'est ainsi, tant que les chiffres sont exacts, chaque directeur d'usine peut faire ce qu'il veut ! De cette expérience, j'ai même sauvé le trafic mail auquel j'ai résisté ! Générer le chiffre d'affaires de l'entreprise sur les espoirs des candidats n'a rien de suisse, d'autant plus que cela ne m'est pas arrivé qu'à moi.","id":"dc5e224d-e37d-4021-ae94-7c404f19daa5","negativeFeedback":null,"positiveFeedback":null,"title":"\"Trial Works\""},"de":{"body":"Dummerweise habe ich an dem Tag nicht die Mails gelesen, den gleichzeitig mit dem Tag für das Probearbeiten hatte ich auch die Absage im Postfach. Nur hat mir das niemand (bewusst?) dort gesagt (Schelm wer böses dabei denkt) die Crew war erstaunt das ich nicht von einer temporären Firma gekommen sei um aus zu helfen. Logisch, für diesen Tag war schönes Wetter angesagt und sie haben mit einem Ansturm in der Küche gerechnet. Eigentlich habe ich das innerlich abgehakt, letzte Woche habe ich bei einem temporär Einsatz mit einem Koch gesprochen der hat genau das gleiche erlebt in der Filiale..... Es ist so, solange die Zahlen stimmen kann jeder Betriebsleiter machen was er will! Von diesem Erlebnis habe ich sogar den Mailverkehr gespeichert, den ich habe mich gewehrt! Den Firmenumsatz auf die Hoffnungen von Bewerbern zu generieren ist nicht Swiss-like, zumal dies nicht nur mir passiert ist.","id":"5ba02f7a-dad6-4c38-98d7-11639eb08112","negativeFeedback":null,"positiveFeedback":null,"title":"\"Probearbeiten\""}}},{"body":"Das Team war toll. Aber wie da mit den Mitarbeitern umgegangen wird mit den Sparmassnahnen eher bedenklich. Und es wird in den Betrieben nicht darauf geachtet wie der Chef den Laden führt. So lange die Zahlen stimmen lassen sie ihn machen was er will. Sehr schade.","comments":[],"contractType":null,"createdAt":"2018-01-12T07:25:57+01:00","id":"34299d1a-93f0-46ab-9346-b3e768eff259","negativeFeedback":null,"originalLanguage":"de","positiveFeedback":null,"rating":2,"relation":null,"title":null,"translations":{"en":{"body":"The team was great. But how the employees are treated is rather questionable with the austerity measures. And the companies do not pay attention to how the boss runs the shop. As long as the numbers are right, they let him do what he wants. That's too bad.","id":"37466a38-5f9e-40db-9918-d8199ed56d8e","negativeFeedback":null,"positiveFeedback":null,"title":null},"fr":{"body":"L'équipe était super. Mais la façon dont les employés sont traités est plutôt discutable avec les mesures d'austérité. Et les entreprises ne font pas attention à la façon dont le patron dirige le magasin. Tant que les chiffres sont exacts, ils le laissent faire ce qu'il veut. C'est vraiment dommage.","id":"4b37d025-c727-47ec-8ff4-161e1a173482","negativeFeedback":null,"positiveFeedback":null,"title":null},"de":{"body":"Das Team war toll. Aber wie
