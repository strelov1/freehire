 Leiterin zur Verbesserung der Organisation, der Flüsse und Prozesse der Abteilung\u003C\u002Fli\u003E\u003Cli\u003EBewertung der aktuellen Supply Chain Organisation und Identifikation der prioritären Bereiche für Strukturierung und Verbesserung\u003C\u002Fli\u003E\u003Cli\u003EStärkung der kritischen Workflows im Zusammenhang mit Produktionsplanung, Prioritätenmanagement und operativer Nachverfolgung\u003C\u002Fli\u003E\u003Cli\u003EBeitrag zur Entwicklung und kontinuierlichen Verbesserung des ERP als Steuerungs- und Datenabsicherungsinstrument\u003C\u002Fli\u003E\u003Cli\u003EKlarstellung der Rollen, Verantwortlichkeiten und Schnittstellen mit Produktion, Einkauf, Logistik, Qualität und anderen industriellen Funktionen\u003C\u002Fli\u003E\u003Cli\u003EEinführung von Überwachungsindikatoren zur Sicherstellung von Termintreue, Lagerbeständen, Prioritäten und Supply Chain Leistung\u003C\u002Fli\u003E\u003Cli\u003EBegleitung der Teams bei der Einführung neuer Arbeitsmethoden und bei Bedarf Übernahme erweiterter Führungsverantwortung\u003C\u002Fli\u003E\u003C\u002Ful\u003E"},"dataUpdateCount":1,"dataUpdatedAt":1793241305146,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["vacancy-translations","de","559dd3eb-ab58-445e-9b89-20b0aa0b4034"],"queryHash":"[\"vacancy-translations\",\"de\",\"559dd3eb-ab58-445e-9b89-20b0aa0b4034\"]"},{"state":{"data":null,"dataUpdateCount":1,"dataUpdatedAt":1793241305148,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["salary\u002Fsalary-estimation",{"companyId":undefined,"jobId":"559dd3eb-ab58-445e-9b89-20b0aa0b4034","jobTitle":"Leiter Supply Chain","cantonCode":undefined,"industryId":"21","categoryId":"153"}],"queryHash":"[\"salary\u002Fsalary-estimation\",
