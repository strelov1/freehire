schiedliche Hintergründe\u003C\u002Fli\u003E \u003Cli\u003EEine Ausbildung im Bereich Informatik\u002FSoftwareentwicklung ist von Vorteil, aber kein Muss – uns überzeugen vor allem deine Projekte und dein Können\u003C\u002Fli\u003E \u003Cli\u003EInteresse und erste Erfahrung im produktiven Einsatz von KI-Tools (z. B. Claude, Copilot, ChatGPT) in der Entwicklung\u003C\u002Fli\u003E \u003Cli\u003EViel Eigeninitiative, Flexibilität, exaktes und effizientes Arbeiten\u003C\u002Fli\u003E \u003Cli\u003EErfahrung mit agiler Softwareentwicklung von Vorteil\u003C\u002Fli\u003E \u003Cli\u003EGute Deutsch- und Englischkenntnisse\u003C\u002Fli\u003E \u003Cli\u003EDu bringst bereits mehrere Jahre Praxiserfahrung mit und hast schon einige Projekte erfolgreich umgesetzt – wir freuen uns auf deine Bewerbung\u003C\u002Fli\u003E \u003C\u002Ful\u003E \u003Ch2\u003EUnser Techstack\u003C\u002Fh2\u003E \u003Cp\u003EWir setzen primär auf PHP\u002FSymfony sowie Pimcore und OpenDXP als Basis für individuelle Web- und Software-Lösungen. Welches Tool im Einzelfall zum Einsatz kommt, entscheiden wir situativ nach den Anforderungen des Kunden – dank dem intensiven Einsatz von KI in der Entwicklung sind wir dabei sehr offen geworden.\u003C\u002Fp\u003E \u003Ch2\u003EWir bieten dir\u003C\u002Fh2\u003E \u003Cul\u003E \u003Cli\u003EEin motiviertes und familiäres Team, bei dem du dich von Anfang an einbringen kannst\u003C\u002Fli\u003E \u003Cli\u003EVielseitige Projekte aus verschiedensten Branchen – über 500 realisierte Projekte, 25+ Jahre Erfahrung\u003C\u002Fli\u003E \u003Cli\u003ERaum für Weiterbildung und Neues lernen\u003C\u002Fli\u003E \u003Cli\u003EModernen, zentralen Arbeitsplatz an der Bürgenstrasse in Luzern, in unmittelbarer Nähe des Vierwaldstättersees\u003C\u002Fli\u003E \u003C\u002Ful\u003E"},"title":"Web-\u002FSoftware-Entwickler:in Frontend und\u002Foder Backend","trackingLinks":undefined,"videos":[],"zipcode":"6005","text":"\u003Cp\u003E\u003C\u002Fp\u003E\u003Cp\u003E\u003Cp\u003E
