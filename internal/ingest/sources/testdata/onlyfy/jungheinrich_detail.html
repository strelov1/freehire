/><meta name="twitter:image" content="https://content.prescreen.io/job-template/images/un24pck1qv7czuch8h6js51hh0hnyjr/job_banner/qv2ojjwo7r44w0o88ssk48cw0g40oo4.png"/></head><body class="__className_1470d7"><div hidden=""><!--$--><!--/$--></div><script data-testid="job-posting-json-ld" type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","description":"\u003ch1>Senior Cybersecurity Engineer (m/w/d) Elektrische Antriebe\u003c/h1>\n \u003c!--\u003ch5>Lorem ipsum dolor sit amet\u003c/h5>-->\n Gesellschaft: JH Norderstedt\u003cbr>\n Geschäftsbereich: Technik\n \u003cbr>\n Standort: Norderstedt + anteiliges Homeoffice\n \u003cbr>\n Beginn: ab sofort\n \u003ch3>\u003c/h3>Mehr mit dir – Gestalte mit uns die Zukunft der Intralogistik! Seit 1953 entwickeln wir bei Jungheinrich smarte und nachhaltige Lösungen für den weltweiten Materialfluss - von intelligenten Fahrzeugen bis hin zu vollautomatisierten Systemen. Heute sind wir über 21.000 Kolleg*innen weltweit, vereint durch die Überzeugung, dass wir gemeinsam mehr bewegen können. \n \u003ch2>Deine Aufgaben\u003c/h2>\n \u003cul>\n\u003cli>Durchführung von Cybersecurity- und Bedrohungsanalysen für Batterien, Ladegeräte und Antriebssteuerungen\u003c/li>\n\u003cli>Definition geeigneter Sicherheitsmaßnahmen zur Erreichung der Cybersecurity-Ziele\u003c/li>\n\u003cli>Analyse, Spezifikation und Verifikation von Cybersecurity-Anforderungen auf Systemebene\u003c/li>\n\u003cli>Unterstützung der Systemarchitektur bei der Umsetzung sicherer Produktkonzepte\u003c/li>\n\u003cli>Zusammenarbeit mit anderen Fachbereichen der Flurförderzeugentwicklung zur Absicherung der Cybersecurity des Gesamtfahrzeugs\u003c/li>\n\u003cli>Begleitung der Entwicklung gemäß ISO/SAE 21434 und weiteren relevanten regulatorischen Anforderungen\u003c/li>\n\u003c/ul>\n \u003ch2>Dein Profil\u003c/h2>\n \u003cul>\n\u003cli>Abgeschlossenes Hochschulstudium der Elektrotechnik, Mechatronik oder eines vergleichbaren technischen Studiengangs (Universität oder Fachhochschule)\u003c/li>\n\u003cli>Mehr als fünf Jahre Berufserfahrung in der Entwicklung eingebetteter Systeme (Embedded Systems)\u003c/li>\n\u003cli>Fundierte Kenntnisse relevanter Cybersecurity-Standards, Normen und regulatorischer Anforderungen wie ISO 27001, IEC 62443, ISO/SAE 21434 und Cyber Resilience Act (CRA)\u003c/li>\n\u003cli>Kenntnisse im Systems Engineering, z. B. INCOSE, ISO/IEC 15288 und V-Modell\u003c/li>\n\u003cli>Ausgeprägte analytische Fähigkeiten sowie eine pragmatische und strukturierte Arbeitsweise\u003c/li>\n\u003cli>Sehr gute Deutsch- und Englischkenntnisse in Wort und Schrift\u003c/li>\n\u003c/ul>\n \u003ch2>Deine Vorteile\u003c/h2>\n \u003cul>\n \u003cli>Work-Life-Balance mit 35 Std./Woche\u003c/li>\n \u003cli>Betriebliche Alters­vorsorge\u003c/li>\n \u003cli>Vollumfängliche Homeoffice Ausstattung\u003c/li> \n \u003cli>E-Ladesäulen\u003c/li>\n \u003cli>Persönliche Weiterentwicklung\u003c/li>\n \u003c/ul>\n \u003ch2>Deine Zusatz-Infos\u003c/h2>\n \u003ch4>Dein Einsatzbereich\u003c/h4>\n Unser Werk in Norderstedt bei Hamburg produziert mit über 1.300 Mitarbeitern Elektro-Niederhubwagen, Hochhubwagen und Schubmaststapler und beheimatet unser Forschungs- und Entwicklungszentrum für Elektromobilität und moderne Lithium-Ionen-Batterien.\n \u003ch4>Über Jungheinrich\u003c/h4>\n Wir zählen zu den weltweit führenden Unternehmen der Intralogistik mit einem einzigartigen Produktportfolio: vom konventionellen Flurförderzeug bis hin zu vollautomatisierten Lösungen.\n \u003ch4>Kontakt\u003c/h4>\n Alexander Freise\u003cbr>\n Telefon +49 151 58414024 \u003cbr>","hiringOrganization":{"@type":"Organization","name":"Jungheinrich AG","sameAs":"http://www.jungheinrich.com","logo":"https://content.prescreen.io/company/logo/71vzsj25ynkskkgos4skwkwck8ok448.jpg"},"title":"Senior Cybersecurity Engineer (m/w/d) Elektrische Antriebe","datePosted":"2026-10-23","baseSalary":{"@type":"MonetaryAmount","currency":"EUR","value":{"@type":"QuantitativeValue
