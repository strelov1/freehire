amientas digitales y conocimientos básicos de inteligencia artificial aplicada a tareas administrativas, comunicación, organización y elaboración de contenidos, o una motivación clara por aprender a utilizarlas. El puesto no consiste en atender un mostrador abierto al público. Buscamos un perfil administrativo y operativo, con experiencia en el funcionamiento interno de una agencia de viajes y, especialmente, en la gestión de grupos. Trabajo presencial en Náquera, de lunes a viernes, en horario de 9:00 a 14:00 y de 15:00 a 18:00. Durante la temporada de invierno se requerirá disponibilidad para trabajar algunos sábados puntuales vinculados al servicio Bus Blanco, principalmente para preparación de listados, emisión de seguros y coordinación operativa. Contrato indefinido a jornada completa.","identifier":{"@type":"PropertyValue","name":"Viajes Esport Actiu","value":"358177"},"datePosted":"2026-09-27","validThrough":"2026-10-27","hiringOrganization":{"@type":"Organization","name":"Viajes Esport Actiu","sameAs":"https://www.turijobs.com/es-es/viajes-esport-actiu","logo":"https://www.turijobs.com/static/img/sp/logos/7964-7964.jpg"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Náquera","addressRegion":"Valencia","postalCode":"46119","addressCountry":"ES"}},"employmentType":["FULL_TIME"],"baseSalary":{"@type":"MonetaryAmount","currency":"EUR","value":{"@type":"QuantitativeValue","minValue":17200,"maxValue":18200,"unitText":"YEAR"}}}</script></head><body></body></html>
