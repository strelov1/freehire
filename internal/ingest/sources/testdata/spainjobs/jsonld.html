<!DOCTYPE html><html lang="en"><head><title>Business Development Manager (Architect) at 011h | SpainJobs.io</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Business Development Manager (Architect)","description":"\u003ch2\u003eAbout the role\u003c/h2\u003e\u003cp\u003e011h designs and builds residential buildings with an integrated model: project, industrialization, and construction within a single team, connected by a proprietary digital platform that manages the entire process from start to finish.\u003c/p\u003e\u003cp\u003eFounded in 2020, today we have delivered more than 600 homes, have 800 under execution, and more than 1,100 in design to start construction in 2027. We work with developers and investment funds in new residential builds, flex living, and hotels in Catalonia, Madrid, Levante, and the Costa del Sol.\u003c/p\u003e\u003cp\u003eOur goal is to make building more sustainable, fast, and accessible, by industrializing and digitalizing a sector that still works in a handcrafted manner.\u003c/p\u003e\u003cp\u003eWe are looking for an architect who wants to make the leap to the business side. You will be the one who turns land into an opportunity: you understand what fits, how much it costs, and how it fits into the developer's accounts, and you know how to explain it in front of a client.\u003c/p\u003e\u003cp\u003eYou will work alongside the business development manager, with the objective of managing your own client portfolio within a period of 12 to 18 months.\u003c/p\u003e\u003cp\u003eWe are not looking for someone who has been selling for years. We are looking for someone with solid technical judgment, who enjoys talking to clients and wants to grow in business development.\u003c/p\u003e\u003ch2\u003eWhat you'll do\u003c/h2\u003e\u003cul\u003e\u003cli\u003eLead plot and regulation analysis, propose program fits (unit mix, surfaces, buildability), and evaluate feasibility with the cost team.\u003c/li\u003e\u003cli\u003ePrepare technical-economic offers and presentations that connect our solution with the client's feasibility model of income and expenses.\u003c/li\u003e\u003cli\u003eParticipate in meetings with developers and funds, understand what they need, and accompany each opportunity until signing. All this by combining technical vision with business vision.\u003c/li\u003e\u003cli\u003eAct as a bridge between the client and the design, cost, and production teams during the commercial phase.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003eWhat we're looking for\u003c/h2\u003e\u003cul\u003e\u003cli\u003eArchitect or technical architect with 4 to 8 years of experience in an architecture studio, construction company, developer, or industrialized construction company. We will value profiles with slightly less/more experience if they fit.\u003c/li\u003e\u003cli\u003eExperience in multi-family residential in Spain and fluency with urban planning regulations and fits.\u003c/li\u003e\u003cli\u003eTechnical construction knowledge.\u003c/li\u003e\u003cli\u003ePrevious dealings with clients, developers, or owners: presentations, coordination, follow-up meetings.\u003c/li\u003e\u003cli\u003eEase of communication: clarity when explaining, initiative to propose, and the ability to generate trust.\u003c/li\u003e\u003cli\u003eReal interest in industrialization, sustainability, and the business side of architecture.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003eNice to have\u003c/h2\u003e\u003cul\u003e\u003cli\u003eExperience in industrialized construction companies (concrete, wood, metal, or modular).\u003c/li\u003e\u003cli\u003eExperience in commercial, technical-commercial, or pre-construction roles.\u003c/li\u003e\u003cli\u003eKnowledge of the economic model of a development: feasibility studies, VPP, BTR, BTS.\u003c/li\u003e\u003cli\u003eCAD/BIM/Revit, Excel, and interest in digitalization and AI.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003eWhat you'll get\u003c/h2\u003e\u003cul\u003e\u003cli\u003e🌱 Real impact: be part of a company that is transforming construction towards a sustainable and positive model for the planet.\u003c/li\u003e\u003cli\u003e📈 Professional growth: individual development plan with opportunities for learning and continuous training.\u003c/li\u003e\u003cli\u003e🤝 Great environment and collaboration: a multidisciplinary, diverse team with a culture of support and closeness.\u003c/li\u003e\u003cli\u003e🧘 Well-being and balance: for us, the balance between your personal and professional life is important.\u003c/li\u003e\u003cli\u003e🏢 Sustainable offices: pleasant spaces designed for collaboration and respect for the environment.\u003c/li\u003e\u003cli\u003e🏖️ 30 working days of vacation per year so you can enjoy your personal time.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003eAdditional information\u003c/h2\u003e\u003cp\u003e\u003cem\u003eAt 011h, we foster diversity and inclusion. All people are welcome, regardless of their origin, identity, orientation, age, or ability. We adapt the process if you need it. Join a team that values different perspectives and experiences. \u003c/em\u003e\u003c/p\u003e","identifier":{"@type":"PropertyValue","name":"011h","value":"6C44286182"},"datePosted":"2026-10-08T00:00:00.000Z","hiringOrganization":{"@type":"Organization","@id":"https://www.spainjobs.io/companies/011h#organization","name":"011h","sameAs":"https://www.011h.com"},"directApply":false,"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Barcelona","addressRegion":"Catalonia","addressCountry":"ES"}},"educationRequirements":{"@type":"EducationalOccupationalCredential","credentialCategory":"bachelor degree"},"experienceRequirements":{"@type":"OccupationalExperienceRequirements","monthsOfExperience":48}}</script></head><body><a href="https://www.linkedin.com/company/spainjobs">LinkedIn</a><h1 class="min-w-0 flex-1 font-heading font-extrabold text-2xl leading-tight tracking-tighter md:mt-0 md
