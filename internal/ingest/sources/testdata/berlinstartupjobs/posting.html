<html><head><script type="application/ld+json">
				{"@context":"http:\/\/schema.org","@type":"JobPosting","datePosted":"2026-11-02","description":"At Superchat, we're rebuilding how businesses talk to their customers. The phone call, the contact form, the support ticket: all of it is being replaced by messaging and AI. We're building the platform that runs underneath.\n\nFounded in 2020, Superchat has become the platform of choice for 10,000+ businesses worldwide, from globally recognized brands like Allianz, Auto1, Enpal, Danone, and GASAG to the small businesses, dental practices, and one-person startups that need to look bigger than they are. Today, millions of messages flow through Superchat every single day.\n\nWe started as a unified inbox: one place for every channel a customer might pick, WhatsApp, email, SMS, Instagram. Then ChatGPT happened, and the second chapter began: AI agents that respond across chat, email, and voice at the quality of the best human teams.\n\nWe're 100 people, profitable, and have raised \u20ac18M in funding (last round 4.5 years ago, we've been growing on our own money since). Headquartered in Berlin.\n\nWe are hiring a backend-leaning Tech Lead to lead a team of 3-4 engineers and own the tech for a part of Superchat\u2019s product.\n\nThis is a hands-on leadership role: You\u2019ll spend roughly half your time designing and building software and the other half enabling your team to perform at its best. Work directly on architecture, development and important projects while creating the clarity, feedback and environment your engineers need to deliver an excellent product\n\n<strong>Who We Want<\/strong>\n\n<strong>A strong, current backend engineer.<\/strong>\nYou bring 3+ years of experience as a Senior or Staff Engineer and remain deeply involved in software development. You are comfortable owning, designing and building crucial parts of production systems.\n\n<strong>Experienced with the JVM ecosystem.<\/strong>\nYou have substantial experience with Java or another JVM language. Kotlin and AWS experience are a plus, since our backend runs on Kotlin\/Quarkus.\n\n<strong>Ready to lead people.<\/strong>\nYou may already have worked in a hybrid Tech Lead role, have been an Engineering manager for a short time or be taking your first steps in people leadership after successfully owning projects and architecture. What matters is that you genuiely want to help people grow\n\n<strong>Strong at delivery.<\/strong>\nYou know how to turn product goals into reality. You are used to work in fast-paced startups and are a driver to increase velocity.\n\n<strong>Product-minded.<\/strong>\nYou care about solving the customers problem. You engage with product decisions, challenge assumptions constructivly and find pragmatic solutions to build things in a lean way.\n\n<strong>Clear communicator.<\/strong>\nYou are able to explain complex technical things in details to Engineers and in an understandable way to non-technical stakeholders. You create alignment and motivate people\n\n<strong>Excited about AI-assisted development.<\/strong>\nYou are already using AI in your development workflow and are eager to explore how it can improve engineering speed, quality and the way teams work.\n\n<strong>Who We Don\u2019t Want<\/strong>\n\n<strong>Pure people manager. <\/strong>You no longer want to work directly on software. This role requires meaningful, ongoing involvement in architecture, implementation, code review, and technical problem-solving.\n\n<strong>Hero engineer. <\/strong>You want to make every important technical decision yourself or become the bottleneck for the team. Your job is to raise the effectiveness of the whole team, not to be the only person who can solve difficult problems.\n\n<strong>Pure delivery manager. <\/strong>You treat engineering as a ticketing operation focused only on timelines and task tracking instead of product quality, technical health, and team growth. We need engineering leaders, not project coordinators.\n\n<strong>Remote-only operator. <\/strong>You prefer fully remote work and don\u2019t want to actively build relationships and culture in person with the team. We believe strong engineering leadership requires regular in-person collaboration and presence in Berlin.\n\n<strong>Your Day To Day<\/strong>\n<ul>\n \t<li>Spend approximately 50% of your time contributing directly to architecture, development, code reviews, and important technical projects.<\/li>\n \t<li>Lead a team of 3-4 engineers and take responsibility for its effectiveness, technical quality, and delivery.<\/li>\n \t<li>Work closely with your Product Manager to understand customer problems, shape solutions, scope projects, and set priorities.<\/li>\n \t<li>Establish clear technical direction while enabling engineers to own decisions and develop their judgment.<\/li>\n \t<li>Run regular 1:1s, give actionable feedback, and support each engineer\u2019s development and performance.<\/li>\n \t<li>Remove blockers, manage dependencies, and help the team identify delivery risks early.<\/li>\n \t<li>Improve engineering practices and explore effective uses of AI throughout the software-development lifecycle.<\/li>\n \t<li>Contribute to hiring through technical interviews, structured feedback, and candidate conversations.<\/li>\n<\/ul>\n<strong>Stakeholders<\/strong>\n\n<strong>Director of Engineering<\/strong>: Your manager and partner on people development, calibration, processes.\n<strong>Direct Reports<\/strong>: Engineers in your team; you own their development, performance and growth\n<strong>Product Manager<\/strong>: PMs own what and why; you own how (delivery) and who (people)\n<strong>CTO and CPO<\/strong>: We are a lean organization with a flat hierarchy. You will regulary disccuss the direction of architecture with the CTO and product with the CPO\n\n<strong>Why People Choose Us<\/strong>\n\n<strong>Mission that matters<\/strong>. Real impact on small businesses, not abstract metrics\n\n<strong>Funded with conviction<\/strong>. $18M raised and profitable\n\n<strong>Modern stack<\/strong>. Kotlin\/Quarkus, AWS, TypeScript\/React\/Next.js, and LangGraph for AI-powered features\n\n<strong>Squad-based organization<\/strong>. Each squad owns its domain end-to-end with real ownership and autonomy\n\n<strong>Two clear career tracks<\/strong>. We support both individual contributor growth (up to Staff level) and Management Paths with explicit reversibility between both and Tech Lead being the first level of management that is still quite hands-on\n\n<strong>Product-led structure<\/strong>. PMs report directly to the CPO, keeping product strategy focused, consistent, and clearly prioritized\n\n<strong>Hybrid by design<\/strong>. Our Berlin office in Prenzlauer Berg is the center of gravity, with two work-from-home days as the standard setup\n\n<strong>Direct feedback culture<\/strong>. Honest, direct, and kind feedback is part of how we work together - in 1:1s, retrospectives, and everyday collaboration\n\n<strong>Benefits &amp; Culture<\/strong>\n<ul>\n \t<li>Choose between an Urban Sports Club\/John Reed membership or a public transport\/Dance subscription<\/li>\n \t<li>Regular company and team events<\/li>\n \t<li>Annual personal development budget of \u20ac500 for conferences, courses, books, career coaching, and more<\/li>\n \t<li>An inclusive and exciting startup culture that enables fast professional and personal growth<\/li>\n \t<li>Beautiful office in the heart of Berlin (Prenzlauer Allee 242) with free snacks, drinks, and top-notch equipment<\/li>\n<\/ul>\n<strong>We want to build a community, not just a company.<\/strong>\n\nIt\u2019s important to us to create an environment where people genuinely enjoy spending time together - whether that\u2019s through HYROX training, golfing, beer pong tournaments, running clubs, Warhammer, weekend activities, or whatever kind of community you\u2019d like to help build here!\n\nWe're looking for people with passion, grit, and integrity. You're encouraged to apply even if your experience doesn't precisely match the description. At Superchat, we welcome diverse perspectives and people who think rigorously.\n\nRelocating to Berlin? We support you with practical relocation help. You'll feel home in no time.\n\nWe look forward to your application!\n\n&nbsp;","employmentType":"FULL_TIME","title":"Tech Lead (m\/f\/d) \/\/ Superchat","hiringOrganization":{"@type":"Organization","name":"Superchat","sameAs":"http:\/\/superchat.de","logo":"https:\/\/berlinstartupjobs.com\/wp-content\/uploads\/superchat-logo-80x80.jpeg"},"identifier":{"@type":"PropertyValue","name":"Superchat","value":27634},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"DE","addressLocality":"Berlin","addressRegion":"DE"}},"jobLocationType":"","validThrough":"2027-01-31"}
