<!doctype html><html><head><title>Medewerker buitendienst (groen) | Gemeente Edam-Volendam</title><script type="application/ld+json" data-hid="googleForJobs">{"@context":"https://schema.org/","@type":"JobPosting","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"Gemeente Edam-Volendam","sameAs":"https://www.edam-volendam.nl","logo":"https://jobsrepublic-too-images.s3.eu-west-1.amazonaws.com/companies/781b8772-5ab0-45be-8a9d-0ff53b5ace23.jpeg"},"jobLocation":{"address":{"@type":"PostalAddress","streetAddress":"","addressLocality":"Volendam","addressRegion":"NH","postalCode":"1132KN","addressCountry":"NL"},"@type":"Place"},"baseSalary":{"@type":"MonetaryAmount","currency":"EUR","value":{"@type":"QuantitativeValue","unitText":"MONTH","minValue":2472,"maxValue":3579}},"title":"Medewerker buitendienst (groen)","description":"Vind je het leuk om in het groen te werken en steek je graag de handen uit de mouwen bij onderhouds-, machinale-, en beplantingswerkzaamheden? Dan is deze functie misschien iets voor jou!\u003Cbr>\u003Cbr>\u003Cstrong>Over de functie\u003C/strong>\u003Cbr>Als medewerker buitendienst onderhoud je samen met je collega’s het groen, zodat de natuur binnen de gemeente toegankelijk en netjes blijft voor de inwoners. De werkzaamheden bestaan hoofdzakelijk uit het onderhouden van bomen, het snoeien van heesters, schoffelwerkzaamheden, aanplanten van nieuwe beplanting en diverse machinale werkzaamheden zoals bosmaaien en bladblazen.\u003Cbr>\u003Cbr>Daarnaast knap je beschadigd straatmeubilair op, zoals bankjes of plantenbakken in de openbare ruimte. Ook verricht je eenvoudige administratieve handelingen en signaleer en meldt je onderhoudsproblemen, schades en reinigingszaken. Je bent flexibel inzetbaar en bereid om ook buiten de reguliere werktijden te werken. Bijvoorbeeld bij calamiteiten, op de milieustraat of tijdens evenementen zoals de kermis. Daarnaast lever je periodiek een bijdrage aan de consignatieregeling (Een consignatieregeling houdt in dat je buiten je normale werktijden beschikbaar bent om opgeroepen te worden bij noodgevallen of dringende werkzaamheden) en de strooidienst.\u003Cbr>\u003Cbr>\u003Cstrong>Wat ga je doen\u003C/strong>\u003Cbr>\u003Cbr>\u003Cstrong>Wat bieden wij jou?\u003C/strong>\u003Cbr>Een aantrekkelijke en uitdagende functie (36 uur per week). Afhankelijk van je kennis, opleiding en ervaring, bieden wij een salaris tot maximaal €3.579,- bruto per maand bij een 36-urige werkweek (salarisschaal 5). Ook mag je rekenen op een uitstekend secundair arbeidsvoorwaardenpakket zoals:\u003Cbr>\u003Cul> \u003Cli>Een Individueel keuzebudget (IKB) van 17,05% van jouw brutosalaris dat je kunt gebruiken voor bijvoorbeeld uitbetaling, koop van extra verlof of scholing.\u003C/li> \u003Cli>Maandelijkse tegemoetkoming in de contributie van je sportvereniging of -school.\u003C/li> \u003Cli>Een jaarlijkse tegemoetkoming in de kosten van je zorgverzekering: € 296,- tot en met schaal 5 en € 168,- vanaf schaal 6.\u003C/li> \u003Cli>Reiskostenvergoeding woon-werkverkeer van € 0,23,- per km (vanaf 5 km woon-werkverkeer enkele reis)\u003C/li> \u003Cli>Reiskostenvergoeding van 100% als je met het ov reist.\u003C/li> \u003Cli>We hebben een zeer actieve personeelsvereniging.\u003C/li> \u003Cli>Collega's die loyaal en bevlogen zijn en van doorpakken weten.\u003C/li> \u003Cli>Een informele en collegiale sfeer met veel humor en waar je je snel thuis voelt.\u003C/li>\u003C/ul>\u003Cbr>\u003Cstrong>Wat breng jij mee?\u003C/strong>\u003Cbr>Voor deze functie zoeken wij een enthousiaste en gemotiveerde collega met interesse én bij voorkeur ervaring in het groen. Je bent klantgericht, werkt graag samen en steekt met plezier de handen uit de mouwen. Je bent flexibel inzetbaar en vindt het geen probleem om buiten de reguliere werktijden te werken, bijvoorbeeld bij calamiteiten, op de milieustraat of tijdens evenementen zoals de kermis. Ook kun je snel schakelen tussen de aandachtsgebieden groen en grijs/inzameling en spring je zo nodig bij in het team Grijs.\u003Cbr>\u003Cul> \u003Cli>Ervaring in de groenvoorziening en het hebben van een mbo-diploma in de richting groen is een pre.\u003C/li> \u003Cli>Je bent in het bezit van rijbewijs B en C1 of bereid deze te halen.\u003C/li> \u003Cli>Het is mooi meegenomen als je in bezit bent van een groot rijbewijs. Of als je deze niet hebt, bereid bent deze te halen.\u003C/li> \u003Cli>Je vindt het geen probleem om trainingen en cursussen te volgen (zoals vakgerichte trainingen, BHV en EHBO).\u003C/li> \u003Cli>Je bent in het bezit van VCA Basis of je wilt deze via ons halen.\u003C/li> \u003Cli>Flexibiliteit, aanpakken en enthousiasme zijn jou op het lijf geschreven.\u003C/li> \u003Cli>Beheersing van de Nederlandse taal is vereist.\u003C/li>\u003C/ul>\u003Cbr>\u003Cstrong>Over het team\u003C/strong>\u003Cbr>Het team Dagelijks beheer is een essentieel onderdeel van de afdeling Openbare werken en verantwoordelijk voor het dagelijkse beheer en onderhoud van de openbare ruimte. Je werkt samen in een team dat streeft naar topkwaliteit in dienstverlening.\u003Cbr>\u003Cbr>\u003Cstrong>Waarom werken bij de gemeente Edam Volendam\u003C/strong>\u003Cbr>Werken bij Edam-Volendam is nooit saai. We hebben alles: stad, dorp, platteland, betaald voetbal, dubbele vergrijzing, boeren, toerisme, horeca, muziek en cultuur. We zijn een grote kleine ontwikkelgemeente. Onze projecten zijn groter dan je van een gemeente van onze omvang verwacht.\u003Cbr>\u003Cbr>De gemeentelijke organisatie is een afspiegeling van de dynamiek van de samenleving. Een mix van gedreven collega's die er al lang werken, loyaal zijn en vol zitten met kennis. En nieuwe collega's die zaken met een frisse open blik benaderen. We streven naar een gewoon goede dienstverlening. Wij zorgen dat de juiste mensen op de \u003Cstrong>\u003C/strong>juiste plek zitten. Daarom heb je bij ons de mogelijkheid om opleidingen te volgen en door te ontwikkelen. Wij zorgen voor een goede interne mobiliteit en doorgroeimogelijkheden. Thuiswerken mag, maar we hebben geen thuiswerkcultuur. We werken het liefst samen op een van onze locaties. En we streven naar een goede balans tussen werk en privé. Een voordeel, vanuit alle kanten is er richting onze gemeente vrijwel nooit file.\u003Cbr>\u003Cbr>\u003Cstrong>Het gaat in onze gemeente om mensen. Wij staan voor onze mensen. \u003C/strong> \u003Cstrong>Want mensen maken Edam-Volendam.\u003C/strong>\u003Cbr>\u003Cbr>\u003Cstrong>Kom jij ons team versterken?\u003C/strong>\u003Cbr>Je reactie met cv en motivatiebrief kun je tot en met donderdag 5 november uploaden via het sollicitatieformulier.\u003Cbr>\u003Cbr>\u003Cstrong>Meer weten over deze vacature?\u003C/strong>\u003Cbr>Voor meer informatie over deze functie kun je contact opnemen met Auke Batstra, teamleider Dagelijks beheer. Voor informatie over de procedure kun je contact opnemen met Esther van Eijk, adviseur werving en selectie. Beiden zijn bereikbaar via (0299) 398 398. \u003Cimg src=\"https://www.mmimir.nu/view/3799fa47-dd7a-4358-85d5-6d309a685dc3\">","datePosted":"2026-10-24T07:05:02Z","validThrough":"2026-11-05T20:59:59Z"}</script></head><body></body></html>
