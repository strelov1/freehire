<!doctype html><html><head><title>Directiesecretaresse (32 uur) | Gemeente Maashorst</title><script type="application/ld+json" data-hid="googleForJobs">{"@context":"https://schema.org/","@type":"JobPosting","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"Gemeente Maashorst","sameAs":"https://opwegnaargemeentemaashorst.nl/nieuwe-gemeente-nieuw-logo","logo":"https://jobsrepublic-too-images.s3.eu-west-1.amazonaws.com/companies/fcdf4e3d-257e-4f87-8edb-0c62515762cc.png"},"jobLocation":{"address":{"@type":"PostalAddress","streetAddress":"","addressLocality":"Uden","addressRegion":"NB","postalCode":"5401EJ","addressCountry":"NL"},"@type":"Place"},"baseSalary":{"@type":"MonetaryAmount","currency":"EUR","value":{"@type":"QuantitativeValue","unitText":"MONTH","minValue":2875,"maxValue":4065}},"title":"Directiesecretaresse (32 uur)","description":"Pak de ruimte in Maashorst als \u003Cstrong>Directiesecretaresse (m/v/x) \u003C/strong>\u003Cbr>\u003Cbr>Uden | 32 uur | schaal 7\u003Cbr>\u003Cbr>\u003Cstrong>’n Goeie baan barstensvol:\u003C/strong>\u003Cbr>\u003Cul> \u003Cli>Impact: dankzij jouw ondersteuning kunnen de drie concerndirecteuren zich volledig richten op de bestuurlijke en maatschappelijke opgaven van Maashorst.\u003C/li> \u003Cli>Uitdaging: jij brengt structuur in de dynamiek van de directie en houdt overzicht, ook als prioriteiten snel veranderen.\u003C/li> \u003Cli>Nieuwe contacten: je schakelt dagelijks met collega's, bestuurders en externe partners, waaronder andere gemeenten en organisaties.\u003C/li>\u003C/ul>\u003Cbr>\u003Cstrong>Dit ga je doen\u003C/strong>\u003Cbr>Als directiesecretaresse ben jij een onmisbare schakel in het soepel laten verlopen van de dagelijkse werkzaamheden van onze concerndirecteuren. Je beheert complexe agenda's, houdt mailboxen bij en plant afspraken. Daarbij weet jij altijd de juiste prioriteiten te stellen en overzicht te bewaren.\u003Cbr>\u003Cbr>Daarnaast ondersteun je de directeuren bij uiteenlopende organisatorische en administratieve werkzaamheden en zorg je ervoor dat afspraken, bijeenkomsten en bezoeken soepel verlopen. Je verzorgt de voorbereiding van vergaderingen, zorgt dat stukken tijdig beschikbaar zijn in iBabs (ons vergaderplatform) en ondersteunt waar nodig bij het ontvangen van gasten. Dankzij jou zitten de directeuren altijd goed voorbereid aan tafel. Wekelijks bespreek je met de directeuren de planning en voortgang van lopende zaken. Daarnaast verzorg je de organisatorische en administratieve voorbereiding én afhandeling van de wekelijkse directieoverleggen. Je stelt besluiten- en actielijsten op, bewaakt actiepunten en ondersteunt bij het beheren van de lange termijn agenda (LTA).\u003Cbr>\u003Cbr>Het mooie van deze functie? Je krijgt een uniek inkijkje in alles wat er speelt binnen Maashorst. Daardoor begrijp je snel wat belangrijk is en weet je goed prioriteiten te stellen. Geen dag is hetzelfde: je schakelt voortdurend tussen plannen, organiseren, ontzorgen en vooruitdenken.\u003Cbr>\u003Cbr>\u003Cstrong>Dit zijn wij\u003C/strong>\u003Cbr>Even voorstellen. Wij zijn Maashorst, een jonge gemeente die volop in beweging is. Bij ons vind je het beste van twee werelden: de levendigheid van Uden en de karaktervolle charme van onze kleinere kernen, elk met een eigen actief dorpsleven. Omgeven en geïnspireerd door natuur zoals je die nergens anders tegenkomt, pakken wij de ruimte om anders te zijn. Een gemeente die durft én doet, en ook ingewikkelde vraagstukken vol vertrouwen aanpakt.\u003Cbr>\u003Cbr>Als jonge gemeente hebben we grote ambities en bouwen we met lef en ondernemerschap aan het goei leven voor iedereen in Maashorst. Er is nog veel te ontwikkelen en dat maakt het juist interessant. Kansen liggen hier voor het oprapen. Daarom krijg jij vanaf dag één de ruimte om impact te maken.\u003Cbr>\u003Cbr>\u003Cstrong>Jouw plek in de organisatie\u003C/strong>\u003Cbr>Je vormt een team met het bestuurssecretariaat, wat weer onderdeel is van team Communicatie. Het bestuurssecretariaat bestaat uit drie collega’s die de burgemeester, wethouders en de gemeentesecretaris ondersteunen. Daarnaast werk je nauw samen met de management assistentes. Samen zorgen jullie voor een optimale ondersteuning van directie, bestuur en teammanagers.\u003Cbr>\u003Cbr>\u003Cstrong>En dit helpt jou om ruimte te pakken\u003C/strong>\u003Cbr>\u003Cul> \u003Cli>Een individueel keuzebudget (17,05% van je salaris) waarmee jij de keuzes maakt die bij jou passen. Laat bijvoorbeeld een deel van je inkomen uitbetalen of zet dit om in extra verlof of een fietsvergoeding.\u003C/li> \u003Cli>Een salaris passend bij de functie en ervaring (definitieve inschaling volgt).\u003C/li> \u003Cli>Zicht op een vast contract.\u003C/li> \u003Cli>28 vakantiedagen bij een 36-urige werkweek.\u003C/li> \u003Cli>Reis je duurzaam naar je werk? Dan kun je een bonus ontvangen tot maximaal € 500 per jaar, en een interessante reiskostenvergoeding.\u003C/li> \u003Cli>Blijf fit met een bijdrage van maximaal € 20 per maand voor je sportabonnement.\u003C/li> \u003Cli>Je bouwt pensioen op bij het ABP, met een werkgeversbijdrage van 70%.\u003C/li> \u003Cli>Uitstekende opleidings- en ontwikkelmogelijkheden.\u003C/li> \u003Cli>Betrokken collega's en veel gezelligheid, onder meer via onze actieve personeelsvereniging.\u003C/li>\u003C/ul>\u003Cbr>\u003Cstrong>Passen we bij elkaar?\u003C/strong>\u003Cbr>Werken in Maashorst past bij jou als je het leuk vindt om bij te dragen aan de ontwikkeling van onze jonge gemeente en het niet erg vindt dat dit soms gepaard gaat met dynamiek en verandering. Jij neemt verantwoordelijkheid, denkt vooruit en brengt positieve energie mee.\u003Cbr>\u003Cbr>Om succesvol te zijn in deze functie breng je daarnaast het volgende mee:\u003Cbr>\u003Cul> \u003Cli>Een relevant mbo- of hbo-diploma en/of ervaring als management assistent, directiesecretaresse of bestuurssecretaresse.\u003C/li> \u003Cli>Je bent integer, discreet, collegiaal, flexibel, accuraat en stressbestendig en kunt zelfstandig opereren.\u003C/li> \u003Cli>Je kunt uitstekend plannen en organiseren en houdt overzicht in een dynamische omgeving.\u003C/li> \u003Cli>Je begrijpt wat ontzorgen betekent en weet hoofd- en bijzaken goed van elkaar te onderscheiden.\u003C/li> \u003Cli>Je communiceert gemakkelijk met collega's en externe contacten op verschillende niveaus.\u003C/li> \u003Cli>Je bent digitaal vaardig en kunt goed werken met Microsoft 365 en bij voorkeur met iBabs.\u003C/li>\u003C/ul>\u003Cbr>\u003Cstrong>Kies jij voor Maashorst?\u003C/strong>\u003Cbr>We zijn benieuwd naar jou! Upload uiterlijk 1 november 2026 je motivatie en cv via het sollicitatieformulier hieronder.\u003Cbr>\u003Cul> \u003Cli>\u003Cstrong>Let op:\u003C/strong> Je vervult deze functie samen met een collega. Omdat jullie gezamenlijk het directiesecretariaat vormen, is het belangrijk dat de werkdagen goed op elkaar aansluiten. We vragen je daarom om in je sollicitatie aan te geven \u003Cstrong>op welke dagen je beschikbaar bent.\u003C/strong>\u003C/li>\u003C/ul>\u003Cimg src=\"https://www.mmimir.nu/view/b417bfb4-96e6-4586-93af-efe7efc086ef\">","datePosted":"2026-10-25T08:06:35Z","validThrough":"2026-11-01T20:59:59Z"}</script></head><body></body></html>
