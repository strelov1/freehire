iteria:{educationLevelText:["Bachelor’s(Graduate)","Master’s(Graduate)"],experienceText:"5 - 10 years of experience",languageText:["English(Reading : Good, Writing : Good, Speaking : Good)"],militaryText:e,universityDepartmanText:e,positionTypeText:ai,drivingLicenseText:e},jobSkin:{skinId:16668,coverPhoto:bV,videoPath:c,videoThumbnail:c,mobileCoverPhoto:bV},jobCompanyInformation:{companyId:9606,profileId:34484,companyName:bW,profileName:bW,companyUrl:"\u002Ffirma-profil\u002Ffranklin-electric-9606-34484",companyHasIso:a,companyHasRespectToHumanAward:a,companySector:[R],logo:261086,companyInfo:"Temelleri 1969’da İzmir’de atılan İMPO Motor Pompa, faaliyetlerine Batı Anadolu illerinde daha çok zirai alanda hizmet vererek başlamış ve bugün Türkiye’deki dalgıç motor ve pompa sektöründe en kapsamlı üretimi gerçekleştiren firma haline gelmiştir. İMPO, 4’’ ve 10’’ arasında 350’den fazla dalgıç pompa tipi ve 0,5 HP’den 250 HP’ye kadar dalgıç motorları ile sarılabilir dalgıç motor, döküm ve paslanmaz dalgıç pompa, hidrofor ve aksesuarları, ithal ve yerli santrifüj ve drenaj pompaları ile müşterilerinin tüm ihtiyaçlarına cevap vermektedir. 30.000 m2 alan üzerine kurulu, 12.000 m2 kapalı üretim tesisinde, 400 çalışanı ve güçlü üretim altyapısı ile 50’den fazla ülkeye ihracat gerçekleştirirken, yurtiçinde de pazar payını arttırmaya her geçen gün devam etmektedir. Kuruluşundan bu yana mevcut ürünlerinin kalitesini mükemmele taşımak ve yeni ürünler geliştirmek için kalite ve ar-ge çalışmalarına aralıksız yatırım yapmayı sürdüren İMPO, yıllar içinde oluşan bu bilgi birikimi ve “güvenilir marka” imajı ile yurtiçinde lider konumunu korurken, sektördeki global firmaların dikkatini çekmiş ve su teknolojileri sektöründe dünyanın lider firmalarından Franklin Electric’in 2011 yılında şirketin ana ortağı olmasıyla globalleşme yolunda ilk adımları atmıştır. Franklin Electric, 2018 yılı itibari ile İMPO’nun tek hissedarı haline gelmiştir. İMPO, tüm ürün gruplarında kaliteyi mükemmele çekerken, maliyetleri de arttırmamaya çalışarak, yüksek kaliteye sahip geniş ürün yelpazesi, kapsamlı satış ağı ve hızlı teslimat garantisi ile müşterilerine eksiksiz hizmet sunmaya devam etmektedir. \r\n\r\n\r\nİMPO Motor Pompa, founded in İzmir in 1969, started it’s activities in agriculture business in the western part of Turkey. Today it has become the leading company in Turkey in submersible motors and pumps business having the most comprehensive product range.\r\n\r\nIMPO meets all the needs of its customer base with more than 350 different types of cast iron and stainless steel submersible pumps from 4’’ to 10’’, submersible motors ranging from 0,5 HP to 250 HP, water boosters ,dewatering pumps, centrifugal pumps and accessories.\r\n\r\nWith the strength of it’s 400 employees and 12.000 m2 production facility, IMPO exports to more than 50 countries, as well as increases its domestic market share day by day.\r\n\r\nHaving constantly invested in quality and R&D activities with the aim of bringing the existing product’s quality to perfection and developing new products, IMPO has been maintaining its leading position in domestic market thanks to strong IMPO Brand and market know-how. This success grabbed the attention of global companies in the sector. As a result, Franklin Electric acquired a portion of IMPO shares and became the partner of the company in 2011. Franklin Electric has become the sole shareholder of IMPO as of 2018. \r\nIMPO has grown from a small pump manufacturing company into a leading regional provider of systems and components for moving water. As IMPO, we continue to follow our mother company Franklin Electric’s core strategy by continuously improving our products and processes to deliver valuable and innovative solutions that better serve our customers’ needs.\r\n\r\n\r\n",companyAbout:c,companyInformationDetail:{isWeekDay:b,isSaturday:a,isSunday:a,blueWorker:$,whiteWorker:$,benefits:["Özel Sağlık Sigortası","Servis","Yemekhane","Bayram Yardımı"],o
