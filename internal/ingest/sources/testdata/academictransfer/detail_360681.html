<!doctype html><html><head><title>PhD Position in Cloud-Native and AI-Native 6G Networks — University of Amsterdam (UvA) — AcademicTransfer</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"PhD Position in Cloud-Native and AI-Native 6G Networks — University of Amsterdam (UvA) — AcademicTransfer","publisher":{"@type":"Organization","name":"AcademicTransfer","logo":{"@type":"ImageObject","url":"/_nuxt/logo.WZuK6tSN.svg"}},"keywords":"cloud-native, AI-native, 6G networks, data plane programming, network slicing, programmable networking, Kubernetes, eBPF, P4, mobile network architectures","mainEntity":{"@context":"http://schema.org","@type":"JobPosting","datePosted":"2026-05-01T13:04:31.838242+02:00","validThrough":"2026-10-28T12:04:31.838242+01:00","title":"PhD Position in Cloud-Native and AI-Native 6G Networks","description":"Are you passionate about shaping next-generation mobile networks? If so, please continue reading!\u003Cbr>\u003Cbr>\u003Cstrong>Join us!\u003C/strong>\u003Cbr>Software-defined and programmable networking is a key enabling technology for cloud-native and AI-native 6G networks, supporting greater scalability, flexibility, automation, and efficient resource utilization. Cross-layer and cross-domain programmability, across the control and data planes and from RAN to core, is expected to be a defining characteristic of 6G systems, which are currently being developed and standardized. In this context, data plane programming capabilities in next-generation mobile networks can bring significant benefits with regards to network slicing and multi-tenancy, dynamic traffic engineering, offloading network functions to hardware accelerators, etc.\u003Cbr>\u003Cbr>Specifically, this PhD project, conducted in collaboration with Ericsson, the leading mobile communications equipment manufacturer, will investigate data-plane programmability in next-generation mobile networks, with a particular focus on cloud-native and AI-native Radio Access Networks (RAN). The candidate will investigate research challenges including, but not limited to, the specification and implementation of common abstraction layers for heterogeneous programmable data planes, mechanisms for data-plane multitenancy and modularization, and programmable radio resource management, with an emphasis on intelligent and adaptive control.\u003Cbr>\u003Cbr>The research is conducted within the scope of the \u003Ca href=\"https://futurenetworkservices.nl/\">Future Network Services\u003C/a> (FNS): the 6G flagship project for the Netherlands where 60 leading ICT businesses, mobile operators, semiconductor manufacturers and research institutions, have united to spearhead the development of specific aspects of 6G: Software antennas, AI-driven networking, and groundbreaking 6G applications.\u003Cbr>\u003Cbr>You will be embedded in the MNS group. The group focuses its research on the fundamental architectural problems that arise from the interconnection of systems and of data flows. We look at the emerging architectures that can support the operations of the future Internet. More information can be found at: \u003Ca href=\"https://mns-research.nl/\">https://mns-research.nl/\u003C/a>\u003Cbr>\u003Cbr>Within Ericsson Hungary, your work will be anchored to the team in Ericsson's Research Area Networks, which drives innovations towards 6G and the future network platform. Our local competence and expertise are in Radio Network (RAN) and Packet Core architectures and protocols, programmable networks, and network automation. More information is available at \u003Ca href=\"https://www.ericsson.com/en/about-us/company-facts/ericsson-worldwide/hungary/research-ericsson-hungary\">https://www.ericsson.com/en/about-us/company-facts/ericsson-worldwide/hungary/research-ericsson-hungary\u003C/a>\u003Cbr>\u003Cbr>\u003Cstrong>This is what you will do\u003C/strong>\u003Cbr>\u003Cstrong>Tasks and responsibilities:\u003C/strong>\u003Cbr>\u003Cul> \u003Cli>focus on the development and evaluation of and end-to-end programmable data plane, supporting multitenancy and modularity, through the definition and implementation of a generic hardware abstraction layer, supporting heterogeneous systems e.g., GPUs, TPUs, FPGAs, SOCs.\u003C/li> \u003Cli>Investigate optimization aspects of network control and data plane functionality.\u003C/li> \u003Cli>develop appropriate proof of concept(s) to benchmark the performance or validate the applicability of proposed approaches;\u003C/li> \u003Cli>access a unique state-of-the-art testbed to also put theory to practice and be at the forefront of the Dutch 6G national ecosystem;\u003C/li> \u003Cli>become active in the research community and collaborate with other institutes and/or companies that are part of the project;\u003C/li> \u003Cli>publish and present work regularly at international conferences, workshops, and journals;\u003C/li> \u003Cli>contribute to teaching activities, including lab sessions, and assist in the supervision of Bachelor’s and Master’s students.\u003C/li>\n\u003C/ul>\n\u003Cbr>\u003Cstrong>What we ask of you\u003C/strong>\u003Cbr>\u003Cstrong>Your experience and profile:\u003C/strong>\u003Cbr>\u003Cul> \u003Cli>Master's degree or equivalent program (completed or near completion: see below) in a relevant discipline, such as computer science, electrical and computer engineering, security and network engineering etc.;\u003C/li> \u003Cli>excellent programming skills (python, C/C++);\u003C/li> \u003Cli>experience with cloud-native platforms, particularly Kubernetes, is an advantage.\u003C/li> \u003Cli>experience in programmable networking technologies and DSLs such as eBPF and P4 is a plus;\u003C/li> \u003Cli>knowledge in mobile network architectures and protocols is a plus;\u003C/li> \u003Cli>the willingness to be part of an international research team;\u003C/li> \u003Cli>fluency in oral and written English and good presentation skills;\u003C/li> \u003Cli>commitment to maintaining an inclusive, collaborative, diverse, supportive work environment.\u003C/li>\n\u003C/ul>\n\u003Cbr>\u003Cstrong>This is what we offer you\u003C/strong>\u003Cbr>A temporary contract for 38 hours per week for the duration of 4 years (the initial contract will be for a period of 18 months and after satisfactory evaluation it will be extended for a total duration of 4 years). The preferred starting date is as soon as possible. This should lead to a dissertation (PhD thesis). We will draft an educational plan that includes attendance of courses and (international) meetings. We also expect you to assist in teaching undergraduates and master students.\u003Cbr>\u003Cbr>The gross monthly salary, based on 38 hours per week and dependent on relevant experience, ranges between € 3,059 to € 3,881 (scale P). This does not include 8% holiday allowance and 8,3% year-end allowance. The UFO profile Promovendus is applicable.. A favourable tax agreement, the ‘30% ruling’, may apply to non-Dutch applicants. The \u003Ca href=\"https://www.universiteitenvannederland.nl/en/collective-labour-agreement-of-dutch-universities\">Collective Labour Agreement of Universities of the Netherlands\u003C/a> is applicable.\u003Cbr>\u003Cbr>Curious about our extensive secondary benefits package? You can read more about it \u003Ca href=\"https://werkenbij.uva.nl/uva-als-werkgever\">here.\u003C/a>\u003Cbr>\u003Cbr>\u003Cstrong>You will work in this team\u003C/strong>\u003Cbr>The \u003Ca href=\"https://www.uva.nl/en/faculty/faculty-of-science/faculty-of-science.html\">Faculty of Science\u003C/a> has a student body of around 8,000, as well as 1,800 members of staff working in education, research or support services. Researchers and students at the Faculty of Science are fascinated by every aspect of how the world works, be it elementary particles, the birth of the universe or the functioning of the brain.\u003Cbr>\u003Cbr>The mission of the \u003Ca href=\"https://ivi.uva.nl/\">Informatics Institute\u003C/a> (IvI) is to perform curiosity-driven and use-inspired fundamental research in Computer Science. The main research themes are Artificial Intelligence, Computational Science and Systems and Network Engineering. Our research involves complex information systems at large, with a focus on collaborative, data driven, computational and intelligent systems, all with a strong interactive component.\u003Cbr>\u003Cbr>The \u003Ca href=\"https://ivi.uva.nl/research/multiscale-networked-systems-mns.html\">MultiScale Networked Systems\u003C/a> (MNS) group) is part of the Informatics Institute at the University of Amsterdam. The group focusses its research on multiscale systems e.g. cloud systems or clusters that define themselves by their dynamic size and scale, and on the network connecting them. The MNS group explores the emerging architectures that can support emerging applications across the future internet.\u003Cbr>\u003Cbr>Want to know more about our organisation? Read more about \u003Ca href=\"https://www.uva.nl/en/about-the-uva/working-at-the-uva/working-at-the-uva.html\">working at\u003C/a> the University of Amsterdam.\u003Cbr>\u003Cbr>If you feel the profile fits you, and you are interested in the job, we look forward to receiving your application. You can apply online via the button. We accept applications until and including 15 November 2026\u003Cbr>\u003Cbr>Applications should include the following information (all files besides your cv should be submitted in one single pdf file):\u003Cbr>\u003Cul> \u003Cli>a detailed CV including the months (not just years) when referring to your education and work experience;\u003C/li> \u003Cli>a letter of motivation;\u003C/li> \u003Cli>a list of publications;\u003C/li> \u003Cli>the names and email addresses of two references who can provide letters of recommendation.\u003C/li>\n\u003C/ul>\n\u003Cbr>A knowledge security check can be part of the selection procedure.\u003Cbr>(for details: \u003Ca href=\"https://eur04.safelinks.protection.outlook.com/?url=https%3A%2F%2Fopen.overheid.nl%2Frepository%2Fronl-5379d1b4f8b9784bf518251032507a965be9c92d%2F1%2Fpdf%2FNational%2520Knowledge%2520Security%2520Guidelines.pdf&amp;data=05%7C01%7CK.Tensen%40uva.nl%7Cf821bc4a760a45149e0308db1f1ddb00%7Ca0f1cacd618c4403b94576fb3d6874e5%7C0%7C0%7C638137985462492116%7CUnknown%7CTWFpbGZsb3d8eyJWIjoiMC4wLjAwMDAiLCJQIjoiV2luMzIiLCJBTiI6Ik1haWwiLCJXVCI6Mn0%3D%7C3000%7C%7C%7C&amp;sdata=7oVkiiSd0y%2F%2FvLq2JcIbIcZARcqVLNY9W1j7bQwD5mE%3D&amp;reserved=0\">national knowledge security guidelines\u003C/a>)\u003Cbr>\u003Cbr>Only complete applications received within the response period via the link below will be considered.\u003Cbr>\u003Cbr>Do you have any questions or do you require additional information? Please contact:\u003Cbr>\u003Cul> \u003Cli>E: Dr. Chrysa Papagianni, Associate Professor, \u003Ca href=\"mailto:c.papagianni@uva.nl\">c.papagianni@uva.nl\u003C/a>\n\u003C/li> \u003Cli>T: +31 628152140\u003C/li>\n\u003C/ul>","baseSalary":{"@type":"MonetaryAmount","currency":"EUR","value":{"@type":"QuantitativeValue","unitText":"MONTH","minValue":3059,"maxValue":3881}},"workHours":"38 hours per week","employmentType":"TEMPORARY","jobDuration":"","educationRequirements":{"@type":"EducationalOccupationalCredential","credentialCategory":"University graduate"},"occupationalCategory":"Computer science","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Amsterdam","addressCountry":"NL","postalCode":"1098XH","streetAddress":"Science Park 904"}},"totalJobOpenings":1,"directApply":false,"hiringOrganization":{"@type":"Organization","name":"University of Amsterdam (UvA)","sameAs":"https://academictransfer.com/en/employer/university-of-amsterdam/","logo":"https://www.academictransfer.com/images/%2Flogos%2Fuva-en-wide.png/organisation-logo-social/"},"identifier":{"@type":"PropertyValue","name":"AcademicTransfer","value":"360681"}}}</script></head><body></body></html>
