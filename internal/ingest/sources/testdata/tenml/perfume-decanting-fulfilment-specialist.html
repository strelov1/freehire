<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","@id":"https://10ml.com/careers/perfume-decanting-fulfilment-specialist#job","url":"https://10ml.com/careers/perfume-decanting-fulfilment-specialist","title":"Perfume Decanting & Fulfilment Specialist","description":"\u003cp>10ML decants every perfume itself and sells perfume decants and samples in 3ml, 10ml and 30ml sizes. You decant original designer and niche perfumes into decant bottles with precision and care, and pack orders that reach customers across Europe looking and smelling perfect.\u003c/p>\u003ch3>What you will do\u003c/h3>\u003cul>\u003cli>Decant perfumes accurately into 3ml, 10ml and 30ml decant bottles, following hygiene and quality standards\u003c/li>\u003cli>Label, inspect and pack orders by hand, carefully and on time\u003c/li>\u003cli>Keep stock counts, batches and bottle supplies accurate in the inventory system\u003c/li>\u003cli>Look after a clean, organised and safe workspace\u003c/li>\u003cli>Suggest improvements that make decanting and packing faster and better\u003c/li>\u003c/ul>\u003ch3>What you bring\u003c/h3>\u003cul>\u003cli>Experience in fulfilment, warehouse, laboratory, pharmacy, cosmetics or food production, or a strong wish to learn\u003c/li>\u003cli>Precision, a steady hand and real attention to detail\u003c/li>\u003cli>Reliability and a good pace during busy seasons\u003c/li>\u003cli>German or English at a working level\u003c/li>\u003cli>A love of perfume is a plus\u003c/li>\u003c/ul>\u003ch3>About 10ML\u003c/h3>\u003cp>10ML is a European perfume retailer headquartered in Dortmund, Germany. Founded in 2025, 10ML sells original designer and niche perfumes as 3ml, 10ml and 30ml perfume decants and samples. 10ML buys from authorized EU distributors and directly from the brands, and decants every perfume itself. 10ML says it has more than 100,000 customers.\u003c/p>\u003cp>Total annual revenue across all sales channels in 2026 is close to €21 million. 10ML's ARR is more than €10 million.\u003c/p>\u003ch3>What 10ML offers\u003c/h3>\u003cul>\u003cli>A salary at the top of the market, plus an annual performance bonus\u003c/li>\u003cli>Remote work anywhere in the EU (unless the role is on-site), or the Dortmund office if you prefer\u003c/li>\u003cli>30 days of paid holiday\u003c/li>\u003cli>€2,000 personal learning budget per year, plus conferences\u003c/li>\u003cli>A monthly perfume allowance to explore the 10ML catalogue of perfume decants\u003c/li>\u003cli>Top-spec laptop and the tools you ask for\u003c/li>\u003cli>Company pension contribution and, in Dortmund, a fully paid Deutschlandticket\u003c/li>\u003cli>Short decision paths, real ownership and budgets that match the ambition\u003c/li>\u003c/ul>\u003ch3>How to apply\u003c/h3>\u003cp>Send your CV and anything that shows your work (portfolio, links, results) to \u003cstrong>jobs@10ml.com\u003c/strong>, with the role title in the subject line. English is the working language; German is a plus unless the role says otherwise.\u003c/p>","datePosted":"2026-10-17","validThrough":"2027-01-15","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","@id":"https://10ml.com/#organization","name":"10ML","url":"https://10ml.com/","logo":"https://10ml.com/brand/icons/icon-512.png","sameAs":["https://www.instagram.com/try10ml/","https://www.tiktok.com/@try10ml","https://www.facebook.com/try10ML/","https://www.pinterest.com/10mlcom/","https://www.youtube.com/@try10ML","https://x.com/try10ML","https://www.threads.com/@try10ml","https://www.linkedin.com/company/10ml","https://www.wikidata.org/wiki/Q141735975","https://www.crunchbase.com/organization/10ml","https://wellfound.com/company/10ml","https://brandfetch.com/10ml.com","https://www.producthunt.com/@try10ml","https://www.eu-startups.com/directory/10ml/","https://www.fragrantica.com/@10ml.com","https://mastodon.social/@10ml","https://bsky.app/profile/try10ml.bsky.social","https://medium.com/@10ml","
