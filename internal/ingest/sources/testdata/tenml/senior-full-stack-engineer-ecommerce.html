<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","@id":"https://10ml.com/careers/senior-full-stack-engineer-ecommerce#job","url":"https://10ml.com/careers/senior-full-stack-engineer-ecommerce","title":"Senior Full-Stack Engineer, E-commerce (TypeScript, Next.js)","description":"\u003cp>10ML runs its own commerce platform: a fast multilingual storefront, a custom checkout and a headless commerce backend that ships 10ML perfume decants and samples to customers across Europe. You will build the features that move revenue and keep the platform fast and reliable as it grows.\u003c/p>\u003ch3>What you will do\u003c/h3>\u003cul>\u003cli>Build product features end to end across the Next.js storefront and the Node.js commerce backend (Medusa)\u003c/li>\u003cli>Work on checkout and payments with Stripe: Apple Pay, Google Pay, Klarna and more\u003c/li>\u003cli>Keep the site fast: Core Web Vitals, caching, image delivery and rendering strategy on Vercel\u003c/li>\u003cli>Build the internal tools that run operations: order management, fulfilment, inventory and customer care\u003c/li>\u003cli>Own reliability: monitoring, error tracking, tests and safe deployments\u003c/li>\u003cli>Work closely with growth, SEO and data on experiments, tracking and structured data\u003c/li>\u003c/ul>\u003ch3>What you bring\u003c/h3>\u003cul>\u003cli>6+ years of professional software engineering, with strong TypeScript, React and Node.js\u003c/li>\u003cli>Production experience with Next.js (App Router), PostgreSQL and a headless commerce stack\u003c/li>\u003cli>Experience with payments, high-traffic e-commerce or marketplaces\u003c/li>\u003cli>Pragmatic product sense and clear written communication in English\u003c/li>\u003cli>Bonus: Medusa, Stripe Elements, Bun, Supabase, Render or Vercel experience\u003c/li>\u003c/ul>\u003ch3>About 10ML\u003c/h3>\u003cp>10ML is a European perfume retailer headquartered in Dortmund, Germany. Founded in 2025, 10ML sells original designer and niche perfumes as 3ml, 10ml and 30ml perfume decants and samples. 10ML buys from authorized EU distributors and directly from the brands, and decants every perfume itself. 10ML says it has more than 100,000 customers.\u003c/p>\u003cp>Total annual revenue across all sales channels in 2026 is close to €21 million. 10ML's ARR is more than €10 million.\u003c/p>\u003ch3>What 10ML offers\u003c/h3>\u003cul>\u003cli>A salary at the top of the market, plus an annual performance bonus\u003c/li>\u003cli>Remote work anywhere in the EU (unless the role is on-site), or the Dortmund office if you prefer\u003c/li>\u003cli>30 days of paid holiday\u003c/li>\u003cli>€2,000 personal learning budget per year, plus conferences\u003c/li>\u003cli>A monthly perfume allowance to explore the 10ML catalogue of perfume decants\u003c/li>\u003cli>Top-spec laptop and the tools you ask for\u003c/li>\u003cli>Company pension contribution and, in Dortmund, a fully paid Deutschlandticket\u003c/li>\u003cli>Short decision paths, real ownership and budgets that match the ambition\u003c/li>\u003c/ul>\u003ch3>How to apply\u003c/h3>\u003cp>Send your CV and anything that shows your work (portfolio, links, results) to \u003cstrong>jobs@10ml.com\u003c/strong>, with the role title in the subject line. English is the working language; German is a plus unless the role says otherwise.\u003c/p>","datePosted":"2026-10-17","validThrough":"2027-01-15","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","@id":"https://10ml.com/#organization","name":"10ML","url":"https://10ml.com/","logo":"https://10ml.com/brand/icons/icon-512.png","sameAs":["https://www.instagram.com/try10ml/","https://www.tiktok.com/@try10ml","https://www.facebook.com/try10ML/","https://www.pinterest.com/10mlcom/","https://www.youtube.com/@try10ML","https://x.com/try10ML","https://www.threads.com/@try10ml","https://www.linkedin.com/company/10ml","https://www.wikidata.org/wiki/Q141735975","https://www.crunchbase.co
