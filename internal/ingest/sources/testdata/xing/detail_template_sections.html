 auf, eine lebenswerte Zukunft für nachfolgende Generationen zu schaffen. Je nach Projekt sind wir Berater, Umsetzer – oder beides – nachhaltiger, innovativer und wirtschaftlicher Lösungen für Immobilien, Industrie, Energie und Infrastruktur. In interdisziplinären Teams unterstützen unsere über 6.500 Mitarbeitenden an mehr als 80 Standorten weltweit unsere Kunden. Wir denken visionär und realistisch. Wir arbeiten eigenständig und im Team. Mit Leidenschaft und modernsten Technologien. We unite. Join us at Dreso and let’s create a world we want to live in.\u003C\u002Fp\u003E","responsibilityTitle":"Stellenbeschreibung","responsibilityContent":"\u003Cp\u003EBringen Sie Ihre Expertise als (Ober)Bauleiter:in ein und gestalten Sie mit uns die Zukunft der Industrie!\u003C\u002Fp\u003E\u003Cp\u003EWir treiben Innovation voran und realisieren für unsere Kunden hochkomplexe EPCM-Projekte. Von Halbleiter- und Batteriezellenfertigung über Automotive und Life Sciences bis hin zu Chemie, Kraftwerks- und Prozesstechnik – wir gestalten die Zukunft der Industrie.\u003C\u002Fp\u003E\u003Cp\u003EIhr \u003Cstrong\u003EHeimatstandort\u003C\u002Fstrong\u003E? Sie entscheiden! Ob Stuttgart, Frankfurt am Main, München, Hamburg, Leipzig, Dresden, Köln oder Berlin – wählen Sie den Standort, der am besten zu Ihnen passt. Dafür setzen wir eine \u003Cstrong\u003Ehohe Reisebereitschaft \u003C\u002Fstrong\u003Eund Lust auf abwechslungsreiche Herausforderungen voraus.\u003C\u002Fp\u003E\u003Cp\u003EIhr \u003Cstrong\u003EEinsatzort\u003C\u002Fstrong\u003E? Dort, wo Stahl, Beton und Ideen zusammenkommen – überwiegend auf der Baustelle.\u003C\u002Fp\u003E\u003Cul\u003E\n\u003Cli\u003EVerantwortliche Übernahme der Fachbauüberwachung im Bereich Elektro- oder Fernmeldetechnik für komplexe (Groß)Bauprojekte der Industrie\u003C\u002Fli\u003E\n\u003Cli\u003EFühren und Entwickeln der entsprechenden internen und externen Projektteams bzw. des Baustellenpersonals im unterstellten Bereich\u003C\u002Fli\u003E\n\u003Cli\u003ESicherstellen der Einhaltung der Projektziele, wirtschaftliches Abwickeln der Projekte innerhalb des vorgegebenen Honorarrahmens sowie Überwachung des Projektbudgets\u003C\u002Fli\u003E\n\u003Cli\u003ESicheres und fundiertes Anwenden des Kosten-, Nachtrags- und Änderungsmanagements\u003C\u002Fli\u003E\n\u003Cli\u003EMitwirken bei der Angebotserstellung, Organisation und Optimierung von Projektabläufen sowie Sicherstellen der Einhaltung aller Sicherheitsanforderungen\u003C\u002Fli\u003E\n\u003Cli\u003EMitarbeiterführung und -entwicklung, Moderation von Projektmeetings sowie Pflege der Beziehungen zum Kunden\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E","skillsTitle":"Qualifikationen","skillsContent":"\u003Cul\u003E\n\u003Cli\u003EAbgeschlossenes Studium der Fachrichtung Elektrotechnik oder Techniker-\u002FMeisterabschluss der Fachrichtung Elektrotechnik oder vergleichbar\u003C\u002Fli\u003E\n\u003Cli\u003EMehrjährige Erfahrung in der Abwicklung von Industrieprojekten, z.B. als Obermonteur:in, (Ober)Bauleiter:in, Projektleiter:in oder vergleichbar, idealerweise in den Branchen Halbleiter, Batterie, Life Science, Pharma, Chemie, Anlagenbau und\u002Foder Prozesstechnik\u003C\u002Fli\u003E\n\u003Cli\u003EErfahrung in der Führung von Projektteams und Nachunternehmern sowie eine ausgeprägte unternehmerische und kommunikative Denk- und Arbeitsweise\u003C\u002Fli\u003E\n\u003Cli\u003EBereitschaft 5 Tage vor Ort auf der Baustelle tätig zu sein\u003C\u002Fli\u003E\n\u003Cli\u003ESehr gute Deutsch- und gute Englischkenntnisse\u003C\u002Fli\u003E\n\u003Cli\u003ESichere Kenntnisse und Anwendung der VOB, HOAI und der weiteren gängigen Regelwerke des deutschen Bauwesens\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E","weOfferTitle":"Zusätzliche Informationen","weOfferContent":"\u003Cul\u003E\n\u003Cli\u003EZur Sicherstellung Ihrer \u003Cstrong\u003EWork-Life-Balance\u003C\u002Fstrong\u003E bieten wir die Möglichkeit zum mobilen Arbeiten\u003C\u002Fli\u003E\n\u003Cli\u003EIhre \u003Cstrong\u003Eberufliche und persönliche Entwicklung\u003C\u002Fstrong\u003E fördern wir durch individuelle Aus- und Weiterbildungen in der Drees &amp; Sommer - Academy\u003C\u002Fli\u003E\n\u003Cli\u003EIhre \u003Cstrong\u003EGesundheit\u003C\u002Fstrong\u003E unterstützen wir mit einem Bonus für sportlich Aktive oder einem Zuschuss zur Mitgliedschaft bei EGYM-Wellpass\u003C\u002Fli\u003E\n\u003Cli\u003EEine \u003Cstrong\u003Enachhaltige Mobilität\u003C\u002Fstrong\u003E fördern wir mit Jobrad-Leasing, ÖPNV-Zuschuss oder Firmenwagen (positionsabhängig)\u003C\u002Fli\u003E\n\u003Cli\u003EZusätzliche \u003Cstrong\u003Eattraktive Angebote \u003C\u002Fstrong\u003Emit Rabatten im Corporate-Benefits-Portal. Mitarbeitenden-Empfehlungsprogramm mit attraktiver Prämienregelung\u003C\u002Fli\u003E\n\u003Cli\u003EZur \u003Cstrong\u003EVereinbarkeit von Beruf und Familie\u003C\u002Fstrong\u003E bieten wir einen KITA-Zuschuss an. Darüber hinaus offerieren wir Zusatzleistungen für besondere private Ereignisse\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E","contactInfoTitle":null,"contactInfoContent":null,"headerImage":null,"footerImage":null,"videoUrls":{"__typename":"TemplateDataVideoUrls","youtube":null,"vimeo":null},"socialUrls":{"__typename":"TemplateDataSocialUrls","website":null,"facebook":null,"twitter":null,"youtube":null,"xing":null,"instagram":null,"pinterest":null,"tiktok":null,"kununu":null}},"discipline":{"__ref":"Discipline:1010.b48650"},"industry":{"__ref":"Industry:10000.b156f6"},"isReachRefreshed":false,"jobCode":"13f8bc6c-da49-4e29-9490-859de2864d68","keywords":["life","sciences","obermonteur","englischkenntnisse","angebotserstellung","projekt","berater","energie","techniker","gesundheit"],"language":"de","matchingHighlights({\"context\":\"postings\"})":null,"remoteOptions":["PARTLY_REMOTE"],"screenOutCriteria":{"__typename":"JobScreenOutCriteria","euWorkEligibility":null,"languageSkillsGerman":null},"serviceOfferingGroup":0,"userInteractions":{"__typename":"Jo
