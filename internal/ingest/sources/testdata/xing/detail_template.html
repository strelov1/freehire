:jobs:posting:146728533.0ac2af","redirectsToThirdPartyUrl":false,"paid":true,"topJob":false,"location":{"__typename":"JobLocation","city":"Wien","street":"Jakov-Lind-Straße 2\u002F2\u002F2","cityId":2761369,"zipCode":"1020","region":"Bundesland Wien","country":{"__typename":"Country","countryCode":"AT","localizationValue":"Österreich"}},"locations":[{"__typename":"JobLocation","city":"Wien","street":"Jakov-Lind-Straße 2\u002F2\u002F2","zipCode":"1020","region":"Bundesland Wien","country":{"__typename":"Country","countryCode":"AT"}}],"employmentType":{"__ref":"EmploymentType:FULL_TIME.ef2fe9"},"companyInfo":{"__typename":"JobCompanyInfo","companyNameOverride":"Delegate Technology GmbH","company":null},"salary":{"__typename":"SalaryRange","currency":"EUR","minimum":53802,"maximum":53803},"application":{"__typename":"JobXingCustomApplication","applyServiceSettings":{"__typename":"ApplyServiceSettings","loggedoutApplicationsEnabled":true}},"activatedAt":"2025-11-20T05:53:52Z","careerLevel":{"__ref":"CareerLevel:3.2ebf16"},"description":{"__typename":"TemplateData","sectionTitleColor":null,"genericDescription":"\u003Cp\u003E\u003Cstrong\u003EWas macht das Delegate Team?\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n\u003Cp\u003EWir, die Delegate-Group, sind ein Unternehmen mit über 80 Mitarbeiter:innen und gehören zu den weltweiten Marktführern für Softwarelösungen, Dienstleistungen und Consulting in den Bereichen der professionellen Gastronomie, Catering und Healthcare Segment. Die gesamte Prozesskette vom Einkauf, über die Rezepturverwaltung, Menü- und Produktionsplanung bis hin zur Erfassung der Menüwünsche von Patientinnen und Patienten im Healthcare Bereich, wird durch die modulare Delegate - Lösung unterstützt.\u003C\u002Fp\u003E\n\u003Ch2\u003EAufgaben\u003C\u002Fh2\u003E\n\u003Cp\u003E\u003Cstrong\u003EWas machst du als Senior Full Stack Developer bei Delegate?\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n\u003Cp\u003EAls Senior Full Stack Developer entwickelst du kontinuierlich unsere Foodservice-Software weiter und sorgst dafür, dass alle Prozesse der Gastronomie, Catering und Healthcare Branche abgebildet sind. Du arbeitest an der Schnittstelle zwischen Frontend und Backend und bist verantwortlich für die Architektur und Implementierung neuer Features.\u003C\u002Fp\u003E\n\u003Cp\u003EIn enger Zusammenarbeit mit unseren anderen Superheld:innen (Produktteams) optimierst du bestehende Lösungen und implementierst neue Funktionalitäten. Du bist zudem Ansprechpartner für technische Fragen und unterstützt unsere Kollegen und Kunden bei der Umsetzung von Anforderungen. \u003C\u002Fp\u003E\n\u003Cp\u003E\u003Cstrong\u003EEiniges davon ist neu für dich?\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n\u003Cp\u003EKein Problem. Neue spannende Themen zu lernen und neue Technologien auszuprobieren um dich weiterzuentwickeln, dafür hast du Raum bei Delegate.\u003C\u002Fp\u003E\n\u003Ch2\u003EQualifikation\u003C\u002Fh2\u003E\n\u003Cp\u003E\u003Cstrong\u003EWas brauchst du für deine Mission?\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n\u003Cp\u003E\u003Cstrong\u003EMUST HAVES\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n\u003Cul\u003E\n\u003Cli\u003EDu entwickelst ASP.NET basierte Webapplikationen und Webservices\u003C\u002Fli\u003E\n\u003Cli\u003EDu bist sattelfest in der Entwicklung von .NET basierter Business Logik\u003C\u002Fli\u003E\n\u003Cli\u003EDu hast Spaß am technischen Detaildesign und an der Implementierung neuer Funktionalitäten, mit einem Fokus auf robusten, wartbaren Code unter Einhaltung unserer Programmierrichtlinien.\u003C\u002Fli\u003E\n\u003Cli\u003EDu arbeitest gerne an Fehleranalysen und -korrekturen basierend auf Defect Reports\u003C\u002Fli\u003E\n\u003Cli\u003EDu hast sehr gute Kenntnisse von C#, ASP.NET, RESTful APIs, HTML, JavaScript\u003C\u002Fli\u003E\n\u003Cli\u003EDu hast Erfahrung in der Entwicklung von SQL basierten Datenbankapplikationen speziell Microsoft SQL Server und Oracle\u003C\u002Fli\u003E\n\u003Cli\u003EDu besitzt sehr gute schriftliche und mündliche Englischkenntnisse\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003Cp\u003E\u003Cstrong\u003ENICE TO HAVE\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n\u003Cul\u003E\n\u003Cli\u003EDu hast Erfahrung mit gängigen Browserframeworks wie jQuery oder Bootstrap\u003C\u002Fli\u003E\n\u003Cli\u003EDu hast Erfahrung oder Kenntnisse im Bereich Warenwirtschaft oder in verwandten Bereichen.\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003Cp\u003E\u003Cstrong\u003ESCHÖN WENN DU FOLGENDE BEGRIFFE SCHON MAL GEHÖRT HAST\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n\u003Cp\u003EMicroservices-Architektur, CI\u002FCD, DevOps-Tools, Unit-Tests, Automatisierung von Deployment-Prozessen, Application Insights \u002F Monitoring-Tools, Business Requirement, Feature Requests\u003C\u002Fp\u003E\n\u003Ch2\u003EBenefits\u003C\u002Fh2\u003E\n\u003Cp\u003E\u003Cstrong\u003EWie unterstützen wir dich bei deiner Mission?\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n\u003Cul\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EEine Mission braucht Raum:\u003C\u002Fstrong\u003E Den hast du in unserer zentralen Bürolage Praterstern mit deinem persönlichen Arbeitsplatz, gerne kannst du aber auch teilweise von zu Hause arbeiten. Auch dein Vierbeiner ist bei uns unter Einhaltung der Dog Policy herzlich willkommen. Last but not least gibt es bei uns einen Erholungsraum in dem du deinen Kopf frei bekommen und deine Batterien wieder aufladen kannst.\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EWir sind ein Team:\u003C\u002Fstrong\u003E Wir gehen wertschätzend miteinander um. Jede:r hat eine Stimme und es wird darauf geachtet, dass auch leise Stimmen gehört werden.\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EWir nehmen uns Zeit füreinander:\u003C\u002Fstrong\u003E regelmäßiger Brunch, jährliche Firmenfeier, After Work Parties und Teambuilding Events\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EWir wissen, dass man nicht nur von Luft und Liebe Leben kann\u003C\u002Fstrong\u003E, deshalb gibt es bei uns kostenlose Getränke, Obst, eine Müsli Bar und eine Coffee Lounge. Wenn dir das nicht reicht, gibt es in der Nähe zahlreiche Geschäfte und Restaurants.\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003Cp\u003ESolltest du dich mit deinen Kenntnissen, Stärken und Erfahrungen in der Stellenausschreibung wiederfinden und möchtest Teil unseres Superheld:innen Teams werden, dann bewirb dich bei uns!\u003C\u002Fp\u003E\n\u003Cp\u003EWir freuen uns auf deine \u003Cstrong\u003EBewerbung inklusive Gehaltswunsch\u003C\u002Fstrong\u003E und \u003Cstrong\u003Efrühestmöglichem Eintrittstermin\u003C\u002Fstrong\u003E. Das kollektivvertragliche Mindestgehalt für diese Position (Vollzeit) beträgt brutto EUR 53.802,00 pro Jahr. Basierend auf deiner Qualifikation und Erfahrung ist aber selbstverständlich ein marktkonformes Gehalt vorgesehen.\u003C\u002Fp\u003E","companyDescriptionTitle":null,"companyDescriptionContent":null,"responsibilityTitle":null,"responsibilityContent":null,"skillsTitle":null,"skillsContent":null,"weOfferTitle":null,"weOfferContent":null,"contactInfoTitle":null,"contactInfoContent":null,"headerImage":null,"footerImage":null,"videoUrls":{"__typename":"TemplateDataVideoUrls","youtube":null,"vimeo":null},"socialUrls":{"__typename":"TemplateDataSocialUrls","website":"http:\u002F\u002Fwww.delegate-group.com","facebook":null,"twitter":null,"youtube":null,"xing":null,"instagram":null,"pinterest":null,"tiktok":null,"kununu":null}},"discipline":{"__ref":"Discipline:1011.6cf3f7"},"industry":{"__ref":"Industry:110100.b0d27f"},"isReachRefreshed":false,"jobCode":"13936189,71ca0ee38774aa04cc60","keywords":["delegate technology gmbh","wien","bundesland wien","österreich"],"language":"de","matchingHighlights({\"context\":\"postings\"})":null,"remoteOptions":["PARTLY_REMOTE"],"screenOutCriteria":{"__typename":"JobScreenOutCriteria","euWorkEligibility":null,"languageSkillsGerman":null},"serviceOfferingGroup":0,"userInterac
