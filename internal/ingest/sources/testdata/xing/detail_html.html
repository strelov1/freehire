:"Country","localizationValue":"Deutschland"}},"userContext":null},"CareerLevel:3.2ebf16":{"__typename":"CareerLevel","id":"3.2ebf16","localizationValue":"Mit Berufserfahrung"},"Discipline:1011.6cf3f7":{"__typename":"Discipline","id":"1011.6cf3f7","localizationValue":"IT und Softwareentwicklung"},"Industry:160000.909d04":{"__typename":"Industry","id":"160000.909d04","localizationValue":"Beratung, Consulting"},"VisibleJob:158121457.017e35":{"__typename":"VisibleJob","activeUntil":"2027-03-26T12:43:26Z","id":"158121457.017e35","slug":"berlin-payments-architect-all-genders-158121457","prioritized":false,"summaryV2":null,"url":"https:\u002F\u002Fwww.xing.com\u002Fjobs\u002Fberlin-payments-architect-all-genders-158121457","title":"Payments Architect (all genders)","refreshedAt":"2026-10-19T19:15:45Z","globalId":"surn:x-xing:jobs:posting:158121457.017e35","redirectsToThirdPartyUrl":false,"paid":false,"topJob":false,"location":{"__typename":"JobLocation","city":"Berlin","street":null,"cityId":2950159,"zipCode":null,"region":"Land Berlin","country":{"__typename":"Country","countryCode":"DE","localizationValue":"Deutschland"}},"locations":[{"__typename":"JobLocation","city":"Berlin","street":null,"zipCode":null,"region":"Land Berlin","country":{"__typename":"Country","countryCode":"DE"}}],"employmentType":{"__ref":"EmploymentType:FULL_TIME.ef2fe9"},"companyInfo":{"__typename":"JobCompanyInfo","companyNameOverride":"Accenture Dienstleistungen GmbH","company":{"__ref":"Company:25948.0e87ae"}},"salary":{"__typename":"SalaryEstimate","currency":"EUR","minimum":70000,"maximum":102500,"median":89500},"application":{"__typename":"JobXingApplication","applyServiceSettings":{"__typename":"ApplyServiceSettings","loggedoutApplicationsEnabled":true}},"activatedAt":"2026-10-19T19:15:45Z","careerLevel":{"__ref":"CareerLevel:3.2ebf16"},"description":{"__typename":"HtmlDescription","content":"\u003CDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CP\u003EGestalte die Zukunft des Zahlungsverkehrs aktiv mit. Von Digitalem Euro über Instant Payments bis hin zu KI-gestützten Payment-Lösungen entwickelst du gemeinsam mit führenden Finanzinstituten die Architekturen von morgen.\u003C\u002FP\u003E\u003CP\u003E\u003CB\u003EDeine Mission\u003C\u002FB\u003E\u003C\u002FP\u003E\u003CP\u003EAls Payments Architect verbindest du strategische Beratung mit tiefgreifender Technologieexpertise. Du entwickelst moderne Zahlungsverkehrsarchitekturen für Banken, Zentralbanken und Finanzdienstleister und begleitest deren Transformation hin zu skalierbaren, cloud-nativen und zukunftsfähigen Plattformen. Dabei arbeitest du eng mit Enterprise Architekt:innen, Fachbereichen und Technologieentscheidern zusammen und trägst dazu bei, innovative Payment-Lösungen erfolgreich umzusetzen.\u003C\u002FP\u003E\u003CP\u003EBei Accenture gestaltest du dir selbst das Umfeld, in dem du aufgehst – mit Arbeitsweisen, die zu dir passen. Du bleibst flexibel. Und wirst Teil eines Teams voller einzigartiger Menschen, die gemeinsam etwas bewegen.\u003C\u002FP\u003E\u003CP\u003E\u003CB\u003EDas erwartet dich\u003C\u002FB\u003E\u003C\u002FP\u003E\u003CUL\u003E\u003CLI\u003E\u003CB\u003EDu übersetzt komplexe Anforderungen in technische Leitplanken.\u003C\u002FB\u003E Du analysierst fachliche, regulatorische und technologische Anforderungen im Zahlungsverkehr und leitest daraus gemeinsam mit Kunden belastbare Anforderungen für Zielarchitekturen und IT-Landschaften ab.\u003C\u002FLI\u003E\u003CLI\u003E\u003CB\u003EDu entwickelst zukunftsfähige Payment-Architekturen.\u003C\u002FB\u003E Du konzipierst moderne Lösungsarchitekturen für Zahlungsverkehrsplattformen und konkretisierst diese durch Architekturdiagramme, API-Designs und Integrationskonzepte für komplexe Bankenumgebungen.\u003C\u002FLI\u003E\u003CLI\u003E\u003CB\u003EDu bewertest Technologie- und Architekturentscheidungen.\u003C\u002FB\u003E Du vergleichst Lösungsoptionen, analysierst Auswirkungen auf bestehende Systemlandschaften und schaffst fundierte Entscheidungsgrundlagen für strategische Technologieinvestitionen.\u003C\u002FLI\u003E\u003CLI\u003E\u003CB\u003EDu gestaltest die Payment-Themen von morgen.\u003C\u002FB\u003E Du arbeitest an innovativen Lösungen rund um Digitalen Euro, Instant Payments, Open Finance, Wallet-Lösungen wie EPI\u002FWero sowie KI-gestützte Zahlungsprozesse.\u003C\u002FLI\u003E\u003CLI\u003E\u003CB\u003EDu begleitest Architektur bis zur Umsetzung.\u003C\u002FB\u003E Gemeinsam mit Entwicklungsteams stellst du sicher, dass Architekturentscheidungen erfolgreich implementiert werden und entwickelst die Zielarchitektur auf Basis praktischer Erfahrungen kontinuierlich weiter.\u003C\u002FLI\u003E\u003CLI\u003E\u003CB\u003EDu übernimmst Verantwortung und gestaltest aktiv mit.\u003C\u002FB\u003E Du arbeitest in anspruchsvollen Transformationsprojekten und entwickelst schrittweise eigene Verantwortungsbereiche innerhalb unserer internationalen Payments Community.\u003C\u002FLI\u003E\u003C\u002FUL\u003E\u003C\u002FDIV\u003E\u003C\u002FDIV\u003E\u003C\u002FDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CP\u003E\u003CB\u003EDarauf freuen wir uns\u003C\u002FB\u003E\u003C\u002FP\u003E\u003CUL\u003E\u003CLI\u003EErfolgreich abgeschlossenes Studium in einem relevanten Fachbereich, vorzugsweise mit technischem oder naturwissenschaftlichem Schwerpunkt.\u003C\u002FLI\u003E\u003CLI\u003EMindestens fünf Jahre Erfahrung in Architektur, Solution Design oder technischer Beratung im Payments-Umfeld.\u003C\u002FLI\u003E\u003CLI\u003EFundierte Kenntnisse moderner Architekturansätze wie API-First, Microservices, Event-Streaming sowie hochverfügbare Integrations- und Plattformarchitekturen.\u003C\u002FLI\u003E\u003CLI\u003EErfahrung mit Cloud-Technologien (AWS, Azure oder GCP) sowie Verständnis von DevSecOps-Prinzipien und modernen Softwareentwicklungsprozessen.\u003C\u002FLI\u003E\u003CLI\u003ESouveräne Kommunikation mit unterschiedlichen Stakeholdern in deutscher und englischer Sprache.\u003CBR\u003E\u003C\u002FLI\u003E\u003C\u002FUL\u003E\u003CP\u003E\u003CB\u003EWas wir dir bieten\u003C\u002FB\u003E\u003C\u002FP\u003E\u003CUL\u003E\u003CLI\u003EDie Möglichkeit, die Zukunft des Zahlungsverkehrs aktiv mitzugestalten – von Digitalem Euro und Wallet-Lösungen über Instant Payments und Open Finance bis hin zum Einsatz von KI in modernen Payment-Landschaften.\u003C\u002FLI\u003E\u003CLI\u003EAnspruchsvolle Strategie- und Transformationsprojekte bei führenden Finanzinstituten und Zentralbanken.\u003C\u002FLI\u003E\u003CLI\u003EIndividuelle Weiterbildungs-, Mentoring- und Zertifizierungsmöglichkeiten, beispielsweise im Bereich Cloud- oder Enterprise-Architektur.\u003C\u002FLI\u003E\u003CLI\u003EFrühzeitige Übernahme von Verantwortung sowie hervorragende Entwicklungsmöglichkeiten innerhalb eines internationalen Expert:innen-Netzwerks.\u003C\u002FLI\u003E\u003CLI\u003EFlexible Arbeitsmodelle mit der Möglichkeit, remote, an einem Accenture-Standort oder direkt beim Kunden zu arbeiten.\u003CBR\u003E\u003C\u002FLI\u003E\u003C\u002FUL\u003E\u003CP\u003E\u003CB\u003EDie Accenture-Kultur: Hier machst DU den Unterschied\u003C\u002FB\u003E\u003C\u002FP\u003E\u003CP\u003EDeine Fähigkeiten, dein Naturell und deine Ambitionen machen dich einzigartig. Und wenn die unterschiedlichsten Talente, Stärken und Sichtweisen aufeinandertreffen, entsteht etwas Großartiges: Ideen, die in der Welt etwas bewegen. Deshalb setzen wir bei Accenture auf Diversität und freie Entfaltung. Schaffe dir ein Arbeitsumfeld, in dem du aufgehst. Mit Aufgaben, die dir am Herzen liegen. Mit einem Workload, der zu dir passt. Und mit einer Arbeitsweise, die sich an deinen Zielen orientiert. Wie du dich vernetzen, weiterbilden und persönlich wachsen willst, liegt bei dir. Es ist deine Karriere. Wir helfen dir, sie so zu gestalten, wie du es dir vorstellst.\u003C\u002FP\u003E\u003CP\u003E\u003CB\u003EDein Kontakt\u003C\u002FB\u003E\u003C\u002FP\u003E\u003CP\u003ENoch Fragen offen? Schreib deiner persönlichen Ansprechpartnerin Claudia unter recruiting@example.com.\u003CBR\u003E \u003C\u002FP\u003E\u003CP\u003EWir freuen uns auf dich!\u003CBR\u003E\u003CBR\u003E  \u003CB\u003E#LI-MP\u003C\u002FB\u003E \u003C\u002FP\u003E\u003C\u002FDIV\u003E\u003C\u002FDIV\u003E\u003C\u002FDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CP\u003EKronberg\u003C\u002FP\u003E\u003CP\u003EBerlin\u003C\u002FP\u003E\u003CP\u003EDusseldorf\u003C\u002FP\u003E\u003CP\u003EHamburg\u003C\u002FP\u003E\u003CP\u003EMunich\u003C\u002FP\u003E\u003CP\u003ESiegburg\u003C\u002FP\u003E\u003CP\u003EStuttgart\u003C\u002FP\u003E\u003C\u002FDIV\u003E\u003C\u002FDIV\u003E\u003C\u002FDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CH3\u003EStatement zur Chancengleichheit\u003C\u002FH3\u003E\u003CH3\u003E \u003C\u002FH3\u003E\u003CP\u003EWir suchen Menschen mit eigenem Lebensentwurf und ungewöhnlichem Lebenslauf. Individuell statt uniform. Vielfalt statt Norm. Diversität ist unsere Stärke und eine wesentliche Komponente der Unternehmenskultur von Accenture. Wir fördern ein integratives und offenes Arbeitsumfeld, in dem sich jeder so zeigen kann, wie er ist. Bei Accenture sind alle Bewerber:innen willkommen: unabhängig von Herkunft, Nationalität, Glaube, Behinderung, Alter, Familienstand, Partnerschaftsstatus, sexueller Orientierung, Geschlecht und anderen gesetzlich geschützten Gründen.\u003C\u002FP\u003E\u003C\u002FDIV\u003E\u003C\u002FDIV\u003E\u003C\u002FDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CDIV\u003E\u003CP\u003EWe work with one shared purpose: to deliver on the promise of technology and human ingenuity. Every day, more than 775,000 of us help our stakeholders continuously reinvent. Together, we drive positive change and deliver value to our clients, partners, shareholders, communities, and each other.\u003C\u002FP\u003E\u003CP\u003EWe believe that delivering value requires innovation, and innovation thrives in an inclusive and diverse environment. We actively foster a work
