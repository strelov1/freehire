ch i ambitnych, kt\u00f3rzy chc\u0105 podnosi\u0107 swoje umiej\u0119tno\u015bci i rozwija\u0107 si\u0119 razem z nami. Od ponad 30 lat tworzymy rozwi\u0105zania IT, a nasz\u0105 si\u0142\u0105 jest zesp\u00f3\u0142 ponad 700 specjalist\u00f3w. Jeste\u015bmy stabilnym pracodawc\u0105, oferujemy tak\u017ce wiele mo\u017cliwo\u015bci rozwoju oraz aktywnie wspieramy pasje naszych pracownik\u00f3w. Zach\u0119camy r\u00f3wnie\u017c do odwiedzenia naszej strony&nbsp;<a class=\"editor-link\" href=\"http://www.kamsoft.pl\" target=\"_blank\" rel=\"nofollow noreferrer noopener\">www.kamsoft.pl</a>.</p><p class=\"MsoNormal\"><strong>G\u0142\u00f3wne zadania:</strong></p><ul><li><p class=\"editor-paragraph\">Tworzenie rozwi\u0105za\u0144 w ramach dzia\u0142u R&amp;D,</p></li><li><p class=\"editor-paragraph\">Tworzenie prototyp\u00f3w i weryfikacji koncepcji (Proof of concept),</p></li><li><p class=\"editor-paragraph\">Rozw\u00f3j i utrzymanie platform integracyjnych dla farmacji i medycyny,</p></li><li><p class=\"editor-paragraph\">Wsp\u00f3\u0142praca z innymi zespo\u0142ami w procesie wytwarzania oprogramowania.</p></li></ul><p class=\"editor-paragraph\"><strong>Wymagania:</strong></p><ul><li><p class=\"editor-paragraph\">Co najmniej roczne do\u015bwiadczenie komercyjne w programowaniu,</p></li><li><p class=\"editor-paragraph\">Znajomo\u015bci in\u017cynierii i technik programowania \u2013 programowanie obiektowe i funkcyjne,</p></li><li><p class=\"editor-paragraph\">Znajomo\u015b\u0107 wzorc\u00f3w projektowych,</p></li><li><p class=\"editor-paragraph\">Dobra znajomo\u015b\u0107 .NET, .NET Core,</p></li><li><p class=\"editor-paragraph\">Dobra znajomo\u015b\u0107 SQL oraz baz danych (PostgreSQL, Oracle),</p></li><li><p class=\"editor-paragraph\">Znajomo\u015b\u0107 REST API, JSON,</p></li><li><p class=\"editor-paragraph\">Znajomo\u015b\u0107 repozytori\u00f3w kodu: GIT, Gitlab/Github lub DevOps,</p></li><li><p class=\"editor-paragraph\">Zdolno\u015b\u0107 szybkiego uczenia si\u0119 i rozwi\u0105zywania nowych zada\u0144,</p></li><li><p class=\"editor-paragraph\">Umiej\u0119tno\u015b\u0107 analitycznego my\u015blenia i pracy w zespole.</p></li></ul><p class=\"editor-paragraph\"><strong>Mile widziane:</strong></p><ul><li><p class=\"editor-paragraph\">Do\u015bwiadczenie w r\u00f3\u017cnych j\u0119zykach programowania i frameworkach, np.: java, Go, TypeScript,</p></li><li><p class=\"editor-paragraph\">Do\u015bwiadczenie w pracy z wykorzystaniem rozwi\u0105za\u0144 chmurowych (Microsoft Azure), Docker, Kubernetes,</p></li><li><p class=\"editor-paragraph\">Do\u015bwiadczenie w automatyzacji proces\u00f3w rozwoju, wdro\u017cenia i testowania \u2013 narz\u0119dzi ci\u0105g\u0142ej integracji i wdra\u017cania (CI/CD),</p></li><li><p class=\"editor-paragraph\">Znajomo\u015b\u0107 zagadnie\u0144 zwi\u0105zanych z monitorowaniem i optymalizacj\u0105 us\u0142ug o du\u017cym obci\u0105\u017ceniu i wysokim poziomie dost\u0119pno\u015bci.</p></li></ul><p class=\"editor-paragraph\"><strong>Oferujemy:</strong></p><p class=\"editor-paragraph\">Pracuj\u0105c u nas, zyskujesz nie tylko stabilne zatrudnienie, przyjazn\u0105 atmosfer\u0119, czy mo\u017cliwo\u015b\u0107 wsp\u00f3\u0142pracy ze \u015bwietnymi specjalistami, ale tak\u017ce mo\u017cesz skorzysta\u0107 z ca\u0142ego katalogu r\u00f3\u017cnych benefit\u00f3w, aktywno\u015bci i mo\u017cliwo\u015bci rozwojowych, kt\u00f3re wspomagaj\u0105 obszary:</p><ul><li><p class=\"editor-paragraph\"><em>Zdrowie:</em>&nbsp;prywatne ubezpieczenie medyczne, prywatne ubezpieczenie na \u017cycie</p></li><li><p class=\"editor-paragraph\"><em>Rozw\u00f3j:</em>&nbsp;mo\u017cliwo\u015b\u0107 udzia\u0142u w szkoleniach wewn\u0119trznych, zewn\u0119trznych i konferencjach,</p></li><li><p class=\"editor-paragraph\"><em>Rozrywka</em>: imprezy integracyjne, sportowe, kr\u0119gle, imprezy rodzinne: Miko\u0142ajki, Dni Dziecka, konkursy firmowe</p></li><li><p class=\"editor-paragraph\"><em>Sport</em>: karty MultiSport, dofinansowanie do sportu i rekreacji</p></li><li><p class=\"editor-paragraph\"><em>Przysz\u0142o\u015b\u0107:</em>&nbsp;Pracowniczy Program Emerytalny</p></li><li><p class=\"editor-paragraph\"><em>I inne</em>: abonament telefoniczny i internetowy, Zak\u0142adowy Fundusz Socjalny, Kafeteria Benefit\u00f3w, bezp\u0142atny parking firmowy, wyjazdy zagraniczne.</p></li><li><p class=\"editor-paragraph\">Mo\u017cliwo\u015b\u0107 pracy zdalnej.</p></li></ul>\n82:T670,W celu spe\u0142nienia obowi\u0105zku informacyjnego okre\u015blonego w art. 13 RODO KAMSOFT S.A. udost\u0119pni\u0142a serwis informacyjny pod adresem: www.kamsoft.pl/daneosobowe, w ramach kt\u00f3rego znajduj\u0105 si\u0119 informacje dotycz\u0105ce przetwarzania danych osobowych przez KAMSOFT S.A.\nPonadto KAMSOFT S.A. informuje, i\u017c:\n1. Podanie danych osobowych jest dobrowolne, ale konieczne dla wzi\u0119cia udzia\u0142u procesie rekrutacyjnym, a w przypadku wyra\u017cenia na to zgody - r\u00f3wnie\u017c dalszych procesach rekrutacyjnych.\n2. Podstaw\u0105 prawn\u0105 przetwarzania danych osobowych wskazanych w katalogu danych osobowych, kt\u00f3re pracodawca, zgodnie z Kodeksem Pracy, mo\u017ce \u017c\u0105da\u0107 od osoby ubiegaj\u0105cej si\u0119 o prac\u0119 jest art. 6 ust. 1 lit. c RODO oraz art. 9 ust.2 lit. h RODO. W pozosta\u0142ych przypadkach podstaw\u0105 prawn\u0105 przetwarzania danych jest zgoda osoby, kt\u00f3rej dane dotycz\u0105 art. 6 ust. 1 lit. a RODO i art. 9 ust. 2 lit. a RODO.\n3. Dane osobowe b\u0119d\u0105 przetwarzane przez okres nie d\u0142u\u017cszy ni\u017c czas trwania procesu rekrutacji. W razie wyra\u017cenia zgody na przetwarzanie danych osobowych r\u00f3wnie\u017c w dalszych procesach rekrutacyjnych, dane osobowe b\u0119d\u0105 przetwarzane przez czas niezb\u0119dny dla realizacji ww. cel\u00f3w, jednak nie d\u0142u\u017cej ni\u017c do momentu wycofania zgody przez osob\u0119, kt\u00f3rej dane dotycz\u0105.\n4. Odbiorcami danych osobowych mog\u0105 by\u0107 dostawcy rozwi\u0105za\u0144 informatycznych m.in. Microsoft Corporation. Dodatkowo KAMSOFT S.A. informuje, \u017ce dane osobowe b\u0119d\u0105 przetwarzane w ramach Europejskiego Obszaru Gospodarczego. Przy czym, KAMSOFT S.A. mo\u017ce przekazywa\u0107 dane poza ten obszar pod warunkiem, \u017ce transfer taki b\u0119dzie odbywa\u0107 si\u0119 zgodnie z zasadami RODO.\n"])</script></body></html>
