nienie czystych, l\u015bni\u0105cych i bezpiecznych biur swojemu klientowi. Dzia\u0142a w najwi\u0119kszych miastach Polski, obs\u0142uguj\u0105c ponad 200 klient\u00f3w abonamentowych, w tym firmy takie jak Tarkett, Cellnex, Swatch Group czy Benefit Systems. Firma dba o \u015brodowisko, stosuj\u0105c ekologiczne metody i \u015brodki czysto\u015bci, a tak\u017ce wspiera sadzenie las\u00f3w. Jej warto\u015bci to zesp\u00f3\u0142, ekologia, empatia, komunikacja, uczciwo\u015b\u0107 i wp\u0142yw na \u015brodowisko oraz otoczenie biznesowe.\",\"openToHireUkrainians\":false,\"multilocation\":[{\"slug\":\"fresh-office-specjalista-ds-rozwoju-sprzedazy--krakow-sales-uslugi-profesjonalne\",\"city\":\"Krak\u00f3w\",\"latitude\":50.0655751,\"longitude\":19.9754717,\"street\":\"Fabryczna 20A\"},{\"slug\":\"fresh-office-specjalista-ds-rozwoju-sprzedazy--wroclaw-sales-uslugi-profesjonalne\",\"city\":\"Wroc\u0142aw\",\"latitude\":51.10929480000001,\"longitude\":17.0386019,\"street\":\"Fabryczna 20 A, Krak\u00f3w\"},{\"slug\":\"fresh-office-specjalista-ds-rozwoju-sprzedazy--warszawa-sales-uslugi-profesjonalne-d24501b0\",\"city\":\"Warszawa\",\"latitude\":52.2396204,\"longitude\":20.9825375,\"street\":\"Skwer Kardyna\u0142a Stefana Wyszy\u0144skiego 5/34\"}],\"videoUrl\":null,\"bannerUrl\":null,\"isOfferActive\":true,\"expiredAt\":\"2026-10-29T22:59:59.999999Z\",\"countryCode\":\"PL\",\"offerParent\":{\"slug\":\"fresh-office-specjalista-ds-rozwoju-sprzedazy--krakow-sales-uslugi-profesjonalne\"},\"type\":\"null\",\"languages\":[{\"code\":\"pl\",\"level\":\"C2\"},{\"code\":\"en\",\"level\":\"B1\"}],\"guid\":\"41fd385d-d930-4e1a-8aaf-a73fe80ccc5a\",\"hybridWorkSchedule\":{\"officeDays\":2,\"remoteDays\":3}}}]}]\n82:T1b27,<p class=\"editor-paragraph\"><strong>Jeste\u015bmy Fresh Office \ud83c\udf4b - po prostu czysto!&nbsp;\ud83d\udd1d</strong></p><p class=\"editor-paragraph\">Tworzymy czyste, bezpieczne i ekologiczne miejsca pracy dla ponad 200 abonamentowych klient\u00f3w premium w ca\u0142ej Polsce. Chronimy tysi\u0105ce pracownik\u00f3w przed kurzem, brudem i bakteriami. Dzi\u0119ki naszym us\u0142ugom, biura takich firm jak Tarkett, Swatch, Hays czy Benefit Systems&nbsp;s\u0105 nie tylko l\u015bni\u0105ce, ale te\u017c przyjazne dla \u015brodowiska. Stawiamy na jako\u015b\u0107, szacunek i nowoczesne podej\u015bcie do utrzymania czysto\u015bci.&nbsp;</p><p class=\"editor-paragraph\">Do naszego zespo\u0142u poszukujemy osoby na stanowisko: \u27a1\ufe0f<strong> Specjalista ds. Rozwoju Sprzeda\u017cy</strong></p><p class=\"editor-paragraph"])</script><script>self.__next_f.push([1,"\"><strong>\ud83d\udca1 Tw\u00f3j zakres obowi\u0105zk\u00f3w:</strong></p><ul><li><p class=\"editor-paragraph\">Budowanie nowego biznesu - aktywne&nbsp;pozyskiwanie klient\u00f3w zainteresowanych profesjonalnym utrzymaniem czysto\u015bci biur i biurowc\u00f3w.</p></li><li><p class=\"editor-paragraph\">Prowadzenie ca\u0142ego procesu od prospectingu a\u017c po dopi\u0119t\u0105 umow\u0119.&nbsp;</p></li><li><p class=\"editor-paragraph\">Obs\u0142uga lead\u00f3w inboundowych i outboundowych (b\u0119dziesz mia\u0142 wsparcie dzia\u0142u marketingu).</p></li><li><p class=\"editor-paragraph\">Wsp\u00f3\u0142praca z zespo\u0142em marketingu w celu ci\u0105g\u0142ego doskonalenia naszej komunikacji online i zwi\u0119kszania efektywno\u015bci dzia\u0142a\u0144 marketingowych.&nbsp;</p></li></ul><p class=\"editor-paragraph\"><strong>\ud83d\udca1 Nasze wymagania:</strong></p><ul><li><p class=\"editor-paragraph\">Do\u015bwiadczenie w boju - przez minimum 2 lata pozyskiwa\u0142e\u015b klient\u00f3w b2b. Dodatkowym atutem b\u0119dzie znajomo\u015b\u0107 specyfiki sprzeda\u017cy us\u0142ug sprz\u0105tania lub wsp\u00f3\u0142praca z dzia\u0142ami administracji.&nbsp;</p></li><li><p class=\"editor-paragraph\">Umiej\u0119tno\u015bci komunikacyjne - potrafisz dogada\u0107 si\u0119 z ka\u017cdym typem cz\u0142owieka. Je\u015bli masz do\u015bwiadczenie w kontaktach z Office Managerami lub Dyrektorami Administracji b\u0119dzie to du\u017cy plus.</p></li><li><p class=\"editor-paragraph\">Zorientowanie na cel - d\u0105\u017cenie do celu jest dla Ciebie motywuj\u0105ce i lubisz szuka\u0107 r\u00f3\u017cnych dr\u00f3g do jego osi\u0105gni\u0119cia.&nbsp;</p></li><li><p class=\"editor-paragraph\">Analityczne my\u015blenie - potrafisz analizowa\u0107 dane sprzeda\u017cowe i wyci\u0105ga\u0107 trafne wnioski. Poj\u0119cia jak lejek sprzeda\u017cowy, konwersja, czy d\u0142ugo\u015b\u0107 \u017cycia klienta nie s\u0105 Ci obce.</p></li><li><p class=\"editor-paragraph\">Umiej\u0119tno\u015b\u0107 mapowania procesu decyzyjnego - potrafisz zidentyfikowa\u0107 kluczowe osoby decyzyjne oraz ich potrzeby, dzi\u0119ki czemu skutecznie docierasz do w\u0142a\u015bciwych rozm\u00f3wc\u00f3w.</p></li><li><p class=\"editor-paragraph\">Odporno\u015b\u0107 na \u201cnie\u201d od klienta - rozumiesz, \u017ce odmowa jest naturalnym elementem procesu sprzeda\u017cy i potrafisz przeku\u0107 j\u0105 w motywacj\u0119 do dalszego dzia\u0142ania.</p></li><li><p class=\"editor-paragraph\">Dobra organizacja pracy - CRM, kalendarz i lista zada\u0144 to Twoi przyjaciele (pracujemy na Pipedrive CRM)</p></li><li><p class=\"editor-paragraph\">Nastawienie na rozwi\u0105zania - gdy pojawia si\u0119 problem, zamiast narzeka\u0107, skupiasz si\u0119 na znalezieniu najlepszego rozwi\u0105zania.</p></li><li><p class=\"editor-paragraph\">G\u0142\u00f3d wiedzy - stale doskonalisz swoje kompetencje sprzeda\u017cowe oraz umiej\u0119tno\u015bci interpersonalne. Lubisz zdobywa\u0107 now\u0105 wiedz\u0119 i dzieli\u0107 si\u0119 ni\u0105 z innymi.</p></li><li><p class=\"editor-paragraph\">Prawo jazdy kategorii B&nbsp;- spotkania z klientami odbywaj\u0105 si\u0119 face to face.&nbsp;</p></li><li><p class=\"editor-paragraph\">Znajomo\u015b\u0107 j\u0119zyka angielskiego na poziomie min. B1.</p></li></ul><p class=\"editor-paragraph\"><strong>\ud83d\udccc Mile widziane:</strong></p><ul><li><p class=\"editor-paragraph\">Znajomo\u015b\u0107 narz\u0119dzi prospectingowych (Sales Navigator, Hunter.io lub pokrewne).&nbsp;</p></li><li><p class=\"editor-paragraph\">Znajomo\u015b\u0107 systemu Pipedrive.</p></li></ul><p class=\"editor-paragraph\"><strong>\ud83c\udfc6 To oferujemy:</strong></p><ul><li><p class=\"editor-paragraph\">Atrakcyjny system wynagrodzenia - Twoje wynagrodzenie b\u0119dzie sk\u0142ada\u0107 si\u0119 z podstawy w wysoko\u015bci od 10 000 z\u0142 netto (wsp\u00f3\u0142praca b2b) oraz przejrzystego systemu premiowego uzale\u017cnionego od osi\u0105gni\u0119tych wynik\u00f3w sprzeda\u017cowych. Najlepsi zarabiaj\u0105 nawet dodatkowo 10 000 z\u0142 netto miesi\u0119cznie.</p></li><li><p class=\"editor-paragraph\">Pakiet benefit\u00f3w - opieka medyczna oraz multisport.</p></li><li><p class=\"editor-paragraph\">Komplet narz\u0119dzi do pracy - komputer, telefon.</p></li><li><p class=\"editor-paragraph\">Mo\u017cliwo\u015b\u0107 korzystania z samochodu s\u0142u\u017cbowego po okresie pr\u00f3bnym - w czasie jego trwania mo\u017cesz korzysta\u0107 z Bolt Bussines lub otrzyma\u0107 rycza\u0142t na przejazdy samochodem prywatnym.</p></li></ul><p class=\"editor-paragraph\"><strong>\ud83c\udfaf Dodatkowo:</strong></p><ul><li><p class=\"editor-paragraph\">Wsparcie do\u015bwiadczonego lidera - b\u0119dziesz wsp\u00f3\u0142pracowa\u0142 z prze\u0142o\u017conym, kt\u00f3ry doskonale zna realia sprzeda\u017cy b2b, rozumie specyfik\u0119 bran\u017cy i ma za sob\u0105 setki rozm\u00f3w handlowych we Fresh Office, jak iw innych firmach.</p></li><li><p class=\"editor-paragraph\">Prac\u0119 w firmie o ugruntowanej pozycji na rynku - Fresh Office to marka ceniona przez klient\u00f3w premium za profesjonalne us\u0142ugi ekologicznego sprz\u0105tania. Wyr\u00f3\u017cnia nas \u015bwie\u017ce podej\u015bcie do tradycyjnej bran\u017cy: najwy\u017csza jako\u015b\u0107 us\u0142ug, efektywna komunikacja i szacunek do naszych pracownik\u00f3w (nie zatrudniamy \u201esprz\u0105taczek\u201d, lecz \u201epanie sprz\u0105taj\u0105ce\u201d).</p></li><li><p class=\"editor-paragraph\">Mo\u017cliwo\u015b\u0107 rozwoju osobistego i zawodowego - wspieramy Tw\u00f3j rozw\u00f3j oraz dajemy przestrze\u0144 na wypracowanie indywidualnej \u015bcie\u017cki kariery w dziale sprzeda\u017cy.</p></li><li><p class=\"editor-paragraph\">Zgrany zesp\u00f3\u0142 - staniesz si\u0119 cz\u0119\u015bci\u0105 teamu #freshpeople, kt\u00f3ry gra do jednej bramki i wzajemnie si\u0119 wspiera.&nbsp;</p></li><li><p class=\"editor-paragraph\">Elastyczny model pracy - pracujemy hybrydowo: spotykamy si\u0119 w biurze 2-3 dni w tygodniu, reszt\u0119 czasu mo\u017cesz pracowa\u0107 zdalnie.</p></li></ul><p class=\"editor-paragraph\">\ud83e\uddd1\u200d\ud83d\udcbc<strong>Jak przebiega proces rekrutacji?</strong></p><ul><li><p class=\"editor-paragraph\">Weryfikacja CV - poznamy Twoje do\u015bwiadczenie i sprawdzimy, czy pasujemy do siebie.</p></li><li><p class=\"editor-paragraph\">Rozmowa online/f2f z naszym HRBP.</p></li><li><p class=\"editor-paragraph\">Spotkanie na \u017cywo z Team Leaderk\u0105 - <a class=\"editor-link\" href=\"https://www.linkedin.com/in/alicja-migda%C5%82-3aa3a4205/\" target=\"_blank\" rel=\"nofollow noreferrer noopener\">Alicj\u0105</a> \ud83c\udf4b</p></li><li><p class=\"editor-paragraph\">No i na koniec, mo\u017cesz spodziewa\u0107 si\u0119 oferty lub telefonicznego feedbacku z podzi\u0119kowaniem za udzia\u0142 w procesie rekrutacji.</p></li><li><p></p></li></ul><p class=\"editor-paragraph\">Je\u017celi po przeczytaniu tego og\u0142oszenia stwierdzasz, \u017ce to mo\u017ce by\u0107 praca dla Ciebie prze\u015blij nam swoje CV i napisz kilka s\u0142\u00f3w o sobie (rozwlek\u0142y i szablonowy list motywacyjny nie jest mile widziany).</p><p class=\"editor-paragraph\">Zapraszamy do aplikowania! \ud83d\udce9</p>\n83:T575,Informujemy, \u017ce administratorem danych jest Fresh Office Poland Sp. z o.o.  z siedzib\u0105 w Krakowie, ul. Fabryczna 20a (dalej jako \"administrator\"). Masz prawo do \u017c\u0105dania dost\u0119pu do swoich danych osobowych, ich sprostowania, usuni\u0119cia lub ograniczenia przetwarzania, prawo do wniesienia sprzeciwu wobec przetwarzania, a tak\u017ce prawo do przenoszenia danych oraz wniesienia skargi do organu nadzorczego. Dane osobowe przetwarzane b\u0119d\u0105 w celu realizacji procesu rekrutacji. Podanie danych w zakresie wynikaj\u0105cym z ustawy z dnia 26 czerwca 1974 r. Kodeks pracy jest obowi\u0105zkowe. W pozosta\u0142ym zakresie podanie danych jest dobrowolne. Odmowa podania danych obowi\u0105zkowych mo\u017ce skutkowa\u0107 brakiem mo\u017cliwo\u015bci przeprowadzenia procesu rekrutacji. Administrator przetwarza dane obowi\u0105zkowe na podstawie ci\u0105\u017c\u0105cego na nim obowi\u0105zku prawnego, za\u015b w zakresie danych dodatkowych podstaw\u0105 przetwarzania jest zgoda. Dane osobowe b\u0119d\u0105 przetwarzane do czasu zako\u0144czenia post\u0119powania rekrutacyjnego i przez okres mo\u017cliwo\u015bci dochodzenia ewentualnych roszcze\u0144, a w przypadku wyra\u017cenia zgody na udzia\u0142 w przysz\u0142ych post\u0119powaniach rekrutacyjnych - do czasu wycofania tej zgody. Zgoda na przetwarzanie danych osobowych mo\u017ce zosta\u0107 wycofana w dowolnym momencie. Odbiorc\u0105 danych jest serwis Rocket Jobs oraz inne podmioty, kt\u00f3rym powierzyli\u015bmy przetwarzanie danych w zwi\u0105zku z rekrutacj\u0105.\n"])</script></body></html>
